<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ساحر GitHub - جلب المشاريع</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0e17; color: #e8e6e3; font-family: 'Tahoma', sans-serif; }
        .github-color { color: #f0f6fc; }
        .github-green { color: #3fb950; }
        .github-bg { background: #3fb950; color: #0a0e17; border: none; font-weight: 700; }
        .github-bg:hover { background: #2ea043; color: #fff; }
        .card-dark { background: #111927; border: 1px solid rgba(63,185,80,0.15); border-radius: 16px; padding: 20px; }
        .card-dark:hover { border-color: #3fb950; }
        .form-control { background: #0d1117; border: 1px solid #30363d; color: #e8e6e3; border-radius: 10px; padding: 12px 16px; }
        .form-control:focus { border-color: #3fb950; box-shadow: 0 0 0 0.2rem rgba(63,185,80,0.2); }
        .repo-card { background: #0d1117; border: 1px solid #30363d; border-radius: 12px; padding: 16px; transition: 0.3s; cursor: pointer; }
        .repo-card:hover { border-color: #3fb950; transform: translateY(-3px); box-shadow: 0 0 30px rgba(63,185,80,0.1); }
        .repo-stats { display: flex; gap: 15px; font-size: 0.85rem; color: #8b949e; }
        .repo-stats i { margin-left: 5px; }
        .lang-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-left: 6px; }
        .toast-container { position: fixed; top: 20px; left: 20px; z-index: 99999; max-width: 360px; }
        .toast-custom { background: #111927; border: 1px solid #3fb950; border-radius: 12px; padding: 12px 18px; margin-bottom: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.6); }
        .toast-custom.success { border-color: #3fb950; }
        .toast-custom.error { border-color: #f85149; }
        .toast-custom.info { border-color: #0dcaf0; }
        .progress-container { background: #0d1117; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .progress-bar-custom { height: 16px; background: linear-gradient(90deg, #3fb950, #2ea043); width: 0%; transition: width 0.4s; }
        .search-section { background: #111927; border-radius: 16px; padding: 20px; border: 1px solid #30363d; }
        .pagination-btn { background: transparent; border: 1px solid #30363d; color: #e8e6e3; padding: 6px 14px; border-radius: 6px; transition: 0.3s; }
        .pagination-btn:hover { border-color: #3fb950; background: rgba(63,185,80,0.1); }
        .pagination-btn.active { background: #3fb950; border-color: #3fb950; color: #0a0e17; }
    </style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<!-- ====== NAV ====== -->
<nav class="navbar sticky-top" style="background: rgba(17,25,39,0.98); border-bottom: 2px solid #3fb950;">
    <div class="container">
        <a class="navbar-brand fw-bold github-color" href="#"><i class="fab fa-github"></i> ساحر <span style="color:#3fb950;">GitHub</span></a>
        <span class="text-secondary small"><i class="fas fa-database github-green"></i> <span id="repoCount">0</span></span>
    </div>
</nav>

<div class="container py-4">

    <!-- ====== SEARCH ====== -->
    <div class="search-section mb-4">
        <div class="row g-3 align-items-center">
            <div class="col-md-5">
                <input type="text" id="searchInput" class="form-control" placeholder="🔍 ابحث عن مشروع... (مثال: hack, whatsapp, bot)" />
            </div>
            <div class="col-md-3">
                <select id="languageFilter" class="form-control">
                    <option value="">كل اللغات</option>
                    <option value="javascript">JavaScript</option>
                    <option value="python">Python</option>
                    <option value="java">Java</option>
                    <option value="cpp">C++</option>
                    <option value="csharp">C#</option>
                    <option value="php">PHP</option>
                    <option value="go">Go</option>
                    <option value="rust">Rust</option>
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                </select>
            </div>
            <div class="col-md-2">
                <select id="sortFilter" class="form-control">
                    <option value="stars">⭐ الأكثر نجماً</option>
                    <option value="updated">🔄 الأحدث تحديثاً</option>
                    <option value="forks">🔀 الأكثر شوكاً</option>
                </select>
            </div>
            <div class="col-md-2">
                <button class="btn github-bg w-100" onclick="searchRepos()"><i class="fas fa-search"></i> بحث</button>
            </div>
        </div>
    </div>

    <!-- ====== RESULTS ====== -->
    <div id="resultsContainer">
        <div class="card-dark text-center py-5" id="emptyState">
            <i class="fab fa-github fa-4x github-green mb-3"></i>
            <h4>ابحث عن مشاريع GitHub</h4>
            <p class="text-secondary">اكتب كلمة بحث أو اختر لغة وابدأ الاستكشاف</p>
            <button class="btn github-bg mt-2" onclick="searchRepos()"><i class="fas fa-rocket"></i> استكشف الآن</button>
        </div>
        <div id="reposGrid" class="row g-3 d-none"></div>
    </div>

    <!-- ====== PAGINATION ====== -->
    <div id="paginationContainer" class="d-flex justify-content-center gap-2 mt-4 d-none">
        <button class="pagination-btn" id="prevPage" onclick="changePage(-1)"><i class="fas fa-chevron-right"></i></button>
        <span id="pageInfo" class="text-secondary d-flex align-items-center"></span>
        <button class="pagination-btn" id="nextPage" onclick="changePage(1)"><i class="fas fa-chevron-left"></i></button>
    </div>

</div>

<footer class="text-center py-3 text-secondary border-top" style="border-color:rgba(63,185,80,0.1)!important;">
    <i class="fab fa-github github-green"></i> ساحر GitHub — جلب المشاريع + تفاصيل كاملة
</footer>

<script>
// ============================================================
// 1. STATE
// ============================================================
let currentRepos = [];
let currentPage = 1;
const PER_PAGE = 12;
let totalResults = 0;
let searchQuery = '';
let selectedLanguage = '';
let selectedSort = 'stars';

// ============================================================
// 2. SEARCH REPOS
// ============================================================
async function searchRepos() {
    searchQuery = document.getElementById('searchInput').value.trim() || 'hack';
    selectedLanguage = document.getElementById('languageFilter').value;
    selectedSort = document.getElementById('sortFilter').value;
    currentPage = 1;
    
    showToast('⏳', 'جاري البحث عن المشاريع...', 'info');
    document.getElementById('extractProgress').style.width = '20%';
    
    try {
        let query = searchQuery;
        if (selectedLanguage) query += ` language:${selectedLanguage}`;
        
        let sortParam = 'stars';
        if (selectedSort === 'updated') sortParam = 'updated';
        if (selectedSort === 'forks') sortParam = 'forks';
        
        const url = `https://api.github.com/search/repositories?q=${encodeURIComponent(query)}&sort=${sortParam}&order=desc&per_page=100`;
        
        const response = await fetch(url, {
            headers: {
                'Accept': 'application/vnd.github.v3+json',
                'User-Agent': 'Mozilla/5.0'
            }
        });
        
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        const data = await response.json();
        currentRepos = data.items || [];
        totalResults = data.total_count || 0;
        
        if (currentRepos.length === 0) {
            document.getElementById('emptyState').classList.remove('d-none');
            document.getElementById('reposGrid').classList.add('d-none');
            document.getElementById('paginationContainer').classList.add('d-none');
            showToast('⚠️', 'لم يتم العثور على مشاريع', 'error');
            return;
        }
        
        document.getElementById('emptyState').classList.add('d-none');
        document.getElementById('reposGrid').classList.remove('d-none');
        document.getElementById('paginationContainer').classList.remove('d-none');
        
        renderRepos();
        updatePagination();
        document.getElementById('extractProgress').style.width = '100%';
        showToast('✅', `تم العثور على ${totalResults} مشروع`, 'success');
        
    } catch (e) {
        showToast('❌', `خطأ: ${e.message}`, 'error');
        document.getElementById('extractProgress').style.width = '0%';
    }
}

// ============================================================
// 3. RENDER REPOS
// ============================================================
function renderRepos() {
    const grid = document.getElementById('reposGrid');
    const start = (currentPage - 1) * PER_PAGE;
    const end = start + PER_PAGE;
    const pageRepos = currentRepos.slice(start, end);
    
    if (pageRepos.length === 0) {
        grid.innerHTML = `<div class="col-12 text-center text-secondary py-4">لا توجد مشاريع في هذه الصفحة</div>`;
        return;
    }
    
    grid.innerHTML = pageRepos.map(repo => `
        <div class="col-md-6 col-lg-4">
            <div class="repo-card" onclick="openRepo('${repo.html_url}')">
                <div class="d-flex justify-content-between align-items-start">
                    <h5 class="github-green" style="font-size:1rem;">
                        <i class="fas fa-book"></i> ${repo.full_name}
                    </h5>
                    ${repo.fork ? '<span class="badge bg-secondary">🍴 Fork</span>' : ''}
                </div>
                <p class="text-secondary small" style="height:50px;overflow:hidden;">
                    ${repo.description || 'لا يوجد وصف'}
                </p>
                <div class="d-flex flex-wrap gap-2 mt-2">
                    ${repo.language ? `
                        <span class="badge" style="background:rgba(63,185,80,0.2);color:#3fb950;">
                            <span class="lang-dot" style="background:${getLangColor(repo.language)};"></span>
                            ${repo.language}
                        </span>
                    ` : ''}
                    ${repo.license ? `<span class="badge bg-secondary">${repo.license.name}</span>` : ''}
                </div>
                <div class="repo-stats mt-2">
                    <span><i class="fas fa-star github-green"></i> ${formatNumber(repo.stargazers_count)}</span>
                    <span><i class="fas fa-code-fork github-green"></i> ${formatNumber(repo.forks_count)}</span>
                    <span><i class="fas fa-eye github-green"></i> ${formatNumber(repo.watchers_count)}</span>
                    <span><i class="fas fa-calendar-alt"></i> ${formatDate(repo.updated_at)}</span>
                </div>
                <div class="mt-2 d-flex gap-2 flex-wrap">
                    <a href="${repo.html_url}" target="_blank" class="btn btn-sm btn-outline-success" onclick="event.stopPropagation();">
                        <i class="fab fa-github"></i> عرض
                    </a>
                    <a href="${repo.html_url}/archive/refs/heads/main.zip" target="_blank" class="btn btn-sm btn-outline-light" onclick="event.stopPropagation();">
                        <i class="fas fa-download"></i> تحميل
                    </a>
                    <button class="btn btn-sm btn-outline-warning" onclick="event.stopPropagation();cloneRepo('${repo.clone_url}')">
                        <i class="fas fa-clone"></i> نسخ الرابط
                    </button>
                </div>
            </div>
        </div>
    `).join('');
    
    document.getElementById('repoCount').textContent = currentRepos.length;
}

// ============================================================
// 4. PAGINATION
// ============================================================
function updatePagination() {
    const totalPages = Math.ceil(currentRepos.length / PER_PAGE);
    document.getElementById('pageInfo').textContent = `الصفحة ${currentPage} من ${totalPages}`;
    document.getElementById('prevPage').disabled = currentPage <= 1;
    document.getElementById('nextPage').disabled = currentPage >= totalPages;
}

function changePage(delta) {
    const totalPages = Math.ceil(currentRepos.length / PER_PAGE);
    const newPage = currentPage + delta;
    if (newPage < 1 || newPage > totalPages) return;
    currentPage = newPage;
    renderRepos();
    updatePagination();
    document.getElementById('reposGrid').scrollIntoView({ behavior: 'smooth' });
}

// ============================================================
// 5. UTILITIES
// ============================================================
function formatNumber(num) {
    if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
    return num;
}

function formatDate(dateStr) {
    const d = new Date(dateStr);
    const now = new Date();
    const diff = Math.floor((now - d) / (1000 * 60 * 60 * 24));
    if (diff === 0) return 'اليوم';
    if (diff < 7) return `${diff} يوم`;
    if (diff < 30) return `${Math.floor(diff / 7)} أسبوع`;
    if (diff < 365) return `${Math.floor(diff / 30)} شهر`;
    return `${Math.floor(diff / 365)} سنة`;
}

function getLangColor(lang) {
    const colors = {
        'JavaScript': '#f1e05a',
        'Python': '#3572A5',
        'Java': '#b07219',
        'C++': '#f34b7d',
        'C#': '#178600',
        'PHP': '#4F5D95',
        'Go': '#00ADD8',
        'Rust': '#dea584',
        'HTML': '#e34c26',
        'CSS': '#563d7c',
        'TypeScript': '#3178c6',
        'Ruby': '#701516'
    };
    return colors[lang] || '#8b949e';
}

function openRepo(url) {
    window.open(url, '_blank');
}

function cloneRepo(url) {
    navigator.clipboard?.writeText(url);
    showToast('✅', 'تم نسخ رابط الاستنساخ', 'success');
}

// ============================================================
// 6. TOAST
// ============================================================
function showToast(title, msg, type = 'info') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast-custom ${type}`;
    toast.innerHTML = `<strong>${title}</strong> ${msg}`;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 5000);
}

// ============================================================
// 7. AUTO SEARCH ON ENTER
// ============================================================
document.getElementById('searchInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') searchRepos();
});

// ============================================================
// 8. INIT
// ============================================================
console.log('✅ ساحر GitHub جاهز');
showToast('🚀', 'ابحث عن أي مشروع على GitHub', 'info');

// ============================================================
// 9. EXTRA: جلب مشاريع محددة (هكر/واتساب)
// ============================================================
// يمكن استخدام هذه الوظيفة لجلب مشاريع معينة
function fetchSpecificRepos() {
    document.getElementById('searchInput').value = 'whatsapp hack';
    searchRepos();
}

// عرض مشاريع متميزة
function fetchFeatured() {
    document.getElementById('searchInput').value = 'star:>1000 hack';
    searchRepos();
}

// ============================================================
// 10. تصدير المشاريع
// ============================================================
function exportRepos() {
    if (currentRepos.length === 0) {
        showToast('⚠️', 'لا توجد مشاريع للتصدير', 'error');
        return;
    }
    const data = currentRepos.map(r => ({
        name: r.full_name,
        description: r.description,
        stars: r.stargazers_count,
        forks: r.forks_count,
        language: r.language,
        url: r.html_url
    }));
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'github_repos_export.json';
    a.click();
    showToast('✅', 'تم تصدير المشاريع', 'success');
}
</script>
</body>
</html>
