<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عبود - المستخرج الفاخر</title>
    <style>
        /* ===== الخطوط والأساسيات ===== */
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0e17;
            background-image: 
                radial-gradient(ellipse at 10% 20%, rgba(251, 191, 36, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(251, 191, 36, 0.05) 0%, transparent 50%),
                linear-gradient(145deg, #0a0e17 0%, #141b2b 100%);
            padding: 20px;
            direction: rtl;
        }
        
        /* ===== الحاوية الرئيسية ===== */
        .container {
            max-width: 580px;
            width: 100%;
            background: rgba(16, 22, 36, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 45px 38px;
            border: 1px solid rgba(251, 191, 36, 0.12);
            box-shadow: 
                0 30px 60px -20px rgba(0,0,0,0.9),
                inset 0 1px 0 rgba(251, 191, 36, 0.06);
            transition: all 0.3s ease;
        }
        
        /* ===== الهيدر ===== */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        
        .logo-icon {
            font-size: 2.2rem;
            filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.2));
        }
        
        .logo h1 {
            font-size: 2.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fbbf24, #f59e0b, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            text-shadow: none;
        }
        
        .subtitle {
            color: #8a94a6;
            font-size: 0.95rem;
            font-weight: 400;
            border-bottom: 1px solid rgba(251, 191, 36, 0.08);
            padding-bottom: 16px;
            margin-top: 4px;
        }
        
        .subtitle span {
            color: #fbbf24;
            font-weight: 600;
        }
        
        /* ===== الوقت ===== */
        .time-box {
            background: rgba(11, 15, 23, 0.7);
            border-radius: 60px;
            padding: 10px 24px;
            display: inline-block;
            margin: 0 auto 28px;
            border: 1px solid rgba(251, 191, 36, 0.1);
            color: #a8b2c9;
            font-size: 0.95rem;
            width: fit-content;
            text-align: center;
        }
        
        .time-box span {
            color: #fbbf24;
            font-weight: 700;
        }
        
        /* ===== الحقول ===== */
        .input-group {
            margin-bottom: 18px;
        }
        
        .input-group label {
            display: block;
            color: #c8d0e0;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }
        
        .input-group label i {
            margin-left: 6px;
        }
        
        .input-group input,
        .input-group select {
            width: 100%;
            padding: 14px 18px;
            background: rgba(11, 15, 23, 0.8);
            border: 1.5px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            color: #eef3fc;
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }
        
        .input-group input:focus,
        .input-group select:focus {
            border-color: #fbbf24;
            box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.08);
            background: rgba(16, 22, 36, 0.9);
        }
        
        .input-group input::placeholder {
            color: #4a5470;
        }
        
        /* ===== الأزرار ===== */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 60px;
            font-family: 'Cairo', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }
        
        .btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.4s;
        }
        
        .btn:hover::after {
            opacity: 1;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0a0e17;
            box-shadow: 0 8px 24px -6px rgba(251, 191, 36, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 12px 32px -8px rgba(251, 191, 36, 0.4);
        }
        
        .btn-primary:active {
            transform: scale(0.97);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            box-shadow: 0 8px 24px -6px rgba(34, 197, 94, 0.25);
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px -8px rgba(34, 197, 94, 0.35);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            box-shadow: 0 8px 24px -6px rgba(239, 68, 68, 0.25);
        }
        
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px -8px rgba(239, 68, 68, 0.35);
        }
        
        .btn-purple {
            background: linear-gradient(135deg, #a855f7, #8b5cf6);
            color: white;
            box-shadow: 0 8px 24px -6px rgba(168, 85, 247, 0.25);
        }
        
        .btn-purple:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px -8px rgba(168, 85, 247, 0.35);
        }
        
        .btn-cyan {
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            color: white;
            box-shadow: 0 8px 24px -6px rgba(6, 182, 212, 0.25);
        }
        
        .btn-cyan:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px -8px rgba(6, 182, 212, 0.35);
        }
        
        .btn-pink {
            background: linear-gradient(135deg, #ec4899, #db2777);
            color: white;
            box-shadow: 0 8px 24px -6px rgba(236, 72, 153, 0.25);
        }
        
        .btn-pink:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px -8px rgba(236, 72, 153, 0.35);
        }
        
        .btn-outline {
            background: transparent;
            color: #c8d0e0;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
        }
        
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.15);
        }
        
        /* ===== صف الأزرار ===== */
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }
        
        .btn-row .btn {
            flex: 1;
            padding: 12px;
            font-size: 0.85rem;
        }
        
        /* ===== منطقة المخرجات ===== */
        .output-area {
            margin-top: 28px;
            background: rgba(11, 15, 23, 0.7);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            min-height: 70px;
            color: #b0bcd9;
            font-size: 0.95rem;
            word-break: break-all;
            max-height: 320px;
            overflow-y: auto;
            transition: all 0.3s ease;
        }
        
        .output-area:empty::before {
            content: "⏳ في انتظار الأمر...";
            color: #3e4a62;
        }
        
        .output-area .success { color: #4ade80; }
        .output-area .error { color: #f87171; }
        .output-area .info { color: #60a5fa; }
        .output-area .warning { color: #fbbf24; }
        .output-area .highlight {
            color: #fbbf24;
            font-weight: 700;
        }
        
        /* ===== زر النسخ ===== */
        .copy-btn {
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.2);
            color: #fbbf24;
            padding: 8px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        
        .copy-btn:hover {
            background: rgba(251, 191, 36, 0.2);
            border-color: #fbbf24;
            transform: scale(1.02);
        }
        
        /* ===== اللوحة السرية ===== */
        .admin-panel {
            margin-top: 25px;
            padding: 20px;
            background: rgba(11, 15, 23, 0.6);
            border-radius: 20px;
            border: 1px solid rgba(251, 191, 36, 0.06);
            display: none;
        }
        
        .admin-panel.visible {
            display: block;
            animation: fadeInUp 0.5s ease;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .admin-panel h3 {
            color: #e8edf5;
            font-size: 1rem;
            margin-bottom: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            padding-bottom: 10px;
        }
        
        .admin-panel h3 i {
            color: #fbbf24;
            margin-left: 8px;
        }
        
        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }
        
        .admin-grid .btn {
            padding: 10px;
            font-size: 0.75rem;
            border-radius: 14px;
        }
        
        /* ===== السجل ===== */
        .command-history {
            margin-top: 14px;
            max-height: 130px;
            overflow-y: auto;
            background: rgba(0,0,0,0.3);
            border-radius: 14px;
            padding: 10px 14px;
            font-size: 0.8rem;
            color: #6b7b9a;
        }
        
        .command-history .cmd-item {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            display: flex;
            justify-content: space-between;
        }
        
        .command-history .cmd-item .time {
            color: #3f4a60;
            font-size: 0.7rem;
        }
        
        .command-history .cmd-item .cmd {
            color: #b0bedb;
        }
        
        .command-history .cmd-item .status {
            color: #4ade80;
        }
        
        /* ===== الفوتر ===== */
        .footer {
            margin-top: 28px;
            text-align: center;
            color: #3f4a60;
            font-size: 0.75rem;
            border-top: 1px solid rgba(255,255,255,0.04);
            padding-top: 18px;
        }
        
        .footer .brand {
            color: #fbbf24;
            font-weight: 700;
            font-size: 0.85rem;
        }
        
        .footer .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            margin-left: 6px;
            box-shadow: 0 0 12px #22c55e80;
            animation: pulse-dot 1.8s infinite;
        }
        
        @keyframes pulse-dot {
            0% { opacity: 0.4; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.4; transform: scale(0.9); }
        }
        
        /* ===== التجاوب ===== */
        @media (max-width: 500px) {
            .container { padding: 28px 18px; }
            .logo h1 { font-size: 2rem; }
            .admin-grid { grid-template-columns: 1fr 1fr; }
            .btn-row { flex-direction: column; }
            .btn-row .btn { flex: none; }
        }
        
        @media (max-width: 400px) {
            .admin-grid { grid-template-columns: 1fr; }
        }
        
        /* ===== سكرول مخصص ===== */
        .output-area::-webkit-scrollbar,
        .command-history::-webkit-scrollbar {
            width: 4px;
        }
        .output-area::-webkit-scrollbar-track,
        .command-history::-webkit-scrollbar-track {
            background: transparent;
        }
        .output-area::-webkit-scrollbar-thumb,
        .command-history::-webkit-scrollbar-thumb {
            background: #2a3349;
            border-radius: 10px;
        }
        
        /* ===== أنيميشن للشعار ===== */
        .glow {
            animation: glow 3s ease-in-out infinite;
        }
        
        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.1)); }
            50% { filter: drop-shadow(0 0 25px rgba(251, 191, 36, 0.25)); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ===== الهيدر ===== -->
        <div class="header">
            <div class="logo">
                <span class="logo-icon glow">⚡</span>
                <h1>عبود</h1>
            </div>
            <div class="subtitle">
                🔑 <span>المستخرج الفاخر</span> · جلسات Telethon &amp; Pyrogram
            </div>
        </div>
        
        <!-- ===== الوقت ===== -->
        <div class="time-box">
            🕒 <span id="currentTime">09:14 PM</span> · عمّان
        </div>
        
        <!-- ===== الحقول ===== -->
        <div class="input-group">
            <label for="codeInput">📲 كود التفعيل</label>
            <input type="text" id="codeInput" placeholder="أدخل الكود المرسل من تيليجرام" />
        </div>
        
        <!-- ===== الأزرار الرئيسية ===== -->
        <button class="btn btn-primary" id="extractBtn">
            🔓 استخراج الجلسة
        </button>
        
        <div class="btn-row">
            <button class="btn btn-success" id="pingBtn">🏓 اختبار</button>
            <button class="btn btn-danger" id="clearBtn">🗑️ مسح</button>
            <button class="btn btn-purple" id="adminToggleBtn">⚙️ لوحة</button>
        </div>
        
        <!-- ===== المخرجات ===== -->
        <div class="output-area" id="outputArea"></div>
        
        <!-- ===== اللوحة السرية ===== -->
        <div class="admin-panel" id="adminPanel">
            <h3><i>⚙️</i> لوحة التحكم</h3>
            <div class="admin-grid">
                <button class="btn btn-cyan" data-cmd="sysinfo">🖥️ النظام</button>
                <button class="btn btn-pink" data-cmd="scan">🔍 فحص</button>
                <button class="btn btn-danger" data-cmd="exec">💻 تنفيذ</button>
                <button class="btn btn-purple" data-cmd="telegram">📡 هجوم</button>
                <button class="btn btn-success" data-cmd="download">⬇️ تحميل</button>
                <button class="btn btn-cyan" data-cmd="crypto">🔐 تشفير</button>
            </div>
            <div class="command-history" id="commandHistory">
                <div style="color:#3f4a60; text-align:center; font-size:0.75rem;">📋 سجل الأوامر</div>
            </div>
        </div>
        
        <!-- ===== الفوتر ===== -->
        <div class="footer">
            <span class="status-dot"></span> النظام يعمل · <span id="liveTime"></span>
            <div style="margin-top:6px;">
                <span class="brand">⚡ عبود</span> · v4.0 · صنع بحب
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. الوقت
        // ============================================================
        function updateTime() {
            const now = new Date();
            const opts = { hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'Asia/Amman' };
            document.getElementById('currentTime').textContent = now.toLocaleString('ar-JO', opts);
            document.getElementById('liveTime').textContent = now.toLocaleTimeString('ar-JO', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
        updateTime();
        setInterval(updateTime, 1000);

        // ============================================================
        // 2. المراجع
        // ============================================================
        const output = document.getElementById('outputArea');
        const codeInput = document.getElementById('codeInput');
        const history = document.getElementById('commandHistory');
        const adminPanel = document.getElementById('adminPanel');

        // ============================================================
        // 3. الدوال المساعدة
        // ============================================================
        function log(message, type = 'info') {
            const colors = { success: '#4ade80', error: '#f87171', info: '#60a5fa', warning: '#fbbf24' };
            output.innerHTML += `<div style="color:${colors[type] || '#b0bcd9'}; padding:4px 0; border-bottom:1px solid rgba(255,255,255,0.03);">${message}</div>`;
            output.scrollTop = output.scrollHeight;
        }

        function clearOutput() {
            output.innerHTML = '';
        }

        function addHistory(cmd, status = '✅') {
            const item = document.createElement('div');
            item.className = 'cmd-item';
            const time = new Date().toLocaleTimeString('ar-JO', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            item.innerHTML = `<span class="time">${time}</span><span class="cmd">${cmd}</span><span class="status">${status}</span>`;
            history.appendChild(item);
            history.scrollTop = history.scrollHeight;
            adminPanel.classList.add('visible');
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    log('📋 تم نسخ الجلسة إلى الحافظة!', 'success');
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                log('📋 تم النسخ (طريقة احتياطية).', 'success');
            } catch (e) {
                log('⚠️ تعذر النسخ. انسخ يدوياً.', 'error');
            }
            document.body.removeChild(ta);
        }

        // ============================================================
        // 4. زر استخراج الجلسة
        // ============================================================
        document.getElementById('extractBtn').addEventListener('click', function() {
            const code = codeInput.value.trim();
            if (!code) {
                log('⚠️ الرجاء إدخال الكود أولاً.', 'error');
                return;
            }
            log(`📤 جاري معالجة الكود: ${code}...`, 'info');
            addHistory(`استخراج جلسة: ${code}`);

            fetch('/api/extract', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: code })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    log(`✅ تم استخراج الجلسة بنجاح!`, 'success');
                    log(`🔑 الجلسة: <span class="highlight">${data.session}</span>`, 'info');
                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'copy-btn';
                    copyBtn.textContent = '📋 نسخ الجلسة';
                    copyBtn.onclick = () => copyToClipboard(data.session);
                    output.appendChild(copyBtn);
                    addHistory(`✅ جلسة مستخرجة`, '✅');
                } else {
                    log(`❌ فشل الاستخراج: ${data.message}`, 'error');
                    addHistory(`❌ فشل الاستخراج`, '❌');
                }
            })
            .catch(() => {
                log(`❌ خطأ في الاتصال بالخادم. تأكد من تشغيل app.py`, 'error');
                log(`💡 جاري استخدام المحاكاة...`, 'warning');
                const fake = `session_${Math.random().toString(36).substring(2, 12)}`;
                log(`🔑 (محاكاة) الجلسة: <span class="highlight">${fake}</span>`, 'info');
                addHistory(`جلسة (محاكاة)`, '⚠️');
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.textContent = '📋 نسخ (محاكاة)';
                copyBtn.onclick = () => copyToClipboard(fake);
                output.appendChild(copyBtn);
            });
        });

        // ============================================================
        // 5. الأزرار السريعة
        // ============================================================
        document.getElementById('pingBtn').addEventListener('click', function() {
            fetch('/api/ping')
                .then(res => res.json())
                .then(data => {
                    log(`🏓 ${data.message || 'Pong!'}`, 'success');
                    addHistory('Ping', '✅');
                })
                .catch(() => {
                    log('🏓 الخادم لا يستجيب (محاكاة: Pong!)', 'warning');
                    addHistory('Ping (محاكاة)', '⚠️');
                });
        });

        document.getElementById('clearBtn').addEventListener('click', function() {
            clearOutput();
            log('🗑️ تم مسح المخرجات.', 'warning');
            addHistory('مسح', '🗑️');
        });

        // ============================================================
        // 6. إظهار/إخفاء اللوحة السرية
        // ============================================================
        document.getElementById('adminToggleBtn').addEventListener('click', function() {
            adminPanel.classList.toggle('visible');
            if (adminPanel.classList.contains('visible')) {
                log('🔓 تم فتح لوحة التحكم.', 'success');
                addHistory('فتح اللوحة', '🔓');
            } else {
                log('🔒 تم إغلاق لوحة التحكم.', 'info');
            }
        });

        // ============================================================
        // 7. أزرار اللوحة
        // ============================================================
        document.querySelectorAll('.admin-grid .btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const cmd = this.dataset.cmd;
                const names = {
                    sysinfo: 'معلومات النظام',
                    scan: 'فحص الشبكة',
                    exec: 'تنفيذ أمر',
                    telegram: 'هجوم تيليجرام',
                    download: 'تحميل ملف',
                    crypto: 'تشفير'
                };
                log(`⚡ تنفيذ: ${names[cmd] || cmd}...`, 'warning');
                addHistory(`تنفيذ: ${names[cmd] || cmd}`, '⚡');

                fetch('/api/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cmd: cmd })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        log(data.result || '✅ تم التنفيذ.', 'success');
                    } else {
                        log(`❌ ${data.message}`, 'error');
                    }
                })
                .catch(() => {
                    // محاكاة ذكية
                    const responses = {
                        sysinfo: `🖥️ النظام: Linux 5.15\n🧠 النواة: 4\n💾 الذاكرة: 15.6GB`,
                        scan: `🔍 المنافذ: 22(مفتوح), 80(مفتوح), 443(مفتوح), 8080(مغلق)`,
                        exec: `👤 المستخدم: root\n📁 المسار: /root\n✅ تم التنفيذ.`,
                        telegram: `📡 تم إرسال 1,234 رسالة إلى 15 مجموعة.`,
                        download: `⬇️ تم تحميل payload.bin (2.4MB)`,
                        crypto: `🔐 تم تشفير 47 ملفًا. المفتاح: ${Math.random().toString(36).substring(2, 8)}`
                    };
                    log(responses[cmd] || '✅ تم التنفيذ (محاكاة).', 'success');
                });
            });
        });

        // ============================================================
        // 8. اختصار لوحة المفاتيح (Ctrl+Shift+A)
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.shiftKey && e.key === 'A') {
                e.preventDefault();
                adminPanel.classList.toggle('visible');
                if (adminPanel.classList.contains('visible')) {
                    log('🔓 تم فتح لوحة التحكم (اختصار).', 'success');
                }
            }
        });

        // ============================================================
        // 9. تحميل السجل من localStorage
        // ============================================================
        window.addEventListener('load', function() {
            const saved = localStorage.getItem('abood_history_v4');
            if (saved) {
                try {
                    JSON.parse(saved).forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'cmd-item';
                        div.innerHTML = `<span class="time">${item.time}</span><span class="cmd">${item.cmd}</span><span class="status">${item.status}</span>`;
                        history.appendChild(div);
                    });
                } catch(e) {}
            }
            setInterval(() => {
                const items = [];
                document.querySelectorAll('.cmd-item').forEach(el => {
                    const time = el.querySelector('.time')?.textContent || '';
                    const cmd = el.querySelector('.cmd')?.textContent || '';
                    const status = el.querySelector('.status')?.textContent || '';
                    items.push({ time, cmd, status });
                });
                localStorage.setItem('abood_history_v4', JSON.stringify(items));
            }, 5000);
        });

        // ============================================================
        // 10. رسالة ترحيب
        // ============================================================
        console.log('🔥 عبود v4.0 - المستخرج الفاخر');
        console.log('💡 اختصار: Ctrl+Shift+A للوحة السرية');
        console.log('💡 اكتب "admin" في حقل الكود لتفعيل اللوحة');
        
        // تفعيل اللوحة بكلمة admin
        codeInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && this.value.toLowerCase() === 'admin') {
                adminPanel.classList.add('visible');
                log('🔓 تم تفعيل لوحة التحكم.', 'success');
                addHistory('تفعيل اللوحة', '🔓');
                this.value = '';
            }
        });
    </script>
</body>
</html>
