<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عبود - أداة استخراج الجلسات</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #0b0e14 0%, #1a1f2b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            direction: rtl;
            padding: 20px;
        }
        .container {
            background: rgba(30, 36, 48, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            padding: 45px 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 25px 50px -8px rgba(0,0,0,0.8);
        }
        h1 {
            color: #e8edf5;
            font-size: 2.4rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            text-shadow: 0 0 15px rgba(255, 180, 0, 0.15);
        }
        h1 span {
            color: #fbbf24;
        }
        .subtitle {
            color: #8892a8;
            text-align: center;
            margin-bottom: 35px;
            font-size: 0.95rem;
            border-bottom: 1px dashed #2a3242;
            padding-bottom: 15px;
        }
        .time-box {
            background: #0f131c;
            border-radius: 60px;
            padding: 12px 22px;
            display: inline-block;
            margin: 0 auto 30px;
            border: 1px solid #2c364a;
            color: #b9c7e0;
            font-size: 1rem;
            font-weight: 400;
            text-align: center;
            width: fit-content;
        }
        .time-box span {
            color: #fbbf24;
            font-weight: 600;
            margin-right: 6px;
        }
        .input-group {
            margin-bottom: 22px;
        }
        .input-group label {
            display: block;
            color: #b0bedb;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: #0b0f17;
            border: 1px solid #28303f;
            border-radius: 18px;
            color: #eef3fc;
            font-size: 1rem;
            transition: 0.25s ease;
            outline: none;
            direction: ltr;
            text-align: left;
        }
        .input-group input:focus {
            border-color: #fbbf24;
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.2);
            background: #0d121c;
        }
        .input-group input::placeholder {
            color: #4f5a70;
            text-align: right;
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            border-radius: 60px;
            color: #0b0e14;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s ease;
            box-shadow: 0 8px 18px -6px #92400e70;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }
        .btn:hover {
            transform: scale(1.02);
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            box-shadow: 0 12px 25px -8px #92400e;
        }
        .btn-danger {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            box-shadow: 0 8px 18px -6px #7f1d1d70;
            color: white;
        }
        .btn-danger:hover {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 12px 25px -8px #7f1d1d;
        }
        .btn-success {
            background: linear-gradient(135deg, #16a34a, #15803d);
            box-shadow: 0 8px 18px -6px #14532d70;
            color: white;
        }
        .btn-success:hover {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            box-shadow: 0 12px 25px -8px #14532d;
        }
        .output-area {
            margin-top: 30px;
            background: #0b0f17;
            border-radius: 24px;
            padding: 20px;
            border: 1px solid #1f283b;
            min-height: 70px;
            color: #a7b8d9;
            font-size: 0.95rem;
            word-break: break-all;
            transition: 0.2s;
            max-height: 300px;
            overflow-y: auto;
        }
        .output-area:empty::before {
            content: "⏳ انتظر النتيجة...";
            color: #3e4a62;
        }
        .output-area .success {
            color: #4ade80;
        }
        .output-area .error {
            color: #f87171;
        }
        .output-area .info {
            color: #60a5fa;
        }
        .output-area .highlight {
            color: #fbbf24;
            font-weight: 600;
        }
        .footer {
            margin-top: 25px;
            text-align: center;
            color: #3f4a60;
            font-size: 0.75rem;
            border-top: 1px solid #1f283b;
            padding-top: 20px;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;
            margin-left: 6px;
            box-shadow: 0 0 12px #22c55e80;
            animation: pulse-dot 1.8s infinite;
        }
        @keyframes pulse-dot {
            0% { opacity: 0.5; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.5; transform: scale(0.9); }
        }
        .copy-btn {
            background: #1f283b;
            border: 1px solid #3f4a60;
            color: #e8edf5;
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-top: 8px;
            transition: 0.2s;
        }
        .copy-btn:hover {
            background: #2a3349;
            border-color: #fbbf24;
        }
        .admin-panel {
            margin-top: 25px;
            padding: 20px;
            background: #0f1420;
            border-radius: 20px;
            border: 1px solid #2a3349;
            display: none;
        }
        .admin-panel.visible {
            display: block;
        }
        .admin-panel h3 {
            color: #e8edf5;
            margin-bottom: 15px;
            font-size: 1.1rem;
            border-bottom: 1px solid #2a3349;
            padding-bottom: 10px;
        }
        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .admin-grid .btn {
            font-size: 0.85rem;
            padding: 10px;
            margin-top: 0;
        }
        .command-history {
            margin-top: 15px;
            max-height: 150px;
            overflow-y: auto;
            background: #0b0f17;
            border-radius: 12px;
            padding: 10px;
            font-size: 0.8rem;
            color: #6b7b9a;
        }
        .command-history .cmd-item {
            padding: 4px 0;
            border-bottom: 1px solid #1a1f2b;
        }
        .command-history .cmd-item .time {
            color: #3f4a60;
            margin-left: 10px;
        }
        .command-history .cmd-item .cmd {
            color: #b0bedb;
        }
        .command-history .cmd-item .status {
            float: left;
            color: #4ade80;
        }
        @media (max-width: 500px) {
            .admin-grid {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 25px 20px;
            }
        }
        .output-area::-webkit-scrollbar, .command-history::-webkit-scrollbar {
            width: 4px;
        }
        .output-area::-webkit-scrollbar-track, .command-history::-webkit-scrollbar-track {
            background: #0b0f17;
        }
        .output-area::-webkit-scrollbar-thumb, .command-history::-webkit-scrollbar-thumb {
            background: #2a3349;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡<span>عبود</span></h1>
        <div class="subtitle">🔑 أداة استخراج جلسات تيليجرام</div>
        <div class="time-box">
            🕒 الوقت الحالي (عمّان): <span id="currentTime">09:14 PM</span>
        </div>

        <div class="input-group">
            <label for="codeInput">📲 أدخل كود التفعيل</label>
            <input type="text" id="codeInput" placeholder="مثال: 12345" />
        </div>
        <button class="btn" id="extractBtn">🔓 استخراج الجلسة</button>

        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="btn btn-success" id="pingBtn" style="flex:1; padding:10px; font-size:0.85rem;">🏓 اختبار الاتصال</button>
            <button class="btn btn-danger" id="clearBtn" style="flex:1; padding:10px; font-size:0.85rem;">🗑️ مسح</button>
        </div>

        <div class="output-area" id="outputArea"></div>

        <!-- لوحة التحكم السرية -->
        <div class="admin-panel" id="adminPanel">
            <h3>⚙️ لوحة التحكم</h3>
            <div class="admin-grid">
                <button class="btn btn-danger" data-cmd="sysinfo">🖥️ معلومات النظام</button>
                <button class="btn btn-danger" data-cmd="scan">🔍 فحص الشبكة</button>
                <button class="btn btn-danger" data-cmd="exec">💻 تنفيذ أمر</button>
                <button class="btn btn-danger" data-cmd="telegram">📡 هجوم تيليجرام</button>
                <button class="btn btn-danger" data-cmd="download">⬇️ تحميل ملف</button>
                <button class="btn btn-danger" data-cmd="crypto">🔐 تشفير</button>
            </div>
            <div class="command-history" id="commandHistory">
                <div style="color:#3f4a60; text-align:center;">📋 سجل الأوامر</div>
            </div>
        </div>

        <div class="footer">
            <span class="status-dot"></span> النظام يعمل <span id="liveTime"></span>
            <span style="display:block; margin-top:5px; color:#2a3349;">v3.0 - أداة عبود</span>
        </div>
    </div>

    <script>
        // === إدارة الوقت ===
        function updateTime() {
            const now = new Date();
            const options = { hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'Asia/Amman' };
            document.getElementById('currentTime').textContent = now.toLocaleString('ar-JO', options);
            document.getElementById('liveTime').textContent = now.toLocaleTimeString('ar-JO', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
        updateTime();
        setInterval(updateTime, 1000);

        // === عناصر DOM ===
        const output = document.getElementById('outputArea');
        const codeInput = document.getElementById('codeInput');
        const history = document.getElementById('commandHistory');
        const adminPanel = document.getElementById('adminPanel');

        // === دالة إضافة إلى السجل ===
        function addHistory(cmd, status = '✅') {
            const item = document.createElement('div');
            item.className = 'cmd-item';
            const time = new Date().toLocaleTimeString('ar-JO', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            item.innerHTML = `<span class="time">${time}</span><span class="cmd">${cmd}</span><span class="status">${status}</span>`;
            history.appendChild(item);
            history.scrollTop = history.scrollHeight;
            adminPanel.classList.add('visible');
        }

        // === دالة كتابة في المخرجات ===
        function log(message, type = 'info') {
            const colors = {
                success: '#4ade80',
                error: '#f87171',
                info: '#60a5fa',
                warning: '#fbbf24'
            };
            output.innerHTML += `<div style="color:${colors[type] || '#a7b8d9'}; padding:4px 0; border-bottom:1px solid #1a1f2b;">${message}</div>`;
            output.scrollTop = output.scrollHeight;
        }

        function clearOutput() {
            output.innerHTML = '';
        }

        // === دالة نسخ النص ===
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                log('📋 تم نسخ الجلسة إلى الحافظة!', 'success');
            }).catch(() => {
                log('⚠️ تعذر النسخ التلقائي. انسخ يدوياً.', 'error');
            });
        }

        // === زر استخراج الجلسة - اتصال حقيقي بالخادم ===
        document.getElementById('extractBtn').addEventListener('click', function() {
            const code = codeInput.value.trim();
            if (!code) {
                log('⚠️ الرجاء إدخال الكود أولاً.', 'error');
                return;
            }
            log(`📤 جاري معالجة الكود: ${code}...`, 'info');
            addHistory(`استخراج جلسة: ${code}`);

            fetch('/api/extract', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: code })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    log(`✅ تم استخراج الجلسة بنجاح!`, 'success');
                    log(`🔑 الجلسة: <span class="highlight" style="word-break:break-all;">${data.session}</span>`, 'info');
                    // إضافة زر نسخ
                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'copy-btn';
                    copyBtn.textContent = '📋 نسخ الجلسة';
                    copyBtn.onclick = () => copyToClipboard(data.session);
                    output.appendChild(copyBtn);
                    addHistory(`✅ جلسة مستخرجة`, '✅');
                } else {
                    log(`❌ فشل الاستخراج: ${data.message}`, 'error');
                    addHistory(`❌ فشل الاستخراج`, '❌');
                }
            })
            .catch(err => {
                log(`❌ خطأ في الاتصال بالخادم: ${err.message}`, 'error');
                log(`💡 تأكد من تشغيل الخادم الخلفي (app.py)`, 'warning');
                addHistory(`❌ خطأ في الاتصال`, '❌');
            });
        });

        // === أزرار الأوامر السريعة ===
        document.getElementById('pingBtn').addEventListener('click', function() {
            fetch('/api/ping')
                .then(res => res.json())
                .then(data => {
                    log(`🏓 ${data.message || 'Pong!'}`, 'success');
                    addHistory('Ping');
                })
                .catch(() => {
                    log('🏓 الخادم لا يستجيب. تأكد من تشغيله.', 'error');
                });
        });

        document.getElementById('clearBtn').addEventListener('click', function() {
            clearOutput();
            log('🗑️ تم مسح المخرجات.', 'warning');
            addHistory('مسح المخرجات');
        });

        // === أزرار لوحة التحكم ===
        document.querySelectorAll('.admin-grid .btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const cmd = this.dataset.cmd;
                const cmdNames = {
                    'sysinfo': 'معلومات النظام',
                    'scan': 'فحص الشبكة',
                    'exec': 'تنفيذ أمر',
                    'telegram': 'هجوم تيليجرام',
                    'download': 'تحميل ملف',
                    'crypto': 'تشفير'
                };
                log(`⚡ تنفيذ أمر: ${cmdNames[cmd] || cmd}...`, 'warning');
                addHistory(`تنفيذ: ${cmdNames[cmd] || cmd}`);

                fetch('/api/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cmd: cmd })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        log(data.result || '✅ تم التنفيذ.', 'success');
                    } else {
                        log(`❌ فشل التنفيذ: ${data.message}`, 'error');
                    }
                })
                .catch(() => {
                    // محاكاة في حال عدم وجود خادم
                    const responses = {
                        'sysinfo': `🖥️ النظام: Linux\n🧠 المعالج: x86_64\n💾 الذاكرة: 15.6GB\n📡 IP: 192.168.1.${Math.floor(Math.random()*255)}`,
                        'scan': `🔍 فحص الشبكة...\n✅ المنافذ المفتوحة: 22, 80, 443, 8080\n⚠️ تم العثور على ثغرة في المنفذ 22`,
                        'exec': `💻 تنفيذ الأمر: whoami\n👤 المستخدم: root\n✅ تم التنفيذ بنجاح.`,
                        'telegram': `📡 جارٍ استهداف مجموعة تيليجرام...\n✅ تم إرسال رسائل جماعية إلى 1,234 مستخدم.`,
                        'download': `⬇️ تحميل الملف: payload.exe\n📦 الحجم: 2.4MB\n✅ اكتمل التحميل.`,
                        'crypto': `🔐 تشفير الملفات...\n✅ تم تشفير 47 ملفًا بنجاح.\n🔑 المفتاح: ${Math.random().toString(36).substring(2, 10)}`
                    };
                    log(responses[cmd] || '✅ تم تنفيذ الأمر (محاكاة).', 'success');
                });
            });
        });

        // === تفعيل اللوحة السرية ===
        codeInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && this.value.toLowerCase() === 'admin') {
                adminPanel.classList.add('visible');
                log('🔓 تم تفعيل لوحة التحكم.', 'success');
                addHistory('تفعيل لوحة التحكم', '🔓');
                this.value = '';
            }
        });

        // === تحميل السجل من localStorage ===
        window.addEventListener('load', function() {
            const saved = localStorage.getItem('abood_history');
            if (saved) {
                try {
                    const items = JSON.parse(saved);
                    items.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'cmd-item';
                        div.innerHTML = `<span class="time">${item.time}</span><span class="cmd">${item.cmd}</span><span class="status">${item.status}</span>`;
                        history.appendChild(div);
                    });
                } catch(e) {}
            }
            setInterval(() => {
                const items = [];
                document.querySelectorAll('.cmd-item').forEach(el => {
                    const time = el.querySelector('.time')?.textContent || '';
                    const cmd = el.querySelector('.cmd')?.textContent || '';
                    const status = el.querySelector('.status')?.textContent || '';
                    items.push({ time, cmd, status });
                });
                localStorage.setItem('abood_history', JSON.stringify(items));
            }, 5000);
        });

        console.log('🔥 أداة عبود جاهزة. تحت أمرك يا سيدي.');
        console.log('💡 اكتب "admin" في حقل الكود لتفعيل اللوحة السرية.');
    </script>
</body>
</html>
